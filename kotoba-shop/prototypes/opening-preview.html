<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>島へ向かう物語｜オープニング確認</title><link rel="stylesheet" href="../town-opening.css?v=2-fullscreen"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#b5e1ec,#f1eed8);color:#385c57;font:18px/1.8 system-ui,sans-serif}main{width:min(580px,calc(100% - 40px));text-align:center;padding:30px 0}h1{font-size:30px}p{font-size:15px}input,button{font:inherit;border:1px solid #b3c8b4;border-radius:16px;padding:12px;background:#fffaf0;color:#385c57}input{max-width:90%;text-align:center}.heroes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}button{cursor:pointer}a{color:#385c57}</style></head><body><main><p>ことばのまちと小さなお店</p><h1>風の向こうの島へ</h1><p>青空から、船旅、港での出会いまで。</p><label>主人公のなまえ<br><input id="previewName" value="ハル" maxlength="16"></label><div class="heroes"><button data-hero="girl">ひよりで見る</button><button data-hero="boy">そらで見る</button><button data-hero="tsuki">つきで見る</button><button data-hero="green">はるとで見る</button></div><p id="previewStatus">セリフは「次へ」で読み進められます。<br>本編のセーブデータは読み書きしません。</p><a href="../">本編へ</a></main><script src="../vendor/three.min.js?v=160"></script><script src="./software-3d.js?v=22-four-heroes"></script><script src="./hero-models.js?v=22-four-heroes"></script><script src="../town-opening.js?v=1-arrival"></script><script>for(const b of document.querySelectorAll('[data-hero]'))b.onclick=()=>TownOpening.play({kind:b.dataset.hero,name:document.getElementById('previewName').value.trim().slice(0,16)||'ハル',reducedMotion:matchMedia('(prefers-reduced-motion:reduce)').matches,onFinish:()=>document.getElementById('previewStatus').textContent='物語の確認が終わりました。もう一度見る主人公を選べます。'});</script></body></html>
