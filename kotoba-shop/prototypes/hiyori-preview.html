<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひより｜3D試作ビューア</title>
<style>body{margin:0;background:#f6f1e8;color:#3e4c42;font-family:system-ui,sans-serif}header{padding:16px;text-align:center}h1{font-size:21px;margin:0 0 6px}p{margin:5px}#stage{display:block;width:100%;height:min(67vh,640px);touch-action:pan-y;background:linear-gradient(#dce9e7,#f5ede0)}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:14px}button{border:1px solid #aabbb0;border-radius:12px;background:white;color:#354e41;padding:11px 15px;font-size:15px}button[aria-pressed=true]{background:#d1e5d6}#status{text-align:center;font-size:13px;padding:10px}</style>
</head><body><header><h1>ひより｜ローポリゴン3D試作</h1><p>本番ゲームとは独立した確認画面です</p></header><canvas id="stage"></canvas><div class="controls"><button data-angle="0">正面</button><button data-angle="1.57079632679">右側</button><button data-angle="3.14159265359">背面</button><button data-angle="-1.57079632679">左側</button><button id="rotate" aria-pressed="false">自動回転</button><button id="walk" aria-pressed="false">歩行</button></div><div id="status" role="status">読み込み中…</div>
<script src="../vendor/three.min.js"></script>
<script>
(function(){
const stage=document.getElementById('stage'),status=document.getElementById('status');
if(!window.THREE){status.textContent='Three.jsが読み込めませんでした';return;}
const geometry={},materials={};
window.town3DMesh=function(parent,type,color,x,y,z,sx,sy,sz){
const key=type;if(!geometry[key])geometry[key]=type==='sphere'?new THREE.SphereGeometry(1,10,7):type==='cone'?new THREE.ConeGeometry(1,1,5):type==='cylinder'?new THREE.CylinderGeometry(1,1,1,12):new THREE.BoxGeometry(1,1,1);
if(!materials[color])materials[color]=new THREE.MeshStandardMaterial({color,flatShading:true,roughness:.83});
const mesh=new THREE.Mesh(geometry[key],materials[color]);mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);parent.add(mesh);return mesh;};
})();
</script>
<script src="./hiyori-lowpoly.js"></script>
<script>
(function(){
const status=document.getElementById('status'),canvas=document.getElementById('stage');
try{
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,100);
camera.position.set(0,1.55,5.3);camera.lookAt(0,1.05,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x9a998d,2.1));
const light=new THREE.DirectionalLight(0xffffff,1.3);light.position.set(-3,7,5);scene.add(light);
const model=createHiyoriPrototype();scene.add(model);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.07,24),new THREE.MeshStandardMaterial({color:0xe1dfd4,roughness:1}));floor.position.y=-.055;scene.add(floor);
let angle=0,rotating=false,walking=false;
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=Number(b.dataset.angle);rotating=false;document.getElementById('rotate').setAttribute('aria-pressed','false');});
document.getElementById('rotate').onclick=e=>{rotating=!rotating;e.currentTarget.setAttribute('aria-pressed',String(rotating));};
document.getElementById('walk').onclick=e=>{walking=!walking;e.currentTarget.setAttribute('aria-pressed',String(walking));};
let last=performance.now(),time=0;
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;if(rotating)angle+=dt*.7;model.rotation.y=angle;
const swing=walking?Math.sin(time*8)*.45:0;model.userData.leftLeg.rotation.x=swing;model.userData.rightLeg.rotation.x=-swing;model.userData.leftArm.rotation.x=-swing*.7;model.userData.rightArm.rotation.x=swing*.7;
const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
renderer.render(scene,camera);requestAnimationFrame(frame);}
status.textContent='3Dモデル読み込み完了。方向・歩行・回転を確認できます。';requestAnimationFrame(frame);
}catch(e){status.textContent='描画エラー: '+e.message;console.error(e);}
})();
</script></body></html>
