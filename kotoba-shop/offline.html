function tileArt(sheet,id,x,y,w=32,h=32){const im=worldImages[sheet];if(!im.complete||!im.naturalWidth)return;const cols=sheet==='town'?12:8;ctx.drawImage(im,id%cols*16,Math.floor(id/cols)*16,16,16,Math.round(x),Math.round(y),w,h)}
const characterBeforeWorld=character;character=function(x,y,color,ears=false,kind='human',phase=0,dir='down'){const im=worldImages.actors;if(!im.complete||!im.naturalWidth){characterBeforeWorld(x,y,color,ears,kind,phase,dir);return}let row=0,step=null;if(kind!=='human'){const n=npcs.find(n=>n.color===color);row=worldNpcConfig[n?.name]?.row||1;step=worldNpcState[n?.name]?.step}else step=walkStep;const facingIndex={down:0,left:1,right:2,up:3}[dir]??0;const frame=step?(Math.floor((performance.now()-step.start)/(kind==='human'?WALK_MS:NPC_WALK_MS)*3)%3):0;ctx.fillStyle='#29492c45';ctx.beginPath();ctx.ellipse(Math.round(x*T+16),Math.round(y*T+29),10,4,0,0,Math.PI*2);ctx.fill();ctx.drawImage(im,(facingIndex*3+frame)*16,row*24,16,24,Math.round(x*T),Math.round(y*T-16),32,48)};
const furnitureChipBeforeWorld=drawFurnitureChip;drawFurnitureChip=function(f){const i=Object.keys(FURNITURE).indexOf(f.kind);tileArt('details',16+Math.max(0,i),f.x*T,f.y*T)};
function drawWorldBuilding(b){const x=b.x*T,y=b.y*T;const roof=b.color==='blue'?[48,49,50,60,61,62,63]:[52,53,54,64,65,66,67];for(let dx=0;dx<b.w;dx++){tileArt('town',dx===0?roof[0]:dx===b.w-1?roof[2]:roof[1],x+dx*T,y);tileArt('town',dx===0?roof[3]:dx===b.w-1?roof[5]:dx===Math.floor(b.w/2)?roof[6]:roof[4],x+dx*T,y+T)}for(let dy=2;dy<b.h;dy++)for(let dx=0;dx<b.w;dx++){let id=b.color==='blue'?(dx===0?76:dx===b.w-1?79:77):(dx===0?72:dx===b.w-1?75:73);if(dy===b.h-1&&dx===Math.floor(b.w/2))id=b.color==='blue'?89:85;else if(dy===b.h-2&&(dx===1||dx===b.w-2))id=b.color==='blue'?88:84;tileArt('town',id,x+dx*T,y+dy*T)}label(b.name,x+b.w*T/2,y+2*T-4,'#fff1cf')}
function drawWorldTree(t){if(t.tile===18){for(let dy=0;dy<2;dy++)for(let dx=0;dx<3;dx++)tileArt('town',18+dx+dy*12,(t.x+dx-1)*T,(t.y+dy-1)*T)}else tileArt('town',t.tile,t.x*T,t.y*T)}
function drawPoi(p,now){if(p.type==='discover'){if(state.explore.found[p.id])return;const lift=state.settings.reducedMotion?0:Math.sin(now/350)*2;tileArt('details',9,p.x*T,p.y*T+lift);return}let id=['fish','lakeFish'].includes(p.type)?7:['riddle'].includes(p.type)?14:p.type==='cache'?9:p.type==='flowers'?11:p.type==='well'?15:p.type==='view'?8:p.type==='bugs'?5:7;tileArt('details',id,p.x*T,p.y*T);if(Math.abs(p.x-visualX)+Math.abs(p.y-visualY)<6)label(p.name,p.x*T+16,p.y*T-4,'#fff2ce')}
function worldGround(m,now){const left=Math.max(0,Math.floor(camera.x/T)-1),top=Math.max(0,Math.floor(camera.y/T)-1),right=Math.min(m.w-1,Math.ceil((camera.x+c.width)/T)+1),bottom=Math.min(m.h-1,Math.ceil((camera.y+c.height)/T)+1);for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++){const t=m.tiles[y][x],xx=x*T,yy=y*T;tileArt('town',0,xx,yy);if(t===1){const u=m.tiles[y-1]?.[x]!==1&&m.tiles[y-1]?.[x]!==2,l=m.tiles[y]?.[x-1]!==1&&m.tiles[y]?.[x-1]!==2,r=m.tiles[y]?.[x+1]!==1&&m.tiles[y]?.[x+1]!==2,b=m.tiles[y+1]?.[x]!==1&&m.tiles[y+1]?.[x]!==2;tileArt('town',u?(l?12:r?14:13):b?(l?36:r?38:37):l?24:r?26:25,xx,yy)}else if(t===2)tileArt('details',31,xx,yy);else if(t===3)tileArt('details',state.settings.reducedMotion?0:Math.floor(now/850)%2,xx,yy);else if(t===4)tileArt('details',4,xx,yy);else if(t===5)tileArt('details',2,xx,yy);else if(t===6){ctx.fillStyle='#9ba58c';ctx.fillRect(xx,yy,32,32);ctx.fillStyle='#818d78';ctx.fillRect(xx,yy+30,32,2);ctx.fillRect(xx+30,yy,2,32)}else{const n=(x*17+y*31+m.key.length*13)%97;if(n<6)tileArt('town',1,xx,yy);else if(n===8||m.key==='hill'&&n<18)tileArt('details',10+(x+y+Math.floor((state.day-1)/7))%3,xx,yy);if(season()==='秋'){ctx.fillStyle='#d7ad6622';ctx.fillRect(xx,yy,32,32)}if(season()==='冬'){ctx.fillStyle='#e5ead45a';ctx.fillRect(xx,yy,32,32)}}}}
function drawOutdoor(now,dt){const m=maps[state.area];const look=walkStep?{up:[0,-38],down:[0,38],left:[-46,0],right:[46,0]}[facing]:[0,0];const cx=Math.max(0,Math.min(m.w*T-c.width,visualX*T+16-c.width/2+look[0])),cy=Math.max(0,Math.min(m.h*T-c.height,visualY*T+16-c.height/2+look[1]));if(!camera.ready||state.settings.reducedMotion){camera.x=cx;camera.y=cy;camera.ready=true}else{const blend=1-Math.exp(-dt*8);camera.x+=(cx-camera.x)*blend;camera.y+=(cy-camera.y)*blend}ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#83b96b';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(-Math.round(camera.x),-Math.round(camera.y));worldGround(m,now);if(state.area==='farm')drawFarm();
 const objects=[];for(const b of m.buildings)objects.push({z:(b.y+b.h)*T,fn:()=>drawWorldBuilding(b)});for(const t of m.trees)objects.push({z:(t.y+1)*T,fn:()=>drawWorldTree(t)});for(const f of (m.fences||[]))objects.push({z:(f.y+1)*T,fn:()=>tileArt('town',f.vertical?47:45,f.x*T,f.y*T)});if(state.area==='ruins')objects.push({z:11*T,fn:()=>{for(let y=0;y<2;y++)for(let x=0;x<3;x++)tileArt('town',111+x+y*12,(29+x)*T,(8+y)*T)}});for(const r of m.rocks)objects.push({z:(r.y+1)*T,fn:()=>tileArt('details',6,r.x*T,r.y*T)});for(const p of m.pois)objects.push({z:(p.y+1)*T,fn:()=>drawPoi(p,now)});for(const n of npcs)if(worldNpcConfig[n.name]?.area===state.area)objects.push({z:(n.vy+1)*T,fn:()=>{character(n.vx,n.vy,n.color,n.name==='ミミ','animal',now,n.face);label(n.name,n.vx*T+16,n.vy*T-18,'#fff1cc')}});objects.push({z:(visualY+1)*T+.1,fn:()=>character(visualX,visualY,'#477db0',false,'human',now,facing)});objects.sort((a,b)=>a.z-b.z);for(const obj of objects)obj.fn();

const legacyDrawWorld=draw;let worldAutosave=performance.now();
draw=function(now=performance.now()){const dt=Math.max(0,Math.min(.06,(now-worldLastTime)/1000));worldLastTime=now;updateWalk(now);updateWorldNpcs(now);if(state.scene==='town'){drawOutdoor(now,dt);requestAnimationFrame(draw)}else{ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#263b34';ctx.fillRect(0,0,c.width,c.height);const scale=Math.min(c.width/640,c.height/384);ctx.save();ctx.translate((c.width-640*scale)/2,(c.height-384*scale)/2);ctx.scale(scale,scale);lastFrame=now;legacyDrawWorld(now);ctx.restore()}if(areaFade>now&&!state.settings.reducedMotion){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#152e2a';ctx.globalAlpha=Math.min(1,(areaFade-now)/300);ctx.fillRect(0,0,c.width,c.height);ctx.restore()}if(now-contextTick>150){updateWorldHud();contextTick=now}if(now-worldAutosave>30000){save(false);worldAutosave=now}};
