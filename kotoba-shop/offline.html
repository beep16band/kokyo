drawPoi=function(p,now){if(p.type==='discover'){if(state.explore.found[p.id])return;const x=p.x*T+7,y=p.y*T+9+(state.settings.reducedMotion?0:Math.sin(now/500)*2);cozyShadow(ctx,x+9,y+21,9,2);cozyRound(ctx,x,y,19,14,3,'#fff5d5');cozyPoly(ctx,[[x,y+1],[x+9.5,y+8],[x+19,y+1]],'#e7c995');cozyOval(ctx,x+9,y+8,2,2,'#cf9a73');return}const x=p.x*T,y=p.y*T;if(['fish','lakeFish'].includes(p.type)){cozyRound(ctx,x+4,y+11,24,19,4,'#bc9a70');cozyRound(ctx,x+2,y+7,28,18,4,'#fff0ca');ctx.save();ctx.fillStyle='#729b9d';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('〜',x+16,y+21);ctx.restore()}else if(p.type==='well'){cozyShadow(ctx,x+16,y+29,16,4);cozyOval(ctx,x+16,y+21,15,10,'#b6b69c');cozyRound(ctx,x+1,y+13,30,11,2,'#c9c6ac');cozyOval(ctx,x+16,y+13,15,8,'#e3ddc0');cozyOval(ctx,x+16,y+13,10,5,'#638d8b');cozyRound(ctx,x+2,y-10,3,26,1,'#ae8b61');cozyRound(ctx,x+27,y-10,3,26,1,'#ae8b61');cozyPoly(ctx,[[x-4,y-8],[x+16,y-21],[x+36,y-8]],'#789e8a')}else if(p.type==='view'){cozyShadow(ctx,x+16,y+28,17,3);for(const xx of [4,25])cozyRound(ctx,x+xx,y+10,3,20,1,'#86755a');cozyRound(ctx,x,y+4,32,7,2,'#ccac7f');cozyRound(ctx,x,y+14,32,7,2,'#dfbe8b')}else if(p.type==='flowers'){for(let i=0;i<5;i++)cozyFlower(ctx,x+4+i*6,y+13+i%2*8,i%2?'#f0bdac':'#fff0cb',1)}else if(p.type==='bugs'){cozyShadow(ctx,x+16,y+28,13,3);cozyRound(ctx,x+4,y+12,24,17,4,'#b18e65');cozyOval(ctx,x+16,y+12,13,7,'#dfc493');ctx.strokeStyle='#bc9b6c';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x+16,y+12,8,4,0,0,7);ctx.stroke()}else if(p.type==='riddle'){cozyRound(ctx,x+2,y+2,28,29,[9,9,3,3],cozyGrad(ctx,x,y,32,'#c7ccb4','#93a494'));ctx.fillStyle='#6e8f80';for(let i=0;i<3;i++)ctx.fillRect(x+10,y+9+i*5,12-i*2,2)}else if(p.type==='cache'){cozyRound(ctx,x+3,y+10,26,20,4,'#b58b5e');cozyRound(ctx,x+2,y+7,28,10,4,'#d6b77d');cozyRound(ctx,x+14,y+14,4,6,1,'#f4d997')}else{cozyRound(ctx,x+13,y+7,6,25,2,'#a98a62');cozyRound(ctx,x+1,y-4,30,24,4,'#b48e5f');cozyRound(ctx,x+4,y-1,24,17,2,p.type==='board'?'#fff0cc':'#e9d6
