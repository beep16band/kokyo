let suspendSave=false,choiceRevision=0;const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const dialog=document.getElementById('dialog'),choices=document.getElementById('choices'),stats=document.getElementById('stats');let state={x:8,y:9,coins:0,sales:0,scene:'town',visited:{},name:'ハル',day:1,ordersDone:0},keys={},busy=false;try{const s=JSON.parse(localStorage.getItem('kotoba_shop_v1'));if(s&&Number.isInteger(s.x)&&['town','shop','home'].includes(s.scene))state={...state,...s}}catch{};state.day=Number.isInteger(state.day)&&state.day>0?state.day:1;state.ordersDone=Number.isInteger(state.ordersDone)?Math.max(0,Math.min(100,state.ordersDone)):0;state.coins=Number.isFinite(state.coins)?Math.max(0,state.coins):0;
for(const k of ['stock','shelfStock','visited','ledger','customerAffinity','customerVisits','specialRequests','storyEvents','farmBag','farmHarvest','produceShelf','roomRewards'])if(!state[k]||typeof state[k]!=='object'||Array.isArray(state[k]))delete state[k];
state.sales=Math.max(0,Math.floor(Number(state.sales)||0));
state.x=Number.isInteger(state.x)?Math.max(1,Math.min(18,state.x)):8;state.y=Number.isInteger(state.y)?Math.max(1,Math.min(10,state.y)):9;
if(!state.shopInitialized){state.coins+=300;state.shopInitialized=true}const DEFAULT_STOCK={bread:3,juice:2,apple:3};state.stock={...DEFAULT_STOCK,...(state.stock||{})};for(const k of Object.keys(DEFAULT_STOCK))state.stock[k]=Math.max(0,Math.floor(Number(state.stock[k])||0));const PRODUCT_KEYS=['bread','juice','apple'];
// 旧セーブデータでは従来の在庫をバックヤード在庫として保持する。
if(!state.shelfStock){state.shelfStock={bread:0,juice:0,apple:0}}
for(const k of PRODUCT_KEYS)state.shelfStock[k]=Math.max(0,Math.floor(Number(state.shelfStock[k])||0));
// 日別会計。旧データの過去の取引は復元できないため、新規取引から記録する。
function blankLedger(day){return {day,revenue:0,purchases:0,units:{bread:0,juice:0,apple:0},orders:0}}
if(!state.ledger||state.ledger.day!==state.day)state.ledger=blankLedger(state.day);
if(!Array.isArray(state.reports))state.reports=[];
function yen(n){return Math.floor(n)+'コイン'}
function reportText(r){return r.day+'日目：売上 '+yen(r.revenue)+' ／仕入れ '+yen(r.purchases)+' ／差額 '+yen(r.revenue-r.purchases)+' ／接客 '+r.orders+'件。売れた商品：'+PRODUCT_KEYS.map(k=>({bread:'パン',juice:'ジュース',apple:'りんご'})[k]+' '+(r.units[k]||0)+'個').join('、')+'。'}
function showReport(){tell('【本日の営業レポート】'+reportText(state.ledger)+' ※差額は当日の現金収支で、売れ残り在庫の原価は含みません。');renderChoices([['これまでの記録',()=>{tell(state.reports.length?state.reports.slice(-5).reverse().map(reportText).join(' ／ '):'まだ過去の営業記録はありません。');renderChoices([['本日のレポート',showReport],['閉じる',()=>renderChoices([])]])}],['閉じる',()=>renderChoices([])]])}
// 評判と常連客の記録。旧セーブデータは初期値から開始。
state.reputation=Math.max(0,Math.min(100,Math.floor(Number(state.reputation)||0)));
if(!state.customerVisits||typeof state.customerVisits!=='object')state.customerVisits={};
if(!state.customerAffinity||typeof state.customerAffinity!=='object')state.customerAffinity={};
if(!Array.isArray(state.unlockedGoods))state.unlockedGoods=[];

function reputationView(){const visitors=['モク','ミミ','フクじい'].map(n=>n+' '+(state.customerVisits[n]||0)+'回').join('・');tell('【お店の評判】'+reputationRank()+'（'+state.reputation+'/100）／来店記録：'+visitors+'。正しく接客すると評判が上がります。25で特別な品物、60で人気店の称号が解放されます。');renderChoices([['閉じる',()=>renderChoices([])]])}
document.getElementById('reputation').onclick=reputationView;

if(!state.specialRequests||typeof state.specialRequests!=='object')state.specialRequests={};
const requestTemplates=[
 {customer:'ミミ',item:'apple',qty:2,bonus:90,story:'花畑でがんばったみんなに、りんごを2こ届けたいの。'},
 {customer:'モク',item:'bread',qty:2,bonus:100,story:'森のお友だちと食べるパンを2こ、用意してくれる？'},
 {customer:'フクじい',item:'juice',qty:2,bonus:120,story:'広場の集まりにジュースを2ほん、お願いできるかのう。'}
];
function todaysRequest(){return requestTemplates[(state.day-1)%requestTemplates.length]}
function requestKey(){return String(state.day)}
function requestsView(){
 const r=todaysRequest(),status=state.specialRequests[requestKey()];
 if(status==='done'){tell('【特別な依頼】'+r.customer+'の依頼は達成済みです。明日また新しい依頼が届きます。');renderChoices([['閉じる',()=>renderChoices([])]]);return}
 tell('【'+r.customer+'からの依頼】「'+r.story+'」 お礼：'+r.bonus+'コイン＋評判5。棚の在庫からお渡しします。');
 renderChoices([['商品を届ける',()=>{
  if(state.shelfStock[r.item]<r.qty){tell('棚の商品が足りません。'+goods[r.item].name+'を'+r.qty+goods[r.item].unit+'そろえましょう。');renderChoices([['在庫・陳列を開く',inventory],['依頼に戻る',requestsView]]);return}
  if(state.specialRequests[requestKey()]==='done'){requestsView();return}
  state.shelfStock[r.item]-=r.qty;state.coins+=r.bonus;state.reputation=Math.min(100,state.reputation+5);
  state.customerAffinity[r.customer]=(state.customerAffinity[r.customer]||0)+1;
  state.specialRequests[requestKey()]='done';save(false);
  tell(r.customer+'「ありがとう！ とても助かったよ！」 '+r.bonus+'コインと評判＋5を獲得しました。'+(storyReady(r.customer)?' 町で'+r.customer+'に話しかけると特別な会話が始まります。':''));renderChoices([['閉じる',()=>renderChoices([])]]);
 }],['あとで届ける',()=>{renderChoices([]);tell('依頼は今日中ならいつでも受けられます。')}]]);
}
document.getElementById('requests').onclick=requestsView;
// Phase 6.1: 常連客イベントと一度きりの思い出。過去セーブとの互換性を維持。
if(!state.storyEvents||typeof state.storyEvents!=='object')state.storyEvents={};
if(!Array.isArray(state.memories))state.memories=[];
const stories={
 'ミミ':{title:'花畑の小さなお礼',threshold:3,lines:['ミミ「いつもありがとう。花畑の水やりが終わったら、お店に寄るのが楽しみなの。」','ミミ「お店ができて、町に話すきっかけが増えたね。」'],gift:40},
 'モク':{title:'森のおやつ会',threshold:3,lines:['モク「きょうは森のお友だちとおやつ会なんだ！」','モク「パンを分け合うと、いつものおやつがもっとおいしく感じるよ。」'],gift:40},
 'フクじい':{title:'広場に集まる理由',threshold:3,lines:['フクじい「昔の広場は、もっと静かだったんじゃ。」','フクじい「今はみんなが店に立ち寄り、声をかけ合う。ありがたいことじゃのう。」'],gift:40}
};
function storyReady(name){return !!stories[name]&&!state.storyEvents[name]&&(state.customerAffinity[name]||0)>=stories[name].threshold}
function playStory(name){

 let page=0;function advance(){if(page<e.lines.length){tell('【'+e.title+'】 '+e.lines[page++]);renderChoices([['つづき',advance]])}else{

}

 const placed=state.furniturePlaced;

 const pairs=[['chair','table'],['rug','cushion'],['bookshelf','lamp'],['plant','clock']];

function passable(x,y){
 if(x<1||y<1||x>=W-1||y>=H-1)return false;
 if(state.scene==='town'){
  if(treeBlocks.has(x+','+y))return false;
  if((x>=4&&x<=8&&y>=2&&y<=4)||(x>=13&&x<=17&&y>=2&&y<=4))return false;
  if(npcs.some(n=>n.x===x&&n.y===y))return false; if(FARM_PLOTS.some(p=>p.x===x&&p.y===y))return false;
 }else if(obstacles(state.scene).some(r=>within(r,x,y)))return false;
 return true;
}

function move(dx,dy){facing=dx<0?'left':dx>0?'right':dy<0?'up':'down';if(editorOpen||busy||choices.children.length)return;let nx=state.x+dx,ny=state.y+dy;if(state.scene==='town'&&dy<0&&ny===4){if(nx===6){enter('shop',10,9);return}if(nx===15){enter('home',10,9);return}}if(state.scene!=='town'&&dy>0&&nx===10&&ny===10){enter('town',state.scene==='shop'?6:15,5);return}if(passable(nx,ny)){state.x=nx;state.y=ny}else if(state.scene==='town'&&((nx>=4&&nx<=8&&ny>=2&&ny<=4)||(nx>=13&&nx<=17&&ny>=2&&ny<=4)))tell('建物に入るには、正面の扉へ進んでください。')}function npcPassable(n,x,y){return x>=1&&y>=1&&x<W-1&&y<H-1&&!treeBlocks.has(x+','+y)&&!((x>=4&&x<=8&&y>=2&&y<=4)||(x>=13&&x<=17&&y>=2&&y<=4))&&!(x===state.x&&y===state.y)&&!npcs.some(o=>o!==n&&o.x===x&&o.y===y)&&!FARM_PLOTS.some(p=>p.x===x&&p.y===y)}
function npcStep(){
 if(state.scene!=='town'||choices.children.length)return;
 const now=performance.now(),phase=timePhase();
 if(npcConversation&&now>=npcConversationUntil)npcConversation=null;
 if(npcConversation)return;
 for(const n of npcs){
  if(now<n.waitUntil)continue;
  const [cx,cy,r]=npcSchedules[n.name][phase];
  if(!n.destination||n.destination.phase!==phase||(n.x===n.destination.x&&n.y===n.destination.y)){
   if(Math.random()<.34){n.waitUntil=now+1600+Math.random()*3000;continue}
   let options=[];
   for(let y=Math.max(1,cy-r);y<=Math.min(H-2,cy+r);y++)for(let x=Math.max(1,cx-r);x<=Math.min(W-2,cx+r);x++){
    if(Math.abs(x-cx)+Math.abs(y-cy)<=r&&npcPassable(n,x,y))options.push([x,y]);
   }
   if(!options.length)continue;
   const [tx,ty]=options[Math.floor(Math.random()*options.length)];n.destination={x:tx,y:ty,phase};
  }
  const target=n.destination;
  const queue=[[n.x,n.y]],seen=new Set([n.x+','+n.y]),prev=new Map();let found=false;
  for(let qi=0;qi<queue.length&&!found;qi++){
   const [x,y]=queue[qi];if(x===target.x&&y===target.y){found=true;break}
   for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){
    const nx=x+dx,ny=y+dy,k=nx+','+ny;
    if(!seen.has(k)&&npcPassable(n,nx,ny)){seen.add(k);prev.set(k,[x,y]);queue.push([nx,ny])}
   }
  }
  if(!found){n.destination=null;n.waitUntil=now+900;continue}
  let next=[target.x,target.y];while(true){const p=prev.get(next[0]+','+next[1]);if(!p)break;if(p[0]===n.x&&p[1]===n.y)break;next=p}
  const dx=next[0]-n.x,dy=next[1]-n.y;
  if(dx||dy){n.face=dx>0?'right':dx<0?'left':dy>0?'down':'up';n.x=next[0];n.y=next[1]}
  if(n.x===target.x&&n.y===target.y)n.waitUntil=now+1100+Math.random()*2300;
 }
 // 住民が隣り合うと、ときどき短い立ち話をする。
 if(Math.random()<.10){
  for(let i=0;i<npcs.length;i++)for(let j=i+1;j<npcs.length;j++){
   const a=npcs[i],b=npcs[j];if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1)continue;
   const line=a.name==='ミミ'||b.name==='ミミ'?'きょうのお花、きれいだね。':'きょうもいい日だね。';
   npcConversation={a:a.name,b:b.name,line};npcConversationUntil=now+2800;
   a.waitUntil=npcConversationUntil;b.waitUntil=npcConversationUntil;
   a.face=b.x>a.x?'right':b.x<a.x?'left':b.y>a.y?'down':'up';
   b.face=a.x>b.x?'right':a.x<b.x?'left':a.y>b.y?'down':'up';return;
  }
 }
}

function worldRiddle(second=false){const lvl=level(),key='ruins-'+(second?'connect':'order');if(state.explore.found[key]){tell('石碑のことばは、旅の手帳に残っています。何度でも読み返せます。');renderChoices([['旅の手帳',exploreBook],['閉じる',closeChoices]]);return}const rows={easy:{prompt:'いしに「みぎ」と かいて あります。\nどちらを しめす ことば？',opts:[['右 →',true],['左 ←',false]],hint:'「みぎ」は、こちら → です。'},normal:{prompt:'石碑の案内：「橋を渡ったあと、右へ進む。」最初にすることは？',opts:[['橋を渡る。',true],['先に右へ進む。',false],['ずっと待つ。',false]],hint:'「〜したあと」の前に書かれた動作を、先にします。'},hard:{prompt:second?'石碑：「道は雨でぬれていた。（　）、ゆっくり歩いた。」理由と行動をつなぐ言葉は？':'石碑：「赤い花の道は通らず、石の橋を渡ってから木の看板を探す。」案内に合う行動は？',opts:second?[['そのため',true],['しかし',false],['たとえば',false]]:[['赤い花の道を避け、石の橋を渡る。',true],['赤い花の道へ進む。',false],['木の看板を見ずに戻る。',false]],hint:second?'前の出来事が、後の行動の理由になっています。':'選ばない道と、行動の順番を分けて整理します。'},expert:{prompt:second?'石碑：「近道は見つからなかった。（　）、回り道で新しい泉を見つけた。」対比を示すつなぎ言葉は？':'古い案内：「東の道が安全とは限らない。ただし、西の道も通行禁止ではない。」本文から確かに言えることは？',opts:second?[['しかし',true],['つまり',false],['なぜなら',false]]:[['西の道は、通行を禁じられてはいない。',true],['東の道は必ず危険だ。',false],['西の道は必ず安全だ。',false]],hint:second?'期待と違う結果をつなぐ言葉を選びます。':'「禁止ではない」と「安全である」は同じ意味ではありません。'}};const v=rows[lvl];askLearningTask({scene:'ruins',domain:second?'文を組み立てる力':'読む力',key,prompt:v.prompt,options:v.opts.map(([text,ok])=>({text,ok})),hint:v.hint,solution:v.opts.find(x=>x[1])[0],onComplete:r=>{if(state.explore.found[key])return;state.explore.found[key]={day:state.day,area:'ruins',name:'ことばの石碑',text:r.guided?'石碑の例を確かめ、古い記録を読んだ。':'石碑のことばを読み取り、古い記録を見つけた。'};state.coins+=80;save(false);tell('石の箱から、古い記録と80コインを見つけました。探索は、謎を解かなくても自由に続けられます。');renderChoices([['旅の手帳',exploreBook],['閉じる',closeChoices]])}})}
