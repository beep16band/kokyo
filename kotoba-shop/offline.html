function findWorldPath(from,to,can){const q=[from],prev=new Map(),seen=new Set([from.join(',')]);for(let i=0;i<q.length;i++){const [x,y]=q[i];if(x===to[0]&&y===to[1]){let p=to;while(prev.has(p.join(','))){const last=prev.get(p.join(','));if(last[0]===from[0]&&last[1]===from[1])return p;p=last}return null}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(!seen.has(k)&&can(nx,ny)){seen.add(k);prev.set(k,[x,y]);q.push([nx,ny])}}}return null}
