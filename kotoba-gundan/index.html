<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101415">
<meta name="description" content="ことばのゲートを選び、青い冒険者の仲間を集める国語ゲーム。全12ステージ。">
<title>コトバ軍団！</title>
<style>
:root {
  color-scheme: dark;
  --bg:#101415;
  --surface:#181d1f;
  --line:#343d3f;
  --ink:#f5f4ec;
  --muted:#b9c3c3;
  --lime:#e6fb91;
  --left:#9ee9f4;
  --right:#dfc6fb;
  --hit:#ffba91;
  font-family:system-ui,"Noto Sans JP",sans-serif;
  font-synthesis:none;
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); line-height:1.5 }
button, select, input { font:inherit; color:inherit }
button { cursor:pointer; border:0 }
button:disabled { cursor:default }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
  outline:3px solid var(--lime);
  outline-offset:3px;
}
[hidden] { display:none!important }
h1, h2, h3, p { margin:0 }
rt { font-size:.55em; font-weight:630 }
ruby { ruby-align:center }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap }
.top { position:relative; z-index:1; border-bottom:1px solid var(--line); background:#101415 }
.top-inner { max-width:1420px; margin:auto; padding:0 3%; min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:10px }
.mark { display:flex; align-items:center; gap:9px; padding:0; font-size:.9rem; font-weight:850; background:none; white-space:nowrap }
.mark-sign { display:grid; place-items:center; width:24px; height:24px; background:var(--lime); color:#151d16; font-size:.82rem; font-weight:900; font-style:normal; clip-path:polygon(0 0,100% 0,100% 77%,77% 100%,0 100%) }
.top-buttons { display:flex; align-items:center; gap:4px }
.top-buttons button { padding:0 11px; min-height:44px; background:none; color:var(--muted); font-size:.84rem; font-weight:730; white-space:nowrap }
.top-buttons button:hover, .mark:hover { color:var(--lime) }
.shell { max-width:1420px; margin:auto }
.hero { position:relative; isolation:isolate; overflow:hidden; min-height:clamp(330px,48dvh,520px); display:flex; align-items:center; background:#293c36 }
.hero canvas { position:absolute; inset:0; width:100%; height:100%; z-index:-2 }
.hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,#101917f5 2%,#142220e8 22%,#12211c4d 54%,transparent 82%),linear-gradient(0deg,#10141577,transparent 22%) }
.hero-copy { padding:30px 5%; max-width:64%; }
.hero h1 { font-size:clamp(2.75rem,7.6vw,6.75rem); font-weight:950; line-height:1.07; letter-spacing:-.085em; text-wrap:balance; text-shadow:0 2px 18px #10221c70 }
.hero-actions { margin-top:26px; display:flex; flex-wrap:wrap; gap:9px }
.primary, .secondary, .subtle { min-height:44px; border-radius:5px; padding:9px 16px; font-weight:770 }
.primary { color:#152013; background:var(--lime) }
.primary:hover { background:#f1ffc1 }
.secondary { background:#282f30; border:1px solid #455251 }
.secondary:hover { background:#333e3f }
.subtle { background:transparent; color:var(--muted); border:1px solid var(--line) }
.subtle:hover { color:var(--ink); background:#282f30 }
.hero .secondary { background:#142220cc; border-color:#ffffff57 }
.stage-menu { padding:22px 3% 30px }
.menu-head { display:flex; align-items:baseline; margin-bottom:11px }
.menu-head h2 { font-size:1.04rem; font-weight:850; letter-spacing:.04em }
.stage-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line) }
.stage-card { --tint:#658e78; position:relative; display:flex; align-items:center; gap:11px; min-width:0; min-height:75px; padding:10px 12px; text-align:left; background:var(--surface); border-bottom:1px solid var(--line); border-right:1px solid var(--line) }
.stage-card::before { content:""; position:absolute; left:-1px; width:2px; height:53%; background:var(--tint) }
.stage-card:hover { background:#272f31 }
.stage-num { flex:none; color:var(--tint); filter:brightness(1.42) saturate(.85); font-size:.8rem; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.06em }
.stage-card strong { font-size:.96rem; font-weight:750; line-height:1.3; overflow-wrap:anywhere }
.cleared { color:var(--lime); margin-left:auto; font-size:.83rem; font-weight:800 }

.game-shell { --inset:clamp(10px,2.65vw,34px) }
.game-hud { padding:10px var(--inset); background:#171c1e; min-height:60px; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(90px,1fr); align-items:center; gap:13px }
.game-hud h1 { font-size:clamp(.98rem,2.2vw,1.16rem); line-height:1.23; font-weight:800; text-wrap:balance }
.hud-caption, .progress-area { color:var(--muted); font-size:.77rem; font-weight:670 }
.hud-powers { display:flex; flex-wrap:wrap; align-items:center; gap:2px 9px; margin-top:2px; font-size:.76rem; font-weight:800; white-space:nowrap }
.hud-powers [data-powered="true"], .power-gain { color:#ffdb9c }
.hud-count { position:absolute; left:0; top:0; display:flex; align-items:baseline; gap:3px; transform:translate(50vw,30vh) translate(-50%,-100%); padding:4px 9px; color:var(--lime); background:#142321eb; border:1px solid #e6fb9180; border-radius:6px; box-shadow:0 2px 7px #101c2550; white-space:nowrap; font-size:.68rem; font-weight:780; pointer-events:none }
.hud-count::after { content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%); border:5px solid transparent; border-top-color:#142321eb }
.hud-count strong { font-size:clamp(1rem,2.3vw,1.54rem); font-variant-numeric:tabular-nums; line-height:1 }
.progress-area { display:flex; align-items:center; gap:10px; white-space:nowrap }
.progress-track { height:3px; flex:1; background:#424a4a; overflow:hidden }
.progress-fill { height:100%; background:var(--lime); display:block; transition:width .22s ease-out }
.game-world { position:relative; isolation:isolate; background:#7db4b6; overflow:hidden; height:clamp(240px,49dvh,620px) }
.game-world canvas { width:100%; height:100%; display:block; touch-action:pan-y }
.boss-hud { position:absolute; top:13px; left:50%; transform:translateX(-50%); color:#fff; background:#10191cea; width:min(360px,90%); padding:7px 13px 9px; font-size:.81rem; font-weight:750; pointer-events:none }
.boss-line { display:flex; align-items:baseline; flex-wrap:wrap; justify-content:space-between; gap:1px 7px }
.boss-move { font-size:.75rem; color:#ffd090 }
.hp-track { display:block; height:5px; margin-top:5px; background:#425052; overflow:hidden }
.hp-fill { display:block; height:100%; background:#ffbf91; transition:width .2s ease-out }
.gain { position:absolute; left:50%; bottom:11%; transform:translateX(-50%); color:#172018; background:var(--lime); font-size:clamp(1.08rem,3vw,1.65rem); font-weight:900; line-height:1; padding:8px 13px; border-radius:5px; font-variant-numeric:tabular-nums; pointer-events:none; white-space:nowrap }
.gain[data-kind="hit"] { color:#3b2018; background:var(--hit) }

.game-panel { position:relative; background:#171c1e; padding:9px var(--inset) 15px; min-height:154px; border-bottom:1px solid var(--line) }
.prompt-top, .feedback, .result-actions, .row-buttons { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.prompt-top { justify-content:space-between; min-height:44px; margin-bottom:1px }
.turn { font-size:.84rem; color:#e0eca9; font-weight:770 }
.read-controls { display:flex; align-items:center; margin-left:auto }
.read-controls button { display:flex; align-items:center; gap:6px; padding:3px 6px; min-height:44px; font-size:.82rem; color:#d0d9d7; background:none; border:0 }
.read-controls button:hover { color:var(--lime) }
.sound-mark { position:relative; width:18px; height:18px }
.sound-mark::before { content:""; position:absolute; inset:2px 7px 2px 0; background:currentColor; clip-path:polygon(0 33%,35% 33%,100% 0,100% 100%,35% 67%,0 67%) }
.sound-mark::after { content:""; position:absolute; right:0; inset-block:3px; width:6px; border-right:2px solid currentColor; border-radius:50% }
.question { font-size:clamp(1.16rem,2.5vw,1.77rem); font-weight:850; line-height:1.46; overflow-wrap:anywhere }
.passage { padding:3px 0 4px 10px; border-left:2px solid #7c8f85; font-size:clamp(.93rem,2.1vw,1.16rem); font-weight:620; line-height:1.57; margin:0 0 6px; white-space:pre-line }
.choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px }
.choice { --option:var(--left); display:flex; align-items:center; gap:10px; min-height:55px; text-align:left; padding:8px 12px; color:#0f2228; background:var(--option); border-radius:5px; font-size:clamp(1rem,2.5vw,1.32rem); font-weight:830; line-height:1.4; overflow-wrap:anywhere }
.choice:nth-child(2) { --option:var(--right) }
.choice:hover:not(:disabled) { filter:brightness(1.1) }
.choice:disabled { opacity:.55 }
.choice[aria-pressed="true"] { opacity:1; box-shadow:inset 0 0 0 3px #203b41 }
.choice .arrow { flex:none; min-width:27px; font-size:1.12em; font-weight:700; line-height:1; text-align:center }
.feedback { justify-content:space-between; min-height:79px }
.feedback h2, .result-title { font-size:clamp(1.17rem,2.7vw,1.5rem); line-height:1.35; font-weight:850 }
.feedback.ok h2 { color:var(--lime) }
.feedback.miss h2 { color:#ffd2bb }
.feedback p { margin-top:3px; font-size:.96rem; font-weight:700 }
.feedback .row-buttons { margin-left:auto }
.explanation { padding:9px 0 0; color:#e0e5df; font-size:.99rem }
.hint { color:var(--muted); margin-top:5px; font-size:.82rem }
.result-score { font-weight:750; margin-top:7px }
.result-actions { margin-top:12px }

dialog { max-width:min(530px,calc(100% - 20px)); width:100%; max-height:calc(100% - 20px); border:1px solid var(--line); border-radius:9px; padding:18px; background:#1e2526; color:var(--ink); box-shadow:0 18px 50px #0008 }
dialog::backdrop { background:#0b1215b8 }
dialog h2 { font-size:1.3rem; font-weight:840 }
.dialog-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:7px }
.setup-intro { display:flex; align-items:center; justify-content:space-between; gap:12px }
.setup-monster { width:clamp(74px,23vw,112px); aspect-ratio:1; object-fit:contain; flex:none; filter:drop-shadow(0 5px 5px #0006) }
.close { min-width:44px; min-height:44px; border-radius:5px; background:#2d3738; font-size:1.25rem; font-weight:700 }
.close:hover { background:#384849 }
.fields { display:grid; gap:9px; margin:12px 0 }
.fields label { display:flex; justify-content:space-between; align-items:center; gap:9px; font-weight:740 }
.fields select { max-width:62%; min-height:44px; padding:6px 8px; background:#2d3738; border:1px solid #526260; border-radius:5px }
.fields input { accent-color:var(--lime) }
.fields input[type="range"] { width:min(45%,220px) }
.fields input[type="checkbox"] { width:23px; height:23px }
.toast { padding:8px 10px; margin:0 0 9px; background:#3f2b22; color:#ffe2c8; font-size:.84rem }
.muted { color:var(--muted); font-size:.86rem }
.setup-detail, #voice-note, #history-summary { margin:8px 0 }
.history-dialog { max-width:min(720px,calc(100% - 20px)) }
.records { display:grid; gap:8px; margin-top:10px }
.record { padding:8px 10px; border:1px solid var(--line); font-size:.89rem }
.record summary { cursor:pointer; font-weight:790 }
.record p, .record ul { margin-top:6px }
.record ul { padding-left:22px }
.record li+li { margin-top:6px }
@media (max-width:780px) {
  .stage-grid { grid-template-columns:repeat(2,minmax(0,1fr)) }
  .hero-copy { max-width:78% }
}
@media (max-width:560px) {
  .top-inner { min-height:49px; padding:0 10px }
  .mark { gap:4px; font-size:.77rem }
  .mark-sign { width:21px; height:21px }
  .top-buttons { gap:0 }
  .top-buttons button { padding:0 5px; font-size:.71rem }
  .hero { min-height:clamp(300px,52dvh,400px); align-items:end }
  .hero::after { background:linear-gradient(0deg,#101815f5,#12211ca0 37%,#12211c12 77%) }
  .hero-copy { max-width:none; padding:20px 12px }
  .hero h1 { font-size:clamp(2.6rem,10vw,4.1rem) }
  .hero-actions { margin-top:15px }
  .stage-menu { padding:13px 10px 23px }
  .stage-card { min-height:57px; padding:8px; gap:6px }
  .stage-card strong { font-size:.79rem }
  .stage-num { font-size:.70rem }
  .game-hud { padding:7px var(--inset) 6px; grid-template-columns:minmax(0,1fr) auto; gap:4px 8px }
  .game-hud h1 { text-wrap:wrap }
  .hud-count { padding:3px 6px }
  .progress-area { grid-row:2; grid-column:1/-1 }
  .game-world { height:clamp(179px,38dvh,350px) }
  .game-panel { padding:5px var(--inset) 11px; min-height:137px }
  .prompt-top { margin-bottom:0 }
  .choice { gap:5px; padding:6px; min-height:53px }
  .choice .arrow { min-width:19px }
}
@media (max-height:520px) and (orientation:landscape) {
  .top-inner { min-height:44px }
  .game-world { height:clamp(125px,35dvh,240px) }
  .game-hud { min-height:43px; padding-block:5px }
  .game-panel { min-height:0; padding-block:3px 8px }
  .prompt-top, .read-controls button { min-height:38px }
}
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { transition:none!important; scroll-behavior:auto!important }
}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
<button class="mark" id="home" type="button"><i class="mark-sign" aria-hidden="true">コ</i>コトバ軍団！</button>
<nav class="top-buttons" aria-label="ゲームの操作"><button id="pause" type="button" hidden>一時停止</button><button id="settings" type="button">設定</button><button id="history" type="button">学習履歴</button></nav>
</div></header>
<main>
<section class="shell" id="menu">
 <div id="storage-warning" class="toast" role="status" hidden></div>
 <div class="hero">
  <canvas id="cover" aria-hidden="true"></canvas>
  <div class="hero-copy">
   <h1>コトバ軍団！</h1>
   <div class="hero-actions"><button class="primary" id="quick-start" type="button">はじめる　→</button><button class="secondary" id="resume" type="button" hidden>つづきから</button></div>
  </div>
 </div>
 <div class="stage-menu">
  <div class="menu-head"><h2 id="stage-list-label">ステージ</h2></div>
  <div class="stage-grid" id="stages" aria-labelledby="stage-list-label"></div>
 </div>
</section>
<section class="shell game-shell" id="play" hidden aria-labelledby="game-title">
 <div class="game-hud">
  <div><h1 id="game-title" tabindex="-1"></h1><div id="game-meta" class="hud-caption"></div>
  <div class="hud-powers"><span id="weapon-level" title="3・6・9問連続正解で強化"></span><span id="fusion-status" title="30・65・110人で合体" data-powered="true" hidden></span></div></div>
  <div class="progress-area"><span id="question-count"></span><span class="progress-track" aria-hidden="true"><span id="progress" class="progress-fill"></span></span></div>
 </div>
 <div class="game-world">
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="army-tag" class="hud-count"><span class="sr-only">仲間</span><strong id="army">5</strong><span>人</span></div>
  <div id="boss-hud" class="boss-hud" hidden><div class="boss-line"><span id="boss-label"></span><span id="boss-move" class="boss-move" hidden></span></div><span class="hp-track" aria-hidden="true"><span id="hp" class="hp-fill"></span></span></div>
  <div id="gain" class="gain" aria-hidden="true" hidden></div>
 </div>
 <div class="game-panel" id="game-panel"></div>
 <div id="live" class="sr-only" role="status" aria-live="polite"></div>
</section>
</main>
<dialog id="setup-dialog" aria-labelledby="setup-title">
 <div class="dialog-head"><h2 id="setup-title"></h2><button class="close" type="button" data-close aria-label="閉じる">×</button></div>
 <div class="setup-intro"><p id="setup-topic"></p><img id="setup-monster" class="setup-monster" alt="" hidden></div>
 <form id="setup-form">
  <div class="fields">
   <label for="difficulty">むずかしさ <select id="difficulty"><option value="0">やさしい</option><option value="1">ふつう</option><option value="2">むずかしい（中1）</option></select></label>
   <label for="players">あそびかた <select id="players"><option value="1">ひとり</option><option value="2">きょうりょく・2人</option><option value="3">きょうりょく・3人</option><option value="4">きょうりょく・4人</option><option value="5">きょうりょく・5人</option><option value="6">きょうりょく・6人</option><option value="7">きょうりょく・7人</option><option value="8">きょうりょく・8人</option></select></label>
  </div>
  <p class="muted setup-detail" id="setup-detail"></p>
  <p class="toast" id="replace-note" hidden>あたらしく始めると、途中の冒険の保存が入れ替わります。</p>
  <button class="primary" type="submit">スタート　→</button>
 </form>
</dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title">
 <div class="dialog-head"><h2 id="settings-title">設定</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></div>
 <div class="fields">
  <label for="speed">演出の速さ <select id="speed"><option value="0.7">ゆっくり</option><option value="1">ふつう</option><option value="1.5">はやい</option></select></label>
  <label for="reduced">動きを少なくする <input id="reduced" type="checkbox"></label>
  <label for="ruby">ルビを表示 <input id="ruby" type="checkbox"></label>
  <label for="auto-read">自動読み上げ <input id="auto-read" type="checkbox"></label>
  <label for="sfx">効果音 <input id="sfx" type="range" min="0" max="100" step="5"></label>
  <label for="bgm">BGM <input id="bgm" type="range" min="0" max="100" step="5"></label>
 </div>
 <p class="muted" id="voice-note"></p>
</dialog>
<dialog id="pause-dialog" aria-labelledby="pause-title">
 <div class="dialog-head"><h2 id="pause-title">ひとやすみ</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></div>
 <div class="row-buttons"><button class="primary" type="button" data-close>冒険にもどる</button><button class="secondary" id="exit-game" type="button">ステージ選択へ</button></div>
</dialog>
<dialog id="history-dialog" class="history-dialog" aria-labelledby="history-title">
 <div class="dialog-head"><h2 id="history-title">学習履歴</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></div>
 <div class="row-buttons"><button class="secondary" id="csv" type="button">CSVを書き出す</button></div>
 <div id="history-summary" class="muted"></div><div id="records" class="records"></div>
</dialog>
<script>
"use strict";
(() => {
const levels = ["やさしい", "ふつう", "むずかしい"];
const rewards = [5, 10, 20];
const questionCounts = [18, 18, 14];
const priorQuestionCounts = [12, 12, 8];
const savedQuestionCounts = [questionCounts,[16,16,12],priorQuestionCounts];
const stages = [
  {name:"ひらがなの草原", topic:"ひらがな・基本語彙", tint:"#35744e", boss:"巨大スライム", theme:["#79c6e7","#e9f4c0","#9bd693","#4b9f73","#ebce92","#b58e55","#286e53"]},
  {name:"ことばの森", topic:"反対語・仲間の言葉", tint:"#315c43", boss:"森のゴーレム", theme:["#88c6c1","#c8e8a1","#76b378","#398361","#ccae7c","#9b7250","#205a42"]},
  {name:"かんじの竹林", topic:"漢字の読み・選択", tint:"#4c7453", boss:"漢字の鬼", theme:["#a5d4bb","#f4f1bf","#9bc188","#659575","#e1c895","#aa9163","#396849"]},
  {name:"かぞえかたの港", topic:"助数詞・物の数え方", tint:"#285f7d", boss:"巨大タコ", theme:["#72c7e3","#f4f0cb","#6dbdc5","#408da6","#dcb788","#a87c55","#266b89"]},
  {name:"ぶんしょうの町", topic:"助詞・語順・文づくり", tint:"#87523f", boss:"からくりロボ", theme:["#f0b38e","#ffe1b7","#dcae82","#b97576","#edc299","#b08774","#a26655"]},
  {name:"ものがたりの図書館", topic:"短文読解", tint:"#714a74", boss:"本の魔物", theme:["#927fa8","#f6cca0","#ac84a4","#725b83","#dabea5","#a37f78","#644c75"]},
  {name:"ことばの雪山", topic:"既習事項の復習", tint:"#41668e", boss:"氷の巨人", theme:["#84bfe0","#edf9fb","#d1e9ed","#83b1cb","#e9edf4","#9aafcc","#4f82ab"]},
  {name:"コトバ魔王城", topic:"全範囲の総復習", tint:"#674874", boss:"コトバ魔王", theme:["#706d9e","#f2b49b","#a17ea1","#655278","#c0a7bb","#8c7099","#503d70"]},

function parsePool(text,stage,idPrefix) {
  return text.trim().split("\n").map((line, index) => {
    const [prompt, correct, wrong, explanation] = line.split("|").reduce((fields, fragment) => {
      // Ruby uses the same separator within braces. Keep those fragments together.
      const last = fields.length - 1;
      if (last >= 0 && fields[last].lastIndexOf("{") > fields[last].lastIndexOf("}")) {
        fields[last] += "|" + fragment;
      } else {
        fields.push(fragment);
      }
      return fields;
    }, []);
    const [question, passage = ""] = prompt.split("~");
    return {id:`${idPrefix}-${index}`,category:stage,question,passage:passage.replaceAll("↵","\n"),correct,wrong,explanation};
  });
}

}

const readingWords = new RegExp([...readingEntries.keys()].sort((a,b)=>b.length-a.length).join("|"),"gu");
function appendRuby(element, base, reading) {

}
function appendWords(element, words, enabled) {
  if (!enabled) {

  let offset = 0;
  for (const match of words.matchAll(readingWords)) {
    element.append(words.slice(offset,match.index));
    appendRuby(element,match[0],readingEntries.get(match[0]));
    offset = match.index+match[0].length;
  }
  element.append(words.slice(offset));
}
function addText(element, value, showRuby = data.settings.ruby) {
  const token = /\{([^{}|]+)\|([^{}|]+)\}|\[([^\[\]]+)\]/g;

  for (const match of value.matchAll(token)) {
    appendWords(element,value.slice(offset,match.index),showRuby);
    if (match[3]) element.append(match[3]);
    else if (showRuby) appendRuby(element,match[1],match[2]);
    else element.append(match[1]);
    offset = match.index + match[0].length;

  appendWords(element,value.slice(offset),showRuby);

}

function unlockAudio() {

function tone(note, volume, offset = 0, duration = .16, wave = "sine") {
  if (!audio || audio.state!=="running" || !volume) return;
  const oscillator = audio.createOscillator(), envelope = audio.createGain();
  const start = audio.currentTime+offset;
  oscillator.type = wave;
  oscillator.frequency.value = 440 * 2**((note-69)/12);
  envelope.gain.setValueAtTime(.0001,start);
  envelope.gain.linearRampToValueAtTime(volume,start+.026);
  envelope.gain.exponentialRampToValueAtTime(.0001,start+duration);
  oscillator.connect(envelope).connect(audio.destination);
  oscillator.start(start);
  oscillator.stop(start+duration+.01);
  oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
}

  if(kind==="impact") tone(52,volume*.73,0,.22,"triangle");
  if(kind==="damage") tone(45,volume*.85,0,.28,"triangle");
  if(kind==="shot") [81,74,67].forEach((note,i)=>tone(note,volume*.34,i*.041,.10,"triangle"));
  if(kind==="orb" || kind==="breath") [57,52,43].forEach((note,i)=>tone(note,volume*.43,i*.072,.23,"triangle"));
  if(kind==="wave") [45,40,38].forEach((note,i)=>tone(note,volume*.54,i*.079,.24,"triangle"));
  if(kind==="shards") [63,69,60,54].forEach((note,i)=>tone(note,volume*.38,i*.051,.14,"triangle"));
  if(kind==="upgrade") [74,81,86].forEach((note,i)=>tone(note,volume*.58,i*.082,.23,"triangle"));
  if(kind==="slash") [65,77].forEach((note,i)=>tone(note,volume*.39,i*.055,.15));

  const fixed=5+stage*.52+level*2;
  const bySize=countUnits()*(.052+stage*.002+level*.006);
  const cost=Math.ceil((fixed+bySize)*action.force*(1-armory.fusions*.13));
  const separated=loseMembers(cost);
  const loss=separated.length;
  impact={source:"boss",color:action.move.light,at:clock,lane,units:separated};
  setHud();
  sound("damage");
  sayStatus(loss?`${action.move.name}。仲間が${loss}人減りました。`:action.move.name);
}
function allyDamage() {
  const power=countUnits()*weaponTiers[armory.tier].power*(1+armory.fusions*.08);
  // The last allied turn still matters, including in a large co-op group.
  return 100/battle.waves*Math.min(1+.65/(battle.waves-1),power/battle.target);
}
function tickBattle(delta) {
  battle.time+=delta;
  if(battle.hit>0) {
    battle.hit=Math.max(0,battle.hit-delta*2.7);
    if(!battle.hit && session.players>1) setHp();
  }
  let action=battleAttack(battle);
  while(action) {
    const current=battle.actions[battle.next];
    if(action.kind==="counter" && !current.shown) {
      const cue=byId("boss-move");
      cue.textContent=action.move.name;
      cue.hidden=false;
      current.shown=true;
    }
    if(!current.cued && action.progress>=(action.kind==="counter"?counterLaunch:.24)) {
      sound(action.move?.form??action.kind);
      current.cued=true;
    }
    if(!current.landed && action.progress>=action.atHit) {
      current.landed=true;
      if(action.kind==="counter") resolveBossHit(action);
      else {
        battle.landed++;
        battle.hp=Math.max(0,battle.hp-allyDamage());
        if(battle.hp<1e-7) battle.hp=0;
        battle.hit=1;
        setHp();sound("impact");
      }
    }
    if(action.progress<1) break;
    if(action.kind==="counter") byId("boss-move").hidden=true;
    battle.next++;
    action=battleAttack(battle);
  }
  if(battle.time>battle.ends+.58) finish();
}
function finish() {
  const {score}=stats();
  battle.done=true;
  battle.win=battle.hp<=0;
  const army=countUnits();
  const record={
    id:session.id, retryOf:session.retryOf, stage:session.stage, level:session.level, players:session.players,
    date:new Date().toISOString(), score, total:session.order.length, army, won:battle.win,
    wrong:session.answers.flatMap((answer,index)=>{
      if(answer.ok) return [];
      const q=itemById.get(answer.id);
      return [{id:q.id,category:q.category,question:textOf(q.question),passage:textOf(q.passage),
        answer:answer.choice===null?"未回答（ゲート通過）":textOf(q.wrong),correct:textOf(q.correct),explanation:textOf(q.explanation),
        turn:index%session.players+1}];
    })
  };
  data.records=[record,...data.records.filter(row=>row.id!==record.id)].slice(0,100);
  data.saved=null;
  persist();
  result=record;
  setPhase("end");
  panel.hidden=false;
  byId("pause").hidden=true;
  if(record.won) sound("win");
  resultPanel();
}
function resultPanel() {
  const heading=result.won?"ステージクリア！":battle.hp<22?"あと少し！":"もう一度チャレンジ";
  const summary = element("p","result-score",`せいかい ${result.score}／${result.total}問 ・ なかま ${result.army}人`);
  if(!result.won) summary.append(element("span","",` ・ ボスの のこり ${Math.ceil(battle.hp)}%`));
  const actions = element("div","result-actions");
  if (result.won && session.stage<stages.length-1) {
    actions.append(button("次のステージ　→","primary",()=>{
      const next=session.stage+1;
      showMenu();
      openSetup(next);
    }));
  }
  actions.append(button("もういちど","secondary",()=>start(session.stage,session.level,session.players,result.id)),
    button("ステージ選択","secondary",showMenu));
  if(result.wrong.length) actions.append(button("まちがえた もんだい","subtle",()=>showHistory(result.id)));
  if(storageIssue) actions.append(element("p","toast",storageIssue));
  const title=element("h2","result-title",heading);
  title.tabIndex=-1;
  panel.replaceChildren(title,summary,actions);
  title.focus({preventScroll:true});
  sayStatus(heading);
}

const settingsFields = {
  speed:Number, reduced:Boolean, ruby:Boolean, "auto-read":Boolean, sfx:Number, bgm:Number
};
for(const [key,parse] of Object.entries(settingsFields)) {
  const node=byId(key), setting=key==="auto-read"?"autoRead":key;
  const set=()=>{
    data.settings[setting]=parse(node.type==="checkbox"?node.checked:node.value);
    if (key==="ruby" && awaitingAnswer()) drawQuestion();
    persist();repaint=true;
  };
  node.addEventListener(node.type==="range"?"input":"change",set);
  if(node.type==="range") node.addEventListener("change",()=>{
    unlockAudio();
    if(key==="sfx") tone(72,data.settings.sfx/100*.1);
  });
}
byId("settings").onclick=()=>{
  const settings=data.settings;
  for(const key of Object.keys(settingsFields)) {
    const node=byId(key), value=settings[key==="auto-read"?"autoRead":key];
    if(node.type==="checkbox") node.checked=value;
    else node.value=value;
  }
  updateVoiceNote();
  openDialog("settings-dialog");
};

const dateFormat=new Intl.DateTimeFormat("ja-JP",{dateStyle:"short",timeStyle:"short"});
const percent = row => Math.round(row.score/row.total*100);
function weaknesses(records) {
  const totals=new Map();
  for(const record of records) for(const question of record.wrong) {
    totals.set(question.category,(totals.get(question.category)||0)+1);
  }
  return [...totals].sort((a,b)=>b[1]-a[1]||a[0]-b[0]).map(([key,count])=>`${categories[key]} ${count}問`);
}
function showHistory(expanded) {
  const records=data.records;
  const weak=weaknesses(records);
  byId("history-summary").textContent = records.length
    ? (weak.length?"まちがいの多い分野　"+weak.join(" ／ "):"保存された記録には、まちがいがありません。")
    : "プレイを終えると、ここに結果が表示されます。";
  const nodes=records.map(row=>{
    const record=element("details","record");
    record.open=row.id===expanded;
    const score=`${row.score}/${row.total}問（${percent(row)}%）`;
    record.append(element("summary","",`${dateFormat.format(new Date(row.date))}　${stages[row.stage].name}　${score}　${row.won?"クリア":"再挑戦へ"}`));
    const prev=records.find(item=>item.id===row.retryOf);
    const retry=row.retryOf ? (prev?` ／ 再挑戦 ${prev.score}/${prev.total}問 → ${score}`:" ／ 再挑戦") : "";
    record.append(element("p","muted",`${levels[row.level]} ／ ${row.players>1?`協力${row.players}人`:"ひとり"} ／ 仲間${row.army}人${retry}`));
    if(row.wrong.length) {
      const list=element("ul");
      for(const miss of row.wrong) {
        const li=element("li");
        li.append(element("strong","",`[${categories[miss.category]}] ${miss.question}`));
        if(miss.passage) li.append(element("div","",miss.passage));
        li.append(element("div","",`選択 ${miss.answer} ／ 正解 ${miss.correct}${row.players>1?`（${miss.turn}番）`:""}`));
        li.append(element("div","muted",miss.explanation));
        list.append(li);
      }
      record.append(list);
    }
    return record;
  });
  byId("records").replaceChildren(...nodes);
  byId("csv").disabled=!records.length;
  openDialog("history-dialog");
}
byId("history").onclick=()=>showHistory();
byId("csv").onclick=()=>{
  const fields=["日時","記録ID","再挑戦元ID","ステージ","難易度","プレイ人数","正解数","出題数","正答率","仲間","ボス戦","まちがいの分野","まちがえた問題","本文","選んだ答え","正解","協力の順番"];
  const quote=value=>'"'+String(value??"").replaceAll('"','""')+'"';
  const table=[fields,...data.records.flatMap(row=>(row.wrong.length?row.wrong:[null]).map(miss=>[
    dateFormat.format(new Date(row.date)),row.id,row.retryOf,stages[row.stage].name,levels[row.level],row.players,
    row.score,row.total,percent(row)+"%",row.army,row.won?"クリア":"再挑戦へ",miss?categories[miss.category]:"",
    miss?.question,miss?.passage,miss?.answer,miss?.correct,row.players>1?miss?.turn:""
  ]))];
  const csv="\uFEFF"+table.map(row=>row.map(quote).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const link=element("a");
  link.href=url;link.download="kotoba-gundan-history.csv";link.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
};
let gesture=null;
byId("world").addEventListener("pointerdown",event=>{
  if(!awaitingAnswer() || !event.isPrimary || event.button!==0) return;
  gesture={id:event.pointerId,x:event.clientX,y:event.clientY};
  event.currentTarget.setPointerCapture(event.pointerId);
});
function swipe(event) {
  if(gesture?.id!==event.pointerId) return;
  const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
  gesture=null;
  if(event.type==="pointerup" && Math.abs(dx)>29 && Math.abs(dx)>Math.abs(dy)*1.3) selectGate(dx<0?0:1);
}
byId("world").addEventListener("pointerup",swipe);
byId("world").addEventListener("pointercancel",swipe);
addEventListener("keydown",event=>{
  if(event.repeat || event.altKey || event.ctrlKey || event.metaKey || play.hidden ||
    document.querySelector("dialog[open]")) return;
  if(event.key==="Escape" && phase!=="end") {
    openDialog("pause-dialog");
    return;
  }
  if(!awaitingAnswer() || !["ArrowLeft","ArrowRight"].includes(event.key)) return;
  if(event.target.matches("input, select, textarea")) return;
  event.preventDefault();
  selectGate(event.key==="ArrowLeft"?0:1);
});
document.addEventListener("visibilitychange",()=>{
  lastFrame=0;
  if(document.hidden) speech?.cancel();
});
addEventListener("resize",()=>{repaint=true;});

const coverUnits=Array.from({length:38},()=>({born:-1,team:0}));
function tickRun(dt, delta) {
  clock+=delta;
  elapsed+=delta;
  let targetSpeed=0;
  if(awaitingAnswer()) {
    targetSpeed=gateSpeed/data.settings.speed;
  } else if(phase==="cross") {
    const targetLane=outcome.answer.choice===0?-1:1;
    lane=mix(outcome.laneFrom,targetLane,smoothstep(clamp(elapsed/outcome.turnDuration,0,1)));
    targetSpeed=34;
  } else if(phase==="feedback" || phase==="missed") targetSpeed=10;
  else if(phase==="battle") {
    targetSpeed=battle.time<attackLead?8:0;
    tickBattle(delta);
  }
  if(phase!=="cross") lane*=Math.exp(-delta*4.8);
  if(impact && clock-impact.at<.36 && phase==="question") targetSpeed*=.10;
  velocity=mix(velocity,targetSpeed,1-Math.exp(-delta*5.8));
  const travel=velocity*delta;
  if(phase!=="end") distance+=travel;
  if(departingGate) {
    departingGate.z-=travel;
    if(departingGate.z<=gateExit) departingGate=null;
  }
  if(awaitingAnswer() || phase==="cross") {
    gateZ-=travel;
    if(gateZ<=gatePass) {
      departingGate=gateZ>gateExit?{z:gateZ,labels:gateLabels}:null;
      if(awaitingAnswer()) skipGate();
      else applyAnswer();
    } else if(awaitingAnswer()) tickChase(dt);
  } else if(phase==="missed" && elapsed>=skipFeedbackTime) advance();
  if(signUntil && clock>=signUntil) {
    byId("gain").hidden=true;
    signUntil=0;
  }
}
function loop(timestamp) {
  requestAnimationFrame(loop);
  const dt=lastFrame ? clamp((timestamp-lastFrame)/1000,0,.5) : 0;
  lastFrame=timestamp;
  if(document.hidden) return;
  const {speed,reduced,bgm}=data.settings;
  if(phase==="menu") {
    if(repaint) {
      cover.draw({stage:0,cover:true,distance:15,t:2.31,phase:"cover",lane:0,units:coverUnits,players:1,reduced});
      repaint=false;
    }
    return;
  }
  const paused=!!document.querySelector("dialog[open]");
  if(!paused) {
    tickRun(dt,dt*speed);
    if(phase!=="end" && bgm>0) {
      musicTimer-=dt;
      if(musicTimer<=0) {
        const index=musicIndex++;
        tone(melody[index%melody.length],bgm/100*.039,0,.37,"triangle");
        if(index%4===0) tone(melody[index%melody.length]-12,bgm/100*.043,0,.72);
        musicTimer=.365;
      }
    }
  }
  const needsMotion=phase!=="end" || (!reduced && battle.win);
  const interval=paintCost>12 ? 31 : 15;
  if(!repaint && (paused || !needsMotion || timestamp-lastPaint<interval)) return;
  lastPaint=timestamp;
  repaint=false;
  const gatePairs=[];
  if(awaitingAnswer() || phase==="cross") gatePairs.push({z:gateZ,labels:gateLabels});
  if(departingGate) gatePairs.push(departingGate);
  const hazard=chase ? clamp(chase.time/chase.limit,0,1) : null;
  const startPaint=performance.now();
  const tag=world.draw({
    stage:session.stage,distance:reduced?17:distance,t:clock,phase,lane,units,players:session.players,
    gatePairs,battle,reduced,hazard,impact,armory,powerCue
  });
  if(tag) {
    const count=byId("army-tag");
    const transform=`translate3d(${Math.round(tag.x)}px, ${Math.round(tag.y)}px, 0px) translate(-50%, -100%)`;
    if(count.style.transform!==transform) count.style.transform=transform;
  }
  paintCost=mix(paintCost,performance.now()-startPaint,.15);
}
showMenu();
requestAnimationFrame(loop);
if (isSecureContext && /^https?:$/.test(location.protocol) && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
})();
