<body>
<header class="top"><div class="top-inner">
<button class="mark" id="home" type="button">コトバ軍団！</button>
<nav class="top-buttons" aria-label="ゲームの操作"><button id="pause" type="button" hidden>一時停止</button><button id="settings" type="button">設定</button><button id="history" type="button">学習履歴</button></nav>
</div></header>
<main>
<section class="shell" id="menu">
 <div id="storage-warning" class="toast" role="status" hidden></div>
 <div class="hero">
  <canvas id="cover" aria-hidden="true"></canvas>
  <div class="hero-copy">
   <p class="eyebrow">ことばで進む、8つの冒険</p>
   <h1>コトバ軍団！</h1>
   <p>左右のゲートから正しいことばを選ぼう。青い冒険者を集めて、最後のボスにみんなで挑もう！</p>
   <div class="hero-actions"><button class="primary" id="quick-start" type="button">第1ステージへ　›</button><button class="secondary" id="resume" type="button" hidden>つづきから</button></div>
  </div>
 </div>
 <div class="menu-head"><h2 id="stage-list-label">ステージをえらぶ</h2><p>1回 3〜5分目安・時間制限なし</p></div>
 <div class="stage-grid" id="stages" aria-labelledby="stage-list-label"></div>
</section>
<section class="shell game-shell" id="play" hidden aria-labelledby="game-title">
 <div class="game-hud">
  <div><h1 id="game-title" tabindex="-1"></h1><div id="game-meta" class="hud-caption"></div></div>
  <div class="progress-area"><span id="question-count"></span><span class="progress-track" aria-hidden="true"><span id="progress" class="progress-fill"></span></span></div>
  <div class="hud-count"><ruby>仲間<rt>なかま</rt></ruby> <strong id="army">5</strong> <ruby>人<rt>にん</rt></ruby></div>
 </div>
 <div class="game-world">
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="world-label" class="world-label"></div>
  <div id="boss-hud" class="boss-hud" hidden><span id="boss-label"></span><span class="hp-track" aria-hidden="true"><span id="hp" class="hp-fill"></span></span></div>
  <div id="gain" class="gain" aria-hidden="true" hidden></div>
 </div>
 <div class="game-panel" id="game-panel"></div>
 <div id="live" class="sr-only" role="status" aria-live="polite"></div>
</section>
</main>
<dialog id="setup-dialog" aria-labelledby="setup-title">
 <div class="dialog-head"><h2 id="setup-title"></h2><button class="close" type="button" data-close aria-label="閉じる">×</button></div>
 <p id="setup-topic"></p>
 <form id="setup-form">
  <div class="fields">
   <label for="difficulty">むずかしさ <select id="difficulty"><option value="0">やさしい</option><option value="1">ふつう</option><option value="2">むずかしい</option></select></label>
   <label for="players">あそびかた <select id="players"><option value="1">ひとり</option><option value="2">きょうりょく・2人</option><option value="3">きょうりょく・3人</option><option value="4">きょうりょく・4人</option><option value="5">きょうりょく・5人</option><option value="6">きょうりょく・6人</option><option value="7">きょうりょく・7人</option><option value="8">きょうりょく・8人</option></select></label>
  </div>
  <p class="muted" id="setup-detail"></p>
  <p class="toast" id="replace-note" hidden>あたらしく始めると、途中の冒険の保存が入れ替わります。</p>
  <button class="primary" type="submit">冒険をはじめる　›</button>
 </form>
</dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title">
 <div class="dialog-head"><h2 id="settings-title">設定</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></div>
 <div class="fields">
  <label for="speed">演出の速さ <select id="speed"><option value="0.7">ゆっくり</option><option value="1">ふつう</option><option value="1.5">はやい</option></select></label>
  <label for="reduced">動きを少なくする <input id="reduced" type="checkbox"></label>
  <label for="ruby">ルビを表示 <input id="ruby" type="checkbox"></label>
  <label for="auto-read">自動読み上げ <input id="auto-read" type="checkbox"></label>
  <label for="sfx">効果音 <input id="sfx" type="range" min="0" max="100" step="5"></label>
  <label for="bgm">BGM <input id="bgm" type="range" min="0" max="100" step="5"></label>
 </div>
 <p class="muted" id="voice-note"></p>
</dialog>
<dialog id="pause-dialog" aria-labelledby="pause-title">
 <div class="dialog-head"><h2 id="pause-title">ひとやすみ</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></div>
 <p>つづきは、この端末のブラウザに保存されます。</p>
 <div class="row-buttons"><button class="primary" type="button" data-close>冒険にもどる</button><button class="secondary" id="exit-game" type="button">ステージ選択へ</button></div>
</dialog>
<dialog id="history-dialog" class="history-dialog" aria-labelledby="history-title">
 <div class="dialog-head"><h2 id="history-title">学習履歴</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></div>
 <p class="muted">記録はこのブラウザ内に保存します。直近100回まで、名前の入力はありません。</p>
 <div class="row-buttons"><button class="secondary" id="csv" type="button">CSVを書き出す</button></div>
 <div id="history-summary" class="muted"></div><div id="records" class="records"></div>
</dialog>
<script>

const readingWords = new RegExp([...readingEntries.keys()].sort((a,b)=>b.length-a.length).join("|"),"gu");
function appendRuby(element, base, reading) {
  const ruby = document.createElement("ruby");
  const rt = document.createElement("rt");
  rt.textContent = reading;
  ruby.append(base, rt);
  element.append(ruby);
}
function appendWords(element, words, enabled) {
  if (!enabled) {
    element.append(words);
    return;
  }
  let offset = 0;
  for (const match of words.matchAll(readingWords)) {
    element.append(words.slice(offset,match.index));
    appendRuby(element,match[0],readingEntries.get(match[0]));
    offset = match.index+match[0].length;
  }
  element.append(words.slice(offset));
}
function addText(element, value, showRuby = data.settings.ruby) {
  const token = /\{([^{}|]+)\|([^{}|]+)\}|\[([^\[\]]+)\]/g;
  let offset = 0;
  for (const match of value.matchAll(token)) {
    appendWords(element,value.slice(offset,match.index),showRuby);
    if (match[3]) element.append(match[3]);
    else if (showRuby) appendRuby(element,match[1],match[2]);
    else element.append(match[1]);
    offset = match.index + match[0].length;
  }
  appendWords(element,value.slice(offset),showRuby);
  return element;
}
function element(tag, className, text) {

}

const melody = [62,69,74,76,74,69,67,69,60,67,72,74,72,67,64,67,59,66,71,74,71,66,62,66,57,64,69,72,69,64,62,64];
function unlockAudio() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    audio ||= new Audio();
    if (audio.state==="suspended") audio.resume().catch(()=>{});
  } catch {
    audio = undefined;
  }
}
function tone(note, volume, offset = 0, duration = .16, wave = "sine") {
  if (!audio || audio.state!=="running" || !volume) return;
  const oscillator = audio.createOscillator(), envelope = audio.createGain();
  const start = audio.currentTime+offset;
  oscillator.type = wave;
  oscillator.frequency.value = 440 * 2**((note-69)/12);
  envelope.gain.setValueAtTime(.0001,start);
  envelope.gain.linearRampToValueAtTime(volume,start+.026);
  envelope.gain.exponentialRampToValueAtTime(.0001,start+duration);
  oscillator.connect(envelope).connect(audio.destination);
  oscillator.start(start);
  oscillator.stop(start+duration+.01);
  oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
}
function sound(kind) {
  const volume = data.settings.sfx/100*.105;
  if(kind==="correct") [72,76,81].forEach((note,i)=>tone(note,volume,i*.08,.22,"triangle"));
  if(kind==="miss") tone(62,volume,0,.29);
  if(kind==="impact") tone(52,volume*.73,0,.22,"triangle");
  if(kind==="win") [65,69,72,77].forEach((note,i)=>tone(note,volume,i*.125,.35,"triangle"));
}

    if (key==="ruby" && phase==="approach") drawQuestion(true);
    persist();repaint=true;
  };
  node.addEventListener(node.type==="range"?"input":"change",set);
  if(node.type==="range") node.addEventListener("change",()=>{
    unlockAudio();
    if(key==="sfx") tone(72,data.settings.sfx/100*.1);
  });
}
byId("settings").onclick=()=>{
  const settings=data.settings;
  for(const key of Object.keys(settingsFields)) {
    const node=byId(key), value=settings[key==="auto-read"?"autoRead":key];
    if(node.type==="checkbox") node.checked=value;
    else node.value=value;
  }
  updateVoiceNote();
  openDialog("settings-dialog");
};

const dateFormat=new Intl.DateTimeFormat("ja-JP",{dateStyle:"short",timeStyle:"short"});
const percent = row => Math.round(row.score/row.total*100);
function weaknesses(records) {
  const totals=new Map();
  for(const record of records) for(const question of record.wrong) {
    totals.set(question.category,(totals.get(question.category)||0)+1);
  }
  return [...totals].sort((a,b)=>b[1]-a[1]||a[0]-b[0]).map(([key,count])=>`${categories[key]} ${count}問`);
}
function showHistory(expanded) {
  const records=data.records;
  const weak=weaknesses(records);
  byId("history-summary").textContent = records.length
    ? (weak.length?"まちがいの多い分野　"+weak.join(" ／ "):"保存された記録には、まちがいがありません。")
    : "プレイを終えると、ここに結果が表示されます。";
  const nodes=records.map(row=>{
    const record=element("details","record");
    record.open=row.id===expanded;
    const score=`${row.score}/${row.total}問（${percent(row)}%）`;
    record.append(element("summary","",`${dateFormat.format(new Date(row.date))}　${stages[row.stage].name}　${score}　${row.won?"クリア":"再挑戦へ"}`));
    const prev=records.find(item=>item.id===row.retryOf);
    const retry=row.retryOf ? (prev?` ／ 再挑戦 ${prev.score}/${prev.total}問 → ${score}`:" ／ 再挑戦") : "";
    record.append(element("p","muted",`${levels[row.level]} ／ ${row.players>1?`協力${row.players}人`:"ひとり"} ／ 仲間${row.army}人${retry}`));
    if(row.wrong.length) {
      const list=element("ul");
      for(const miss of row.wrong) {
        const li=element("li");
        li.append(element("strong","",`[${categories[miss.category]}] ${miss.question}`));
        if(miss.passage) li.append(element("div","",miss.passage));
        li.append(element("div","",`選択 ${miss.answer} ／ 正解 ${miss.correct}${row.players>1?`（${miss.turn}番）`:""}`));
        li.append(element("div","muted",miss.explanation));
        list.append(li);
      }
      record.append(list);
    }
    return record;
  });
  byId("records").replaceChildren(...nodes);
  byId("csv").disabled=!records.length;
  openDialog("history-dialog");
}
byId("history").onclick=()=>showHistory();
byId("csv").onclick=()=>{
  const fields=["日時","記録ID","再挑戦元ID","ステージ","難易度","プレイ人数","正解数","出題数","正答率","仲間","ボス戦","まちがいの分野","まちがえた問題","本文","選んだ答え","正解","協力の順番"];
  const quote=value=>'"'+String(value??"").replaceAll('"','""')+'"';
  const table=[fields,...data.records.flatMap(row=>(row.wrong.length?row.wrong:[null]).map(miss=>[
    dateFormat.format(new Date(row.date)),row.id,row.retryOf,stages[row.stage].name,levels[row.level],row.players,
    row.score,row.total,percent(row)+"%",row.army,row.won?"クリア":"再挑戦へ",miss?categories[miss.category]:"",
    miss?.question,miss?.passage,miss?.answer,miss?.correct,row.players>1?miss?.turn:""
  ]))];
  const csv="\uFEFF"+table.map(row=>row.map(quote).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const link=element("a");
  link.href=url;link.download="kotoba-gundan-history.csv";link.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
};
let gesture=null;
byId("world").addEventListener("pointerdown",event=>{
  if(phase!=="question" || !event.isPrimary || event.button!==0) return;
  gesture={id:event.pointerId,x:event.clientX,y:event.clientY};
  event.currentTarget.setPointerCapture(event.pointerId);
});
function swipe(event) {
  if(gesture?.id!==event.pointerId) return;
  const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
  gesture=null;
  if(event.type==="pointerup" && Math.abs(dx)>29 && Math.abs(dx)>Math.abs(dy)*1.3) selectGate(dx<0?0:1);
}
byId("world").addEventListener("pointerup",swipe);
byId("world").addEventListener("pointercancel",swipe);
addEventListener("keydown",event=>{
  if(event.repeat || event.altKey || event.ctrlKey || event.metaKey || play.hidden ||
    document.querySelector("dialog[open]")) return;
  if(event.key==="Escape" && phase!=="end") {
    openDialog("pause-dialog");
    return;
  }
  if(phase!=="question" || !["ArrowLeft","ArrowRight"].includes(event.key)) return;
  if(event.target.matches("input, select, textarea")) return;
  event.preventDefault();
  selectGate(event.key==="ArrowLeft"?0:1);
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) {
    speech?.cancel();
    lastFrame=0;
  }
});
addEventListener("resize",()=>{repaint=true;});

const coverUnits=Array.from({length:38},()=>({born:-1,team:0}));
function loop(timestamp) {
  requestAnimationFrame(loop);
  // Keep turns close to wall time even on a browser that draws at a low frame rate.
  const dt = lastFrame ? clamp((timestamp-lastFrame)/1000,0,.5) : 0;
  lastFrame=timestamp;
  if(document.hidden) return;
  const paused = !!document.querySelector("dialog[open]");
  const {speed,reduced,bgm} = data.settings;
  if(phase==="menu") {
    if(repaint) {
      cover.draw({stage:0,cover:true,distance:15,t:2.31,phase:"approach",lane:0,units:coverUnits,players:1,reduced});
      repaint=false;
    }
    return;
  }
  if(!paused) {
    const delta=dt*speed;
    clock+=delta;
    elapsed+=delta;
    if (phase==="approach") {
      distance+=delta*21;
      if(elapsed>=3.45) readyQuestion();
    } else if(phase==="cross") {
      distance+=delta*43;
      if(elapsed>=.68) applyAnswer();
    } else if(phase==="battle") tickBattle(delta);
    if(phase!=="end" && bgm>0) {
      musicTimer-=dt;
      if(musicTimer<=0) {
        const index=musicIndex++;
        tone(melody[index%melody.length],bgm/100*.039,0,.37,"triangle");
        if(index%4===0) tone(melody[index%melody.length]-12,bgm/100*.043,0,.72);
        musicTimer=.365;
      }
    }
  }
  const needsMotion = ["approach","cross","battle"].includes(phase) || (phase==="feedback" && elapsed<1.65)
    || (!reduced && (phase==="ready" || (phase==="end" && battle.win)));
  if(!repaint && (paused || !needsMotion || timestamp<nextDraw)) return;
  nextDraw=timestamp+32;
  repaint=false;
  const targetLane=phase==="cross"?(outcome.answer.choice===0?-1:1):0;
  if(phase==="cross") lane=mix(0,targetLane,clamp(elapsed/.42,0,1));
  else if(phase==="approach") lane=mix(lane,0,clamp(dt*8,0,1));
  const question=currentQuestion();
  let labels,gateZ;
  if(question && ["approach","question","cross"].includes(phase)){
    labels=question.choices.map(choice=>{
      const full=textOf(choice);
      return full.length>11?full.slice(0,10)+"…":full;
    });
    gateZ=phase==="question"?34:phase==="approach"?mix(100,34,clamp(elapsed/3.45,0,1)):mix(34,10,clamp(elapsed/.68,0,1));
  }
  world.draw({stage:session.stage,distance:reduced?17:distance,t:clock,phase,lane,units,players:session.players,labels,gateZ,battle,reduced});
}
showMenu();
requestAnimationFrame(loop);
if (isSecureContext && /^https?:$/.test(location.protocol) && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
})();
</script>
