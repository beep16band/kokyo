<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3efe4">
<title>コトバ軍団！｜工事中</title>
<style>
  :root { font-family:system-ui,"Noto Sans JP",sans-serif; color:#182737; background:#f3efe4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; }
  main { width:min(100%,540px); padding:clamp(28px,7vw,68px); border-top:4px solid #b48a3a; background:#fffdf7; box-shadow:0 18px 60px #1f304113; }
  p { margin:0; }
  .name { font-size:1rem; font-weight:750; }
  h1 { margin:.16em 0 .38em; font-size:clamp(2.8rem,12vw,5.6rem); line-height:1.1; letter-spacing:.035em; }
  .status { color:#425263; }
</style>
</head>
<body>
<main>
  <p class="name">コトバ軍団！</p>
  <h1>工事中</h1>
  <p class="status">現在、ゲームの公開を一時停止しています。</p>
</main>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"})
    .then(registration => registration.update()).catch(() => {});
}
</script>
</body>
</html>
