<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=4"><style>.stage-top select{max-width:47%;background:#142237;color:white;min-height:40px;padding:5px;font:inherit;font-size:12px}.stage-top button{font-size:12px}body{overflow:hidden}.stage-top span{flex:1}.dialogue-nav{justify-content:flex-end}.art-error{color:#ffd0c0}</style></head><body><div class="stage" id="stage"><div class="background" id="backgroundA"></div><div id="environment"></div><div id="actors"></div><div id="vignette"></div><header class="stage-top"><select id="place" aria-label="人物と場面"><option value="tsurayuki">紀貫之（きのつらゆき）</option><option value="okura">山上憶良（やまのうえのおくら）</option><option value="inamaro">丈部稲麻呂（はせつかべのいなまろ）</option><option value="memory">幼いことはと真尋</option></select><span></span><button id="state">回復後を見る</button></header><div id="poemRibbon" class="poem-ribbon" hidden></div><section class="dialogue"><div class="speaker-row"><div class="face" id="face"></div><strong id="speaker"></strong></div><p id="text"></p><div id="choices" class="choices" hidden></div><div id="feedback" class="feedback" hidden></div><nav class="dialogue-nav"><span id="status">素材確認</span></nav></section></div><script type="module">
import{createPortrait}from './portraits.mjs';const data=await(await fetch('chapter2.json?v=3')).json(),base='../assets/secret-vn/',get=id=>document.getElementById(id);const quizLayout=new URLSearchParams(location.search).get('layout')==='quiz';let recovered=false;
const samples={tsurayuki:{bg:['BG10','BG11'],text:['人の心など、知りようがない。','人の心が分からなくとも、昔と同じ香りに出会ったことを歌にしたのでした。']},okura:{bg:['BG12','BG13'],text:['子が……今ごろ、泣いているだろうか。','子も、その母も私を待っているだろう。そう思って帰りたかったのです。']},inamaro:{bg:['BG14','BG15'],text:['出発の日、誰かが頭を撫でてくれた……。','父上と母上の「無事でいなさい」を、私は忘れられなかった。']}};
function paint(){const key=get('place').value,memory=key==='memory',ids=memory?['kotoha-child','mahiro-child']:[key],sample=samples[key],bg=data.manifest.backgrounds[memory?'BG16':sample.bg[recovered?1:0]];get('stage').classList.toggle('recovered',recovered&&!memory);get('stage').classList.toggle('flashback',memory);get('stage').classList.toggle('poet-scene',!memory);get('backgroundA').style.backgroundImage=`url("${base+bg.file}")`;get('backgroundA').style.filter=bg.filter||'none';const layer=bg.layers?.[0];get('environment').style.backgroundImage=layer?`url("${base+layer.file}")`:'none';get('environment').style.opacity=layer?.opacity||0;get('actors').replaceChildren();let first;
 ids.forEach((id,i)=>{const p=data.manifest.characters[id].states[memory?'normal':recovered?'normal':'hollow'];first??=p;const img=document.createElement('img');img.alt=data.manifest.characters[id].label;img.style.setProperty('--face-y',String(p.faceCrop[1]/p.height));img.src=base+p.file;img.className='actor '+(ids.length===1?'center active':i===0?'left active':'right secondary');img.dataset.character=id;img.dataset.state=memory?'normal':recovered?'normal':'hollow';img.onerror=()=>{get('status').textContent='画像を読み込めません';get('status').className='art-error'};get('actors').append(img)});
 get('face').replaceChildren(createPortrait(first,base));get('speaker').textContent=memory?'幼いことは':data.poems[{tsurayuki:'w10',okura:'w06',inamaro:'w08'}[key]].author;get('text').textContent=memory?'そんな方法があるか、私が探してみる。':sample.text[recovered?1:0];get('state').disabled=memory;get('state').textContent=recovered?'記憶喪失を見る':'回復後を見る';
 const quiz=quizLayout&&!memory;get('stage').classList.toggle('quiz',quiz);get('poemRibbon').hidden=!quiz;get('choices').hidden=!quiz;get('feedback').hidden=true;get('choices').replaceChildren();if(quiz){const waka={tsurayuki:'w10',okura:'w06',inamaro:'w08'}[key],q=data.questions.find(q=>q.waka_id===waka);get('text').textContent=q.prompt;get('poemRibbon').textContent=data.poems[waka].text;for(const c of q.choices){const b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{get('feedback').hidden=false;get('feedback').textContent=q.explanation};get('choices').append(b)}get('status').textContent='問題欄の構図見本・記録なし'}else get('status').textContent='素材確認';} 
get('place').onchange=()=>{recovered=false;paint()};get('state').onclick=()=>{recovered=!recovered;paint()};paint();
</script></body></html>
