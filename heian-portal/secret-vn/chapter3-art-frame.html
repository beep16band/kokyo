<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=6"><style>.stage-top select{max-width:55%;background:#142237;color:white;min-height:40px;padding:5px;font:inherit;font-size:12px}.stage-top button{font-size:12px}body{overflow:hidden}.stage-top span{flex:1}.dialogue-nav{justify-content:flex-end}</style></head><body><div class="stage" id="stage"><div class="background" id="backgroundA"></div><div id="environment"></div><div id="actors"></div><div id="vignette"></div><header class="stage-top"><select id="place" aria-label="人物と場面"><option value="jito">持統天皇（じとうてんのう）</option><option value="azuma">東歌の若者（あずまうたのわかもの）</option><option value="akahito">山部赤人（やまべのあかひと）</option><option value="keeper">記憶の番人</option><option value="memory">幼いことはと真尋</option></select><span></span><button id="state">回復後を見る</button></header><div id="poemRibbon" class="poem-ribbon" hidden></div><section class="dialogue"><div class="speaker-row"><div class="face" id="face"></div><strong id="speaker"></strong></div><p id="text"></p><div id="choices" class="choices" hidden></div><div id="feedback" class="feedback" role="status" hidden></div><nav class="dialogue-nav"><span id="status">素材確認</span></nav></section></div><script type="module">
import{createPortrait}from './portraits.mjs';const data=await(await fetch('chapter3.json?v=6')).json(),base='../assets/secret-vn/',get=id=>document.getElementById(id);const quizLayout=new URLSearchParams(location.search).get('layout')==='quiz';let recovered=false;
const samples={jito:{bg:['BG18','BG19'],waka:'w01',text:['春は過ぎたはずなのに、夏が見えない。','夏が来たらしい。そう感じたのですね。']},azuma:{bg:['BG20','BG21'],waka:'w07',text:['さら……さら……。誰が、いとしかったのだろう。','誰かをいとしいと思った気持ちは、名前が残らずとも歌に残ったのですね。']},akahito:{bg:['BG23','BG23'],waka:'w05',text:['山をたたえる長い歌と、それに添える短い歌があります。','山をたたえる長い歌と、それに添える短い歌があります。']},keeper:{bg:['BG22','BG22'],text:['歌人本人が生きているのではありません。歌に託された記憶の姿です。','歌に託された記憶の姿です。']}};
function paint(){const key=get('place').value,memory=key==='memory',ids=memory?['kotoha-child','mahiro-child']:[key],sample=samples[key],bg=data.manifest.backgrounds[memory?'BG16':sample.bg[recovered?1:0]];get('stage').classList.toggle('recovered',recovered&&!memory);get('stage').classList.toggle('flashback',memory);get('stage').classList.toggle('poet-scene',!memory);get('backgroundA').style.backgroundImage=`url("${base+bg.file}")`;get('backgroundA').style.filter=bg.filter||'none';const layer=bg.layers?.[0];get('environment').style.backgroundImage=layer?`url("${base+layer.file}")`:'none';get('environment').style.opacity=layer?.opacity||0;get('actors').replaceChildren();let first;
 ids.forEach((id,i)=>{const states=data.manifest.characters[id].states,state=!memory&&!recovered&&states.hollow?'hollow':'normal',p=states[state];first??=p;const img=document.createElement('img');img.alt=data.manifest.characters[id].label;img.style.setProperty('--face-y',String(p.faceCrop[1]/p.height));img.src=base+p.file;img.className='actor '+(ids.length===1?'center active':i===0?'left active':'right secondary');img.dataset.character=id;img.dataset.state=state;img.onerror=()=>get('status').textContent='画像を読み込めません';get('actors').append(img)});
 get('face').replaceChildren(createPortrait(first,base));get('face').dataset.character=key;get('face').dataset.state=!recovered&&['jito','azuma'].includes(key)?'hollow':'normal';get('speaker').textContent=memory?'幼いことは':sample.waka?data.poems[sample.waka].author:data.manifest.characters[key].label;get('text').textContent=memory?'私は歌を集めて、誰にも忘れられないようにしたい。':sample.text[recovered?1:0];get('state').disabled=memory||!data.manifest.characters[key]?.states.hollow;get('state').textContent=recovered?'記憶喪失を見る':'回復後を見る';
 const quiz=quizLayout&&!memory&&['jito','azuma'].includes(key);get('stage').classList.toggle('quiz',quiz);get('poemRibbon').hidden=!quiz;get('choices').hidden=!quiz;get('feedback').hidden=true;get('choices').replaceChildren();if(quiz){const q=data.questions.find(q=>q.waka_id===sample.waka);get('text').textContent=q.prompt;get('poemRibbon').textContent=data.poems[sample.waka].text;for(const c of q.choices){const b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{get('feedback').hidden=false;get('feedback').textContent=(c.id===q.answerId?'✓ ':'歌の言葉へ。 ')+q.explanation};get('choices').append(b)}get('status').textContent='問題欄の構図見本・記録なし'}else get('status').textContent='素材確認';}
get('place').onchange=()=>{recovered=false;paint()};get('state').onclick=()=>{recovered=!recovered;paint()};paint();
</script></body></html>
