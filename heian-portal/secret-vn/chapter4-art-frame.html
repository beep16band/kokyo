<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=7"><style>.stage-top select{max-width:47%;background:#142237;color:white;min-height:40px;padding:5px;font:inherit;font-size:12px}.stage-top button{font-size:12px;padding:6px 8px}.stage-top span{flex:1}body{overflow:hidden}.dialogue-nav{justify-content:flex-end;flex-wrap:wrap}.dialogue-nav button{border:1px solid #b7a17d66}.preview-note{font-size:.7rem;color:#b8c4d5}</style></head><body><div class="stage" id="stage"><div class="background" id="backgroundA"></div><div id="environment"></div><div id="chapterEffects" class="chapter-effects" aria-hidden="true"></div><div id="actors"></div><div id="vignette"></div><header class="stage-top"><select id="place" aria-label="人物と場面"><option value="narihira">在原業平（ありわらのなりひら）</option><option value="hitomaro">柿本人麻呂（かきのもとのひとまろ）</option><option value="ashes">千年前の火災跡</option><option value="forbidden">書庫の回想</option><option value="crest">消された家名</option></select><span></span><button id="state">回復後を見る</button></header><div id="poemRibbon" class="poem-ribbon" hidden></div><section class="dialogue"><div class="speaker-row"><div class="face" id="face"></div><strong id="speaker"></strong></div><p id="text"></p><div id="choices" class="choices" hidden></div><div id="feedback" class="feedback" role="status" hidden></div><nav class="dialogue-nav"><button id="direction">川の色彩演出</button><label class="preview-note"><input id="effects" type="checkbox" checked>演出</label><span id="status" class="preview-note">構図見本・記録なし</span></nav></section></div><script type="module">
import{createPortrait}from './portraits.mjs';import{visual4,emotion4,character4,paintDirection4}from './chapter4-visuals.mjs?v=1';const data=await(await fetch('chapter4.json?v=2')).json(),base='../assets/secret-vn/',get=id=>document.getElementById(id),quizLayout=new URLSearchParams(location.search).get('layout')==='quiz';let recovered=false,timer=null,phase=null,answers={};
const samples={narihira:{scene:'C04-S02',line:1,waka:'w11',recoveryScene:'C04-S04',recoveryLine:15},hitomaro:{scene:'C04-S06',line:1,waka:'w02',recoveryScene:'C04-S07',recoveryLine:4},ashes:{scene:'C04-S05',line:1},forbidden:{scene:'C04-S08',line:2},crest:{scene:'C04-S09',line:1}};
function paint(){const key=get('place').value,sample=samples[key],sceneId=phase!==null?'C04-S04':recovered?sample.recoveryScene:sample.scene,line=phase!==null?phase:recovered?sample.recoveryLine:sample.line,scene=data.scenes.find(s=>s.scene_id===sceneId),source=scene.script[line],step={...source,sceneId,line,kind:'line'},v=visual4(step,data),bg=data.manifest.backgrounds[v.bg],quiz=quizLayout&&!!sample.waka&&phase===null;
 get('stage').classList.toggle('quiz',quiz);get('stage').classList.toggle('recovered',v.recovered);get('stage').classList.toggle('poet-scene',v.ids.length===1);get('stage').classList.toggle('flashback',v.memory);get('stage').classList.toggle('still',!get('effects').checked);get('backgroundA').style.backgroundImage=`url("${base+bg.file}")`;get('backgroundA').style.filter=bg.filter||'none';const layer=bg.layers?.[0];get('environment').style.backgroundImage=layer?`url("${base+layer.file}")`:'none';get('environment').style.opacity=layer?.opacity||0;get('actors').replaceChildren();let first;const talker=character4(source.speaker,step)||({'湊':'minato','茜':'akane','ことは':'kotoha','真尋':'mahiro','業平':'narihira','在原業平':'narihira','人麻呂':'hitomaro','柿本人麻呂':'hitomaro'})[source.speaker]||Object.keys(data.manifest.characters).find(id=>data.manifest.characters[id].label===source.speaker),talkerStates=data.manifest.characters[talker]?.states,talkerState=emotion4(talker,sceneId,line)||'normal',portrait=talkerStates&&(talkerStates[talkerState]||talkerStates.normal);const activeId=v.ids.includes(talker)?talker:v.ids[0];
 for(const[id,i]of v.ids.map((id,i)=>[id,i])){const state=emotion4(id,sceneId,line)||'normal',p=data.manifest.characters[id].states[state]||data.manifest.characters[id].states.normal;first??={id,state,p};const img=document.createElement('img');img.src=base+p.file;img.alt=data.manifest.characters[id].label;img.className='actor '+(v.ids.length===1?'center active':(i===0?'left':'right')+(id===activeId?' active':' secondary'));img.style.setProperty('--face-y',String(p.faceCrop[1]/p.height));img.dataset.character=id;img.dataset.state=state;img.onerror=()=>get('status').textContent='画像を読み込めません';get('actors').append(img)}
 get('face').replaceChildren(...(portrait?[createPortrait(portrait,base)]:[]));get('face').dataset.character=talker||'';get('face').dataset.state=talkerState;get('speaker').textContent=quiz?data.poems[sample.waka].author:source.speaker;get('text').textContent=source.text;get('state').disabled=!sample.waka;get('state').textContent=recovered?'記憶喪失を見る':'回復後を見る';get('direction').hidden=key!=='narihira'||quiz;get('poemRibbon').hidden=!quiz;get('choices').hidden=!quiz;get('feedback').hidden=true;get('choices').replaceChildren();if(quiz){const q=data.questions.find(q=>q.waka_id===sample.waka);get('text').textContent=q.prompt;get('poemRibbon').textContent=data.poems[sample.waka].text;for(const c of q.choices){const b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{get('feedback').hidden=false;get('feedback').textContent=(c.id===q.answerId?'✓ ':'歌の言葉へ。 ')+q.explanation;if(c.id===q.answerId){answers[q.id]=q.answerId;if(sample.waka==='w11')paintDirection4(get('chapterEffects'),{sceneId:'C04-S03',kind:'quiz'},data,answers,base)}};get('choices').append(b)}}
 paintDirection4(get('chapterEffects'),step,data,answers,base);get('status').textContent=phase!==null?'演出見本・記録なし':'構図見本・記録なし';}
