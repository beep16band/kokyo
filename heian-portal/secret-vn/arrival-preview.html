<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クリア後の切り替わり・演出確認</title><link rel="stylesheet" href="arrival-transition.css?v=1"><style>body{margin:0;background:#111a28;color:#f2f1eb;font:16px/1.8 "Yu Gothic",Meiryo,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:20px}button{font:inherit;min-height:44px;padding:10px 20px;border-radius:6px;border:1px solid #b4a888;background:#26364c;color:inherit;margin:8px 12px 16px 0;cursor:pointer}.scene{aspect-ratio:16/9;background:#27384a url('../assets/cc64d396fb804c86eb40.svg') center/contain no-repeat;border:1px solid #4c6178}p{font-size:14px}a{color:#c1e0ee}</style></head><body><main><h1>クリア後の切り替わり・演出確認</h1><p>演出だけを確認します。クリア記録を作ったり、本編の条件を変更したりしません。</p><button id="play">ノイズから暗転を再生</button><button id="quiet">暗転のみを再生</button><a href="../?v=82">ポータルへ</a><div class="scene" aria-label="通常版トップの見本"></div><p id="status" role="status">通常時：約2.5秒で暗転し、隠し最終章へ接続します。この見本では移動しません。</p></main><script type="module">import{playArrival}from './arrival-transition.mjs?v=2';let active;function play(quiet){if(active)return;document.getElementById('status').textContent='再生中';active=playArrival({quiet,onFinish:()=>{setTimeout(()=>{active.cleanup();active=null;document.getElementById('status').textContent='暗転完了。本番はこのまま隠し最終章の会話が始まります。';document.getElementById('play').focus()},700)}})}document.getElementById('play').onclick=()=>play(false);document.getElementById('quiet').onclick=()=>play(true);</script></body></html>
