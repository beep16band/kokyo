<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顔ワイプ確認｜言の葉の檻</title><link rel="stylesheet" href="style.css?v=2"><style>body{display:block;padding:24px;max-width:1000px;margin:auto}.preview{padding:20px;background:#142238;border:1px solid #536176;border-radius:10px;margin:20px 0}.preview p{margin-top:14px}select{max-width:100%;padding:12px;background:#1c2a3e;color:white}.face-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.face-card{padding:12px;background:#182435;border-radius:8px}.face-card h3{font-size:.8rem}.face-sizes{display:flex;align-items:center;gap:18px}.face-card small{color:#bac6d6}.phone-size{height:40px;width:40px}.small-size{height:30px;width:30px}a{display:inline-block;margin:10px 0}</style></head><body><h1>会話枠の顔ワイプ</h1><label>人物・表情 <select id="portraitSelect"></select></label><section class="preview"><div class="speaker-row"><div class="face" id="sampleFace"></div><strong id="sampleName"></strong></div><p>全身画像の余白ではなく、顔の位置に合わせて表示します。</p></section><div id="faceGrid" class="face-grid"></div><a href="./">第1章へ戻る</a><script type="module">
import {createPortrait} from './portraits.mjs';
const data=await (await fetch('chapter1.json')).json(),grid=document.getElementById('faceGrid'),select=document.getElementById('portraitSelect'),entries=[];
for(const [id,c]of Object.entries(data.manifest.characters))for(const [state,p]of Object.entries(c.states)){
 const label=c.label+' · '+state;entries.push({p,label});const option=document.createElement('option');option.textContent=label;option.value=entries.length-1;select.append(option);const card=document.createElement('article');card.className='face-card';const heading=document.createElement('h3');heading.textContent=label;const row=document.createElement('div');row.className='face-sizes';for(const cls of ['','phone-size','small-size']){const f=document.createElement('div');f.className='face '+cls;f.append(createPortrait(p,'../assets/secret-vn/'));row.append(f)}card.append(heading,row);grid.append(card);
}
function change(){const e=entries[Number(select.value)],face=document.getElementById('sampleFace');face.replaceChildren(createPortrait(e.p,'../assets/secret-vn/'));document.getElementById('sampleName').textContent=e.label}select.onchange=change;change();
</script></body></html>
