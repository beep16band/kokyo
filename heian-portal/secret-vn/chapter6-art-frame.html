<!doctype html><html lang="ja" data-chapter="C06"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=11"><title>第6章・構図見本</title><style>body{overflow:hidden}.stage-top select{max-width:49%;background:#142237;color:white;min-height:40px;padding:5px;font:inherit;font-size:12px}.stage-top button{font-size:12px;padding:6px 8px}.stage-top span{flex:1}.dialogue-nav{justify-content:flex-end;flex-wrap:wrap}.preview-note{font-size:.7rem;color:#b8c4d5}</style></head><body><div class="stage" id="stage"><div class="background" id="backgroundA"></div><div id="environment"></div><div id="chapterEffects" class="chapter-effects" aria-hidden="true"></div><div id="actors"></div><div id="vignette"></div><header class="stage-top"><select id="place" aria-label="人物と場面"><option value="shikishi">式子内親王（しょくしないしんのう）</option><option value="yakamochi">大伴家持（おおとものやかもち）</option><option value="kotoha">封印の書庫（終盤）</option><option value="memory">真尋の記録（終盤）</option><option value="seal">封印の庭（終盤）</option><option value="trio">三人の決意（終盤）</option></select><span></span><button id="state">回復後を見る</button></header><div id="poemRibbon" class="poem-ribbon" hidden></div><section class="dialogue"><div class="speaker-row"><div class="face" id="face"></div><strong id="speaker"></strong></div><p id="text"></p><div id="choices" class="choices" hidden></div><div id="feedback" class="feedback" role="status" hidden></div><nav class="dialogue-nav"><button id="direction">封印の演出</button><label class="preview-note"><input id="effects" type="checkbox" checked>演出</label><span class="preview-note">構図見本・記録なし</span></nav></section></div><script type="module">
import{createPortrait}from './portraits.mjs';import{visual6,emotion6,paintDirection6}from './chapter6-visuals.mjs?v=1';const data=await(await fetch('chapter6.json?v=9')).json(),base='../assets/secret-vn/',get=id=>document.getElementById(id),quizLayout=new URLSearchParams(location.search).get('layout')==='quiz';let recovered=false,phase=null,timers=[];
const samples={shikishi:{scene:'C06-S02',line:1,waka:'w15',recoveryScene:'C06-S04',recoveryLine:3},yakamochi:{scene:'C06-S05',line:1,waka:'w09',recoveryScene:'C06-S07',recoveryLine:4},kotoha:{scene:'C06-S08',line:10},memory:{scene:'C06-S09',line:17},seal:{scene:'C06-S09',line:33},trio:{scene:'C06-S10',line:5}};
function paint(){const key=get('place').value,sample=samples[key],sceneId=phase!==null?'C06-S09':recovered&&sample.recoveryScene||sample.scene,line=phase!==null?phase:recovered&&sample.recoveryScene?sample.recoveryLine:sample.line,scene=data.scenes.find(s=>s.scene_id===sceneId),source=scene.script[line],step={...source,sceneId,line,kind:'line'},v=visual6(step,data),bg=data.manifest.backgrounds[v.bg],quiz=quizLayout&&!!sample.waka;
 get('stage').classList.toggle('quiz',quiz);get('stage').classList.toggle('recovered',v.recovered);get('stage').classList.toggle('poet-scene',v.ids.some(id=>['shikishi','yakamochi'].includes(id)));get('stage').classList.toggle('flashback',v.memory);get('stage').classList.toggle('still',!get('effects').checked);get('backgroundA').style.backgroundImage=`url("${base+bg.file}")`;get('backgroundA').style.filter=bg.filter||'none';const layer=bg.layers?.[0];get('environment').style.backgroundImage=layer?`url("${base+layer.file}")`:'none';get('environment').style.opacity=layer?.opacity||0;get('actors').replaceChildren();const talker=({'湊':'minato','茜':'akane','ことは':'kotoha','真尋':'mahiro','式子内親王':'shikishi','大伴家持':'yakamochi'})[source.speaker],activeId=v.ids.includes(talker)?talker:v.ids[0];
 for(const[id,i]of v.ids.map((id,i)=>[id,i])){const state=emotion6(id,sceneId,line)||'normal',p=data.manifest.characters[id].states[state]||data.manifest.characters[id].states.normal,img=document.createElement('img');img.src=base+p.file;img.alt=data.manifest.characters[id].label;const pos=v.ids.length===1?'center':v.ids.length===3?['trio-center','trio-left','trio-right'][i]:i===0?'left':'right';img.className='actor '+pos+(id===activeId?' active':' secondary');img.style.setProperty('--face-y',String(p.faceCrop[1]/p.height));img.style.setProperty('--face-ratio',String(p.height/p.faceCrop[2]));img.dataset.character=id;img.dataset.state=state;get('actors').append(img)}
 const states=data.manifest.characters[talker]?.states,state=emotion6(talker,sceneId,line)||'normal',portrait=states&&(states[state]||states.normal);get('face').replaceChildren(...(portrait?[createPortrait(portrait,base)]:[]));get('face').dataset.character=talker||'';get('face').dataset.state=state;get('speaker').textContent=quiz?data.poems[sample.waka].author:source.speaker;get('text').textContent=source.text;get('state').disabled=!sample.waka;get('state').textContent=recovered?'記憶喪失を見る':'回復後を見る';get('poemRibbon').hidden=!quiz;get('choices').hidden=!quiz;get('feedback').hidden=true;get('choices').replaceChildren();get('direction').hidden=!['memory','seal'].includes(key);if(quiz){const q=data.questions.find(q=>q.waka_id===sample.waka);get('text').textContent=q.prompt;get('poemRibbon').textContent=data.poems[sample.waka].text;for(const c of q.choices){const b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{get('feedback').hidden=false;get('feedback').textContent=(c.id===q.answerId?'✓ ':'歌の言葉へ。 ')+q.explanation};get('choices').append(b)}}paintDirection6(get('chapterEffects'),step)}
function stop(){timers.forEach(clearTimeout);timers=[];phase=null}get('place').onchange=()=>{stop();recovered=false;paint()};get('state').onclick=()=>{stop();recovered=!recovered;paint()};get('effects').onchange=()=>{stop();paint()};get('direction').onclick=()=>{stop();phase=11;paint();for(const[ms,line]of [[2000,24],[4000,30],[7200,33],[9700,36]])timers.push(setTimeout(()=>{phase=line;paint()},ms))};paint();
</script></body></html>
