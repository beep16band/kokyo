<!doctype html><html lang="ja" data-chapter="C07"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=12"><title>最終章・構図見本</title><style>body{overflow:hidden}.stage-top select{max-width:60%;background:#142237;color:white;min-height:40px;font:inherit;font-size:12px}.dialogue-nav{justify-content:flex-end;flex-wrap:wrap}.preview-note{font-size:.7rem;color:#b8c4d5}</style></head><body><div class="stage" id="stage"><div class="background" id="backgroundA"></div><div id="environment"></div><div id="chapterEffects" class="chapter-effects" aria-hidden="true"></div><div id="actors"></div><div id="vignette"></div><header class="stage-top"><select id="place" aria-label="人物と場面"><option value="lord">忘れの主</option><option value="chorus">歌人たちの帰還</option><option value="mahiro">真尋との再会</option><option value="farewell">夜明けの庭・別れ</option><option value="minato">湊の帰還</option><option value="letter">最後の手紙</option><option value="ending">エンディング</option></select></header><div id="poemRibbon" class="poem-ribbon" hidden></div><section class="dialogue"><div class="speaker-row"><div class="face" id="face"></div><strong id="speaker"></strong></div><p id="text"></p><div id="choices" class="choices" hidden></div><div id="feedback" class="feedback" role="status" hidden></div><nav class="dialogue-nav"><button id="music">終盤BGMを聴く</button><label class="preview-note"><input id="mute" type="checkbox">音を消す</label><label class="preview-note"><input id="effects" type="checkbox" checked>演出</label></nav><output id="audioStatus" class="preview-note" aria-live="polite">素材見本・記録なし</output></section></div><script type="module">
import{createPortrait}from './portraits.mjs';import{visual7,emotion7,paintDirection7}from './chapter7-visuals.mjs?v=1';import{EndingTrack}from './ending-audio.mjs?v=1';const data=await(await fetch('chapter7.json?v=10')).json(),base='../assets/secret-vn/',get=id=>document.getElementById(id),quizLayout=new URLSearchParams(location.search).get('layout')==='quiz';
const samples={lord:['C07-S01',1],chorus:['C07-S06',2],mahiro:['C07-S07',13],farewell:['C07-S09',17],minato:['C07-S11',8],letter:['C07-S12',7],ending:['C07-S12',15]};const ids={'忘れの主':'lord','湊':'minato','茜':'akane','ことは':'kotoha','真尋':'mahiro','小野小町':'komachi','ことはの手紙':'kotoha'};let settings={volume:.3,mute:false};
const track=new EndingTrack(base+'audio/ending-naranda-mamade-v1.mp3',{onMedia:m=>{m.id='endingRecording';m.hidden=true;document.body.append(m)},notify:s=>get('audioStatus').textContent=({playing:'終盤BGM再生中・静かな音量',finished:'再生終了',blocked:'再生ボタンを押してください',stopped:'停止'})[s]||s});
function paint(){const key=get('place').value,[sceneId,line]=samples[key],source=data.scenes.find(s=>s.scene_id===sceneId).script[line],step={...source,sceneId,line,kind:key==='ending'?'end':'line'},v=visual7(step,data),bg=data.manifest.backgrounds[v.bg],quiz=quizLayout;
get('stage').classList.toggle('quiz',quiz);get('stage').classList.toggle('true-ending',key==='ending');get('stage').classList.toggle('recovered',v.recovered);get('stage').classList.toggle('still',!get('effects').checked);get('backgroundA').style.backgroundImage=`url("${base+bg.file}")`;get('backgroundA').style.filter=bg.filter||'none';const layer=bg.layers?.[0];get('environment').style.backgroundImage=layer?`url("${base+layer.file}")`:'none';get('environment').style.opacity=layer?.opacity||0;get('actors').replaceChildren();const talker=ids[source.speaker],active=v.ids.includes(talker)?talker:v.ids[0];
for(const[id,i]of v.ids.map((id,i)=>[id,i])){const state=emotion7(id,sceneId,line)||'normal',p=data.manifest.characters[id].states[state]||data.manifest.characters[id].states.normal,img=document.createElement('img');img.src=base+p.file;img.alt=data.manifest.characters[id].label;img.dataset.character=id;img.dataset.state=state;img.className='actor '+(v.ids.length===1?'center':v.ids.length===3?['trio-center','trio-left','trio-right'][i]:i===0?'left':'right')+(id===active?' active':' secondary');img.style.setProperty('--face-y',String(p.faceCrop[1]/p.height));img.style.setProperty('--face-ratio',String(p.height/p.faceCrop[2]));get('actors').append(img)}
const c=data.manifest.characters[talker],state=emotion7(talker,sceneId,line)||'normal',p=c&&(c.states[state]||c.states.normal);get('face').replaceChildren(...(p?[createPortrait(p,base)]:[]));get('speaker').textContent=key==='ending'?'千年の約束 ― 読了':source.speaker;get('text').textContent=key==='ending'?data.endText:source.text;get('poemRibbon').hidden=!quiz;get('choices').hidden=!quiz;get('feedback').hidden=true;get('choices').replaceChildren();if(quiz){const q=data.questions[9];get('text').textContent=q.prompt;get('poemRibbon').textContent=data.poems[q.waka_id].text;for(const c of q.choices){const b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{get('feedback').hidden=false;get('feedback').textContent=(c.id===q.answerId?'✓ ':'歌の言葉へ。 ')+q.explanation};get('choices').append(b)}}paintDirection7(get('chapterEffects'),step)}
get('place').onchange=paint;get('effects').onchange=paint;get('music').onclick=()=>{track.update({sceneId:'C07-S09',line:17,kind:'line'},settings);track.retry()};get('mute').onchange=()=>{settings={...settings,mute:get('mute').checked};track.settings=settings;track.apply()};document.addEventListener('visibilitychange',()=>document.hidden?track.pause():track.resume());paint();
</script></body></html>
