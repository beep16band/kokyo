<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>言の葉の檻｜素材確認</title><style>
*{box-sizing:border-box}body{margin:0;background:#111520;color:#edf0f7;font:16px/1.7 system-ui,-apple-system,'Noto Sans JP','Yu Gothic',sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(23px,4vw,36px);margin:0}small,p{color:#aab6cd}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}label{display:grid;gap:4px;font-size:13px}select,button,a.btn{font:inherit;color:#f2f3f6;background:#273148;border:1px solid #53607d;border-radius:9px;padding:10px;min-height:44px}a{color:#bcd6ff}button{cursor:pointer}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#151823;overflow:hidden;border:1px solid #3b4560;border-radius:16px}.stage.phone{width:min(390px,100%);aspect-ratio:9/16;margin:auto}.bg,.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.actor{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);height:72%;max-width:80%;object-fit:contain;object-position:center bottom}.dialog{position:absolute;left:4%;right:4%;bottom:3%;height:20%;background:#121828ee;border:1px solid #8591b4;border-radius:13px;padding:12px 22px;overflow:auto;font-size:clamp(13px,1.5vw,18px)}.dialog strong{color:#e6ce9a}.phone .actor{bottom:29%;height:64%;max-width:95%}.phone .dialog{height:24%;font-size:15px;padding:14px}.meta{font-size:14px;white-space:pre-wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:15px;background:#1d2638;border-radius:12px;min-width:0}.card img{width:100%;height:230px;object-fit:contain;background:repeating-conic-gradient(#566079 0% 25%,#46516a 0% 50%) 0/18px 18px}.card a{display:inline-block;margin:8px}.card h3{margin:0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;text-align:left;border-bottom:1px solid #37415a}.tableWrap{overflow-x:auto}summary{cursor:pointer;padding:12px}#error{color:#ffb7ad}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ecc382;outline-offset:3px}@media(max-width:600px){main{padding:14px}.controls>*{flex:1 1 140px}.stage{border-radius:10px}}
</style><main><h1>言の葉の檻 ― 千年の約束 ―</h1><p>第1・2章の素材確認。本編は未実装です。</p><nav><a href="manifest.json">manifest.json</a> · <a href="asset-list.csv">画像一覧</a> · <a href="scene-list.csv">場面一覧</a> · <a href="README.md">制作・出典・未制作事項</a></nav><div class="controls"><label>背景<select id="bgSelect"></select></label><label>人物<select id="charSelect"></select></label><label>状態<select id="stateSelect"></select></label><button id="phone">スマホ比率にする</button><button id="restore">回復前・後を切り替え</button><button id="check">全素材の読み込みを検査</button></div><p id="checkResult" role="status" aria-live="polite"></p><p id="error" role="alert"></p><section class="stage" id="stage" aria-label="背景・人物合成プレビュー"><img class="bg" id="bg" alt=""><div id="layers"></div><img id="actor" class="actor" alt=""><div class="dialog"><strong id="speaker">素材確認</strong><div>千年の記憶に、光が戻る。<br>会話枠・人物の頭と足・透過の縁を確認するための表示です。</div></div></section><div id="meta" class="meta" aria-live="polite"></div><h2>人物素材</h2><div id="cards" class="grid"></div><details><summary>背景18場面の対応</summary><div class="tableWrap"><table id="sceneTable"></table></div></details><details><summary>原寸マスター・基準画像</summary><div id="sourceLinks"></div></details><details><summary>未制作・要確認</summary><div id="pending"></div></details></main><script>
'use strict';let data,drawRevision=0;const $=id=>document.getElementById(id),stateLabels={normal:'通常',smile:'微笑',surprise:'驚き',hollow:'記憶喪失',sad:'悲しみ',resolve:'決意',fear:'恐怖',confused:'困惑',sealed:'封印'};function option(sel,value,label){let o=document.createElement('option');o.value=value;o.textContent=label;sel.append(o)}
function states(){let c=data.characters[$('charSelect').value];$('stateSelect').replaceChildren();for(let k in c.states)option($('stateSelect'),k,stateLabels[k]||k)}
async function draw(){const revision=++drawRevision;try{let b=data.backgrounds[$('bgSelect').value],c=data.characters[$('charSelect').value],s=c.states[$('stateSelect').value];$('bg').src=b.file;$('bg').style.filter=b.filter;$('bg').alt=b.label;$('actor').src=s.file;$('actor').alt=c.label+' '+(stateLabels[$('stateSelect').value]||'');$('layers').replaceChildren();for(let l of b.layers){let im=new Image();im.className='layer';im.src=l.file;im.style.opacity=l.opacity;im.alt='';$('layers').append(im)}$('speaker').textContent=c.label;$('meta').textContent=$('bgSelect').value+' '+b.label+'\n'+s.file+' · '+Math.round(s.bytes/1024)+' KB · '+s.width+' × '+s.height;$('error').textContent='';await Promise.all([$('actor').decode(),$('bg').decode()]);}catch(e){if(revision!==drawRevision)return;$('error').textContent='画像を読み込めません。再度選択してください。 '+e.message}}
fetch('manifest.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(m=>{data=m;for(let[k,v]of Object.entries(m.backgrounds))option($('bgSelect'),k,k+' '+v.label);for(let[k,v]of Object.entries(m.characters))option($('charSelect'),k,v.label);states();draw();for(let[k,c]of Object.entries(m.characters)){let article=document.createElement('article');article.className='card';let h=document.createElement('h3');h.textContent=c.label;article.append(h);let im=new Image();im.loading='lazy';im.src=c.states.normal.file;im.alt=c.label+' 通常';article.append(im);for(let[state,v]of Object.entries(c.states)){let a=document.createElement('a');a.href=v.file;a.textContent=stateLabels[state]||state;a.download='';article.append(a)}let b=document.createElement('button');b.textContent='合成で見る';b.onclick=()=>{$('charSelect').value=k;states();draw();$('stage').scrollIntoView({block:'center'})};article.append(b);$('cards').append(article)}let t=$('sceneTable');for(let[id,b]of Object.entries(m.backgrounds)){let row=t.insertRow();for(let s of [id,b.label,b.file,b.filter])row.insertCell().textContent=s}for(let v of [...Object.values(m.masters),...Object.values(m.referenceMap)]){let a=document.createElement('a');a.href=v.file;a.textContent=v.file;a.style.display='block';$('sourceLinks').append(a)}for(let b of [...m.backlog,...m.limitations.map(label=>({label}))]){let p=document.createElement('p');p.textContent=(b.id?b.id+' ':'')+b.label;$('pending').append(p)}}).catch(e=>$('error').textContent='manifestの読み込みに失敗しました。 '+e.message);
$('charSelect').onchange=()=>{states();draw()};$('bgSelect').onchange=draw;$('stateSelect').onchange=draw;$('phone').onclick=()=>{let on=$('stage').classList.toggle('phone');$('phone').textContent=on?'PC比率にする':'スマホ比率にする'};$('restore').onclick=()=>{let sel=$('stateSelect');let c=data.characters[$('charSelect').value];sel.value=(sel.value==='hollow'||sel.value==='sealed')?'normal':(c.states.hollow?'hollow':c.states.sealed?'sealed':'normal');draw()};
$('check').onclick=async()=>{if(!data)return;let files=data.files.filter(v=>['backgrounds','characters','effects'].includes(v.kind)),bad=[];let btn=$('check');btn.disabled=true;let count=0;for(let f of files){try{let im=new Image();im.src=f.file;await im.decode();if(im.naturalWidth!==f.width||im.naturalHeight!==f.height)throw Error('size mismatch')}catch(e){bad.push(f.file)}$('checkResult').textContent='検査 '+(++count)+' / '+files.length} $('checkResult').textContent=bad.length?'読み込み失敗：'+bad.join(', '):files.length+'枚すべて読み込み成功（実装用素材）';btn.disabled=false};</script></html>
