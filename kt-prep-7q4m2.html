let questions=[];
let keys={};
let playerEl=$('#player');
let battle=null;
let animTick=0;
let frame=0;
let lastMove=0;
let state = defaultState();
let sessionAsked = new Set();

function defaultState(){
  return {version:1,heroName:'',nick:'',classNo:'1',number:'',char:'boy',level:1,exp:0,hp:100,maxHp:100,chapter:1,x:170,y:360,combo:0,correct:0,total:0,playCount:0,chapterKills:{},chapterBoss:{},inventory:{potionSmall:2,potionMedium:1,potionFull:0,hintNote:1,hintScroll:0,hintBook:0},wrongQueue:[],seen:[],titles:['塔への挑戦者'],activeTitle:'塔への挑戦者',excluded:false,lastSaveAt:0,lastDailyChest:'',weeklyExp:0,weeklyCorrect:0,categoryStats:{},cleared:false};
}
function cumExpForLevel(lv){ if(lv<=1)return 0; return Math.round(45*Math.pow(lv-1,1.65)); }
function levelFromExp(exp){ let lv=1; while(lv<99 && exp>=cumExpForLevel(lv+1)) lv++; return lv; }
function currentChapter(){return chapterDefs[state.chapter-1];}
function xpProgress(){ if(state.level>=99)return [1,1]; let a=cumExpForLevel(state.level),b=cumExpForLevel(state.level+1);return [state.exp-a,b-a]; }
function storageKey(){return `kotoba_save_${state.classNo}_${state.number}`;}
function saveLocal(){state.lastSaveAt=Date.now();localStorage.setItem(storageKey(),JSON.stringify(state));localStorage.setItem('kotoba_last_key',storageKey());}
function loadLocal(){let k=localStorage.getItem('kotoba_last_key');if(!k)return false;let v=localStorage.getItem(k);if(!v)return false;try{state={...defaultState(),...JSON.parse(v)};state.inventory={...defaultState().inventory,...state.inventory};return true}catch(e){return false}}
function showScreen(id){$$('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function modal(id,on=true){$(id).classList.toggle('hidden',!on)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function fetchQuestions(){ return window.KOTOBA_QUESTIONS || []; }
async function apiPost(payload){
  if(!CFG.GAS_API_URL)return {ok:false,offline:true};
  try{let r=await fetch(CFG.GAS_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});return await r.json()}catch(e){return {ok:false,error:String(e)}}
}
async function apiGet(action,params={}){
  if(!CFG.GAS_API_URL)return {ok:false,offline:true};
  try{let u=new URL(CFG.GAS_API_URL);u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));let r=await fetch(u);return await r.json()}catch(e){return {ok:false,error:String(e)}}
}
async function saveAll(show=true){
  saveLocal();
  const payload={action:'savePlayer',player:publicSavePayload()};
  let res=await apiPost(payload);
  if(show)dialog(res.ok?'セーブしました。ランキングにも記録を送信しました。':'端末にセーブしました。ランキング通信は未設定または失敗しています。');
}
function publicSavePayload(){return {id:`${state.classNo}-${state.number}`,classNo:state.classNo,nick:state.nick,heroName:state.heroName,level:state.level,exp:state.exp,correctCount:state.correct,totalCount:state.total,accuracy:state.total?state.correct/state.total:0,title:state.activeTitle,playCount:state.playCount,chapter:state.chapter,weeklyExp:state.weeklyExp,weeklyCorrect:state.weeklyCorrect,inventory:state.inventory,categoryStats:state.categoryStats,wrongQueue:state.wrongQueue,clientSavedAt:Date.now()};}
function updateHud(){
  $('#hudName').textContent=`${state.heroName}（${state.classNo}組）`;$('#hudLv').textContent=state.level;$('#hudHp').textContent=state.hp;$('#hudHpMax').textContent=state.maxHp;
  let [p,m]=xpProgress();$('#xpBar').style.width=`${Math.min(100,p/m*100)}%`;$('#xpText').textContent=state.level>=99?'MAX':`${p}/${m}`;
  $('#statusText').innerHTML=`Lv.${state.level}<br>正解 ${state.correct}/${state.total}（${state.total?Math.round(state.correct/state.total*100):0}%）<br>連続正解 ${state.combo}<br>称号：${esc(state.activeTitle)}`;
  $('#missionText').innerHTML=missionText();renderInventory();
}
function missionText(){let ch=currentChapter(),kills=state.chapterKills[ch.n]||0,boss=state.chapterBoss[ch.n];if(ch.n===8&&boss)return '最終試練突破。AFTER CLEARで弱点克服に挑戦しよう。';if(boss){let next=chapterDefs[ch.n];return next?`第${ch.n}章クリア。Lv.${next.lv}で次の扉が開く。`:'クリア';}return kills<3?`${ch.name}<br>守護者の手下をあと ${3-kills} 体倒す。`:'ボスが出現した。守護者を倒せ。';}
function renderInventory(){let el=$('#inventoryGrid');el.innerHTML='';Object.entries(itemDefs).forEach(([k,d])=>{let b=document.createElement('button');b.className='itemBtn';b.style.backgroundImage=`url('${d.img}')`;b.textContent=`${d.name} ×${state.inventory[k]||0}`;b.disabled=true;el.appendChild(b)});}
function chapterEnemyCount(){return 5;}
function setupMap(){
  let ch=currentChapter();$('#chapterLabel').textContent=`第${ch.n}章 ${ch.name}`;
  playerEl.className=`sprite player ${state.char} down`;setPlayerPos();
  $('#npcTeacher').style.left='80px';$('#npcTeacher').style.top='75px';$('#savePoint').style.left='215px';$('#savePoint').style.top='80px';$('#gate').style.right='44px';$('#gate').style.top='70px';
  renderEnemies();renderObjects();updateHud();
}
function renderObjects(){let layer=$('#objectLayer');layer.innerHTML='';let c=document.createElement('div');c.className='object chest';c.style.left='73%';c.style.top='68%';c.dataset.kind='chest';let today=new Date().toISOString().slice(0,10);if(state.lastDailyChest===today)c.classList.add('opened');layer.appendChild(c);}
function renderEnemies(){let layer=$('#enemyLayer');layer.innerHTML='';let ch=currentChapter(),kills=state.chapterKills[ch.n]||0,bossDone=state.chapterBoss[ch.n];
  if(!bossDone && kills>=3){spawnEnemy(layer,true,54,50);return;}
  for(let i=0;i<chapterEnemyCount();i++){spawnEnemy(layer,false,18+(i%3)*24,25+Math.floor(i/3)*40)}
}
function spawnEnemy(layer,isBoss,xPct,yPct){let ch=currentChapter(),e=document.createElement('div');e.className='enemy';e.dataset.boss=isBoss?'1':'0';e.dataset.spawn=Date.now();e.style.left=`${xPct}%`;e.style.top=`${yPct}%`;e.style.backgroundImage=`url('${asset('assets/enemies/'+(isBoss?ch.boss:ch.enemy))}')`;if(isBoss){e.style.width=ch.n===8?'160px':'105px';e.style.height=ch.n===8?'160px':'105px'}layer.appendChild(e);}
function setPlayerPos(){playerEl.style.left=state.x+'px';playerEl.style.top=state.y+'px';}
function worldBounds(){let w=$('#world');return {w:w.clientWidth,h:w.clientHeight};}
function rect(el){return el.getBoundingClientRect();}
function overlap(a,b,pad=0){return a.left+pad<b.right-pad&&a.right-pad>b.left+pad&&a.top+pad<b.bottom-pad&&a.bottom-pad>b.top+pad}
function moveLoop(ts){
  if($('#gameScreen').classList.contains('active')&&!battle){let dx=0,dy=0;let fast=keys['z']||keys['Z'];let sp=fast?4.6:2.5;if(keys['ArrowLeft'])dx=-sp;if(keys['ArrowRight'])dx=sp;if(keys['ArrowUp'])dy=-sp;if(keys['ArrowDown'])dy=sp;if(dx||dy){if(dx<0)face('left');else if(dx>0)face('right');else if(dy<0)face('up');else face('down');let b=worldBounds();state.x=Math.max(0,Math.min(b.w-64,state.x+dx));state.y=Math.max(0,Math.min(b.h-96,state.y+dy));setPlayerPos();animateWalk(ts);checkCollisions();}}
  requestAnimationFrame(moveLoop);
}

function openChest(el){let today=new Date().toISOString().slice(0,10);if(state.lastDailyChest===today)return;state.lastDailyChest=today;el.classList.add('opened');let pool=['hintNote','hintScroll','hintBook'];let k=pool[Math.floor(Math.random()*pool.length)];state.inventory[k]=Math.min(itemDefs[k].max,(state.inventory[k]||0)+1);dialog(`宝箱から「${itemDefs[k].name}」を手に入れた！`);updateHud();saveLocal();}
let gateLock=false;function tryGate(){if(gateLock)return;gateLock=true;setTimeout(()=>gateLock=false,1000);let ch=currentChapter();if(!state.chapterBoss[ch.n])return dialog('この階の守護者を倒さなければ、扉は開かない。');if(ch.n>=8)return;if(state.level<chapterDefs[ch.n].lv)return dialog(`次の階へ進むには Lv.${chapterDefs[ch.n].lv} が必要です。現在 Lv.${state.level}。`);state.chapter++;state.x=110;state.y=360;saveAll(false);setupMap();dialog(`第${state.chapter}章「${currentChapter().name}」へ進んだ。`);}
function talkNearest(){let pr=rect(playerEl);if(overlap(pr,rect($('#npcTeacher')),-45))dialog(teacherDialog());else if(overlap(pr,rect($('#savePoint')),-35))saveAll(true);else if(overlap(pr,rect($('#gate')),-35))tryGate();}
function teacherDialog(){let ch=currentChapter();if(ch.n===1)return '先生「知っているつもりになることが、一番怖い。意味を確かめながら進め。」';if(ch.n===4)return '先生「音と訓は、丸暗記だけでなく組み合わせを見るんだ。」';if(ch.n===8)return '先生「ここまで来たなら、最後は自分の言葉を信じろ。」';return `先生「${ch.name}では、${ch.cat==='混合'?'これまでの全分野':ch.cat}を確かめよう。」`;}
function selectQuestion(cat,difficulty){let pool=questions.filter(q=>(cat==='混合'||q.category===cat)&&q.difficulty<=difficulty&&!sessionAsked.has(q.id));let seen=new Set(state.seen||[]);let unseen=pool.filter(q=>!seen.has(q.id));if(unseen.length)pool=unseen;let wrong=(state.wrongQueue||[]).filter(id=>pool.some(q=>q.id===id));if(wrong.length&&Math.random()<.35){let q=questions.find(x=>x.id===wrong[Math.floor(Math.random()*wrong.length)]);if(q)return q;}if(!pool.length){sessionAsked.clear();pool=questions.filter(q=>(cat==='混合'||q.category===cat)&&q.difficulty<=difficulty);}return pool[Math.floor(Math.random()*pool.length)];}
function battleDifficulty(){return state.level<21?1:state.level<51?2:3;}
function startBattle(enemyEl){if(battle)return;let ch=currentChapter(),boss=enemyEl.dataset.boss==='1';let hp=boss?(ch.n===8?25:15):Math.min(8,3+Math.floor((ch.n-1)/2));battle={enemyEl,boss,name:boss?ch.bossName:`${ch.cat==='混合'?'ことば':ch.cat}の魔物`,hp,maxHp:hp,question:null,answered:false,removedChoices:[]};$('#enemyName').textContent=battle.name;$('#enemyImg').src=asset('assets/enemies/'+(boss?ch.boss:ch.enemy));modal('#battleModal',true);renderBattleTools();nextQuestion();}
function renderBattleTools(){let el=$('#battleTools');el.innerHTML='';Object.entries(itemDefs).forEach(([k,d])=>{let n=state.inventory[k]||0;if(!n)return;let b=document.createElement('button');b.className='toolBtn';b.textContent=`${d.name} ×${n}`;b.onclick=()=>useBattleItem(k);el.appendChild(b)});}
function useBattleItem(k){if(!battle||battle.answered||!(state.inventory[k]>0))return;let d=itemDefs[k];if(d.heal){state.hp=Math.min(state.maxHp,Math.round(state.hp+state.maxHp*d.heal));state.inventory[k]--;$('#feedback').textContent=`${d.name}を使った。HPが回復した。`;updateHud();renderBattleTools();return;}if(d.hint==='two'){let buttons=$$('#choices .choice').filter(b=>b.dataset.letter!==battle.question.answer&&!b.disabled);buttons.sort(()=>Math.random()-.5).slice(0,2).forEach(b=>{b.disabled=true;b.style.opacity=.25});}else $('#feedback').textContent=d.hint==='h1'?battle.question.hint1:battle.question.hint2;state.inventory[k]--;renderBattleTools();updateHud();}
function nextQuestion(){battle.answered=false;$('#btnNextQuestion').classList.add('hidden');$('#feedback').textContent='';let q=selectQuestion(currentChapter().cat,battleDifficulty());battle.question=q;sessionAsked.add(q.id);if(!(state.seen||[]).includes(q.id))state.seen.push(q.id);$('#questionBox').textContent=q.question;let c=$('#choices');c.innerHTML='';q.choices.forEach((t,i)=>{let b=document.createElement('button');b.className='choice';b.dataset.letter=letters[i];b.innerHTML=`<b>${letters[i]}</b>　${esc(t)}`;b.onclick=()=>answer(b);c.appendChild(b)});renderBattleTools();}
function answer(btn){if(battle.answered)return;battle.answered=true;let q=battle.question,ok=btn.dataset.letter===q.answer;state.total++;state.categoryStats[q.category]=state.categoryStats[q.category]||{correct:0,total:0,wrong:{}};state.categoryStats[q.category].total++;if(ok){beep(660,.12,'square',.03);state.categoryStats[q.category].correct++;state.correct++;state.weeklyCorrect++;state.combo++;let damage=1+Math.floor(state.combo/3);battle.hp=Math.max(0,battle.hp-damage);let gain=Math.round(q.baseExp*(1+Math.min(.5,state.combo*.03)));gainExp(gain);btn.classList.add('correct');$('#feedback').innerHTML=`正解！ ${damage}ダメージ／+${gain}EXP<br>${esc(q.explanation)}`;state.wrongQueue=(state.wrongQueue||[]).filter(x=>x!==q.id);}else{beep(150,.18,'sawtooth',.025);state.combo=0;state.hp=Math.max(0,state.hp-Math.max(8,8+currentChapter().n*2));state.exp=Math.max(cumExpForLevel(state.level),state.exp-20);btn.classList.add('wrong');$$('#choices .choice').find(b=>b.dataset.letter===q.answer)?.classList.add('correct');$('#feedback').innerHTML=`不正解。正答：${esc(q.answerText)}<br>${esc(q.explanation)}<br><small>ヒント：${esc(q.hint1)}</small>`;if(!state.wrongQueue.includes(q.id))state.wrongQueue.push(q.id);state.categoryStats[q.category].wrong[q.id]=(state.categoryStats[q.category].wrong[q.id]||0)+1;}
  updateEnemyHp();updateHud();$$('#choices .choice').forEach(b=>b.disabled=true);if(state.hp<=0){setTimeout(defeated,700);return;}if(battle.hp<=0){setTimeout(winBattle,700);return;}$('#btnNextQuestion').classList.remove('hidden');}
function gainExp(n){let old=state.level;state.exp+=n;state.weeklyExp+=n;state.level=levelFromExp(state.exp);state.maxHp=100+(state.level-1)*2;if(state.level>old){beep(523,.12,'triangle',.04);setTimeout(()=>beep(659,.12,'triangle',.04),130);setTimeout(()=>beep(784,.18,'triangle',.04),260);state.hp=state.maxHp;dialogSoon(`LEVEL UP！ Lv.${old} → Lv.${state.level}`);if(state.level===99&&!state.titles.includes('Lv99到達者')){state.titles.push('Lv99到達者');state.activeTitle='Lv99到達者';}}}
function updateEnemyHp(){$('#enemyHpBar').style.width=`${battle.hp/battle.maxHp*100}%`;}
$('#btnNextQuestion').onclick=nextQuestion;
function winBattle(){let b=battle;modal('#battleModal',false);battle=null;let ch=currentChapter();if(b.boss){state.chapterBoss[ch.n]=true;if(!state.titles.includes(`${ch.name}の突破者`))state.titles.push(`${ch.name}の突破者`);if(ch.n===8){state.cleared=true;state.activeTitle='ことばの継承者';if(!state.titles.includes('ことばの継承者'))state.titles.push('ことばの継承者');saveAll(false);showEnding();return;}dialog(`${ch.name}の守護者を倒した！「ことばの鍵」を手に入れた。`);}else{state.chapterKills[ch.n]=(state.chapterKills[ch.n]||0)+1;dropItem();b.enemyEl.style.display='none';let delay=(5+Math.random()*2)*60000;setTimeout(()=>{if(document.body.contains(b.enemyEl))b.enemyEl.style.display='block'},delay);}updateHud();saveLocal();renderEnemies();}
function dropItem(){if(Math.random()<.28){let k=Math.random()<.75?'potionSmall':'potionMedium';state.inventory[k]=Math.min(itemDefs[k].max,(state.inventory[k]||0)+1);dialogSoon(`${itemDefs[k].name}を拾った。`);}}
function defeated(){modal('#battleModal',false);battle=null;state.hp=state.maxHp;let saved=loadLocal();if(!saved){state.x=150;state.y=350}showScreen('#gameScreen');setupMap();dialog('力尽きた……。最後のセーブ地点から再開します。');}
function dialog(t){$('#dialogText').innerHTML=String(t).replace(/\n/g,'<br>');modal('#dialogModal',true)}function dialogSoon(t){setTimeout(()=>dialog(t),150)}$('#dialogClose').onclick=()=>modal('#dialogModal',false);
function showEnding(){let acc=state.total?Math.round(state.correct/state.total*1000)/10:0;$('#endingText').innerHTML=`<h2>『コトバの塔』 CLEAR</h2><p>言霊の大賢者「合格だ。言葉は、守るだけでは生きられない。君が使い、誰かへ伝えることで次へ続いていく。」</p><p>先生「分からない言葉に出会って考えたこと。似た言葉の違いに迷ったこと。間違えて、もう一度答えたこと。その全部が、もう君の力になっている。」</p><p><b>卒業まで、あと少し。<br>入試まで、あと少し。<br>でも、君が身につけた言葉は、この先もずっと続いていく。</b></p><p class="big">「行ってきます。」</p><hr><p>${esc(state.heroName)}　Lv.${state.level}<br>総挑戦 ${state.total}問／正解 ${state.correct}問／正答率 ${acc}%<br>称号「ことばの継承者」</p>`;modal('#endingModal',true)}
$('#endingClose').onclick=()=>modal('#endingModal',false);
async function showRanking(classFilter=''){let data=[];let r=await apiGet('ranking',{limit:CFG.RANKING_LIMIT||50,classNo:classFilter});if(r.ok)data=r.ranking||[];if(!data.length){data=[publicSavePayload()]}data.sort((a,b)=>b.level-a.level||b.exp-a.exp||b.correctCount-a.correctCount);let rows=data.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.nick)}</td><td>${esc(x.classNo)}組</td><td>Lv.${x.level}</td><td>${x.exp}</td><td>${Math.round((x.accuracy||0)*100)}%</td><td>${esc(x.title||'')}</td></tr>`).join('');$('#rankingTable').innerHTML=`<div style="margin-bottom:10px">表示：<select id="rankFilter"><option value="">学年全体</option><option value="1">1組</option><option value="2">2組</option><option value="3">3組</option><option value="4">4組</option></select></div><table class="rankTable"><thead><tr><th>順位</th><th>ニックネーム</th><th>組</th><th>Lv</th><th>EXP</th><th>正答率</th><th>称号</th></tr></thead><tbody>${rows}</tbody></table>`;$('#rankFilter').value=classFilter;$('#rankFilter').onchange=e=>showRanking(e.target.value);modal('#rankingModal',true)}
$('#btnRanking').onclick=showRanking;$('#rankingClose').onclick=()=>modal('#rankingModal',false);$('#btnSave').onclick=()=>saveAll(true);
function startNew(){let hero=$('#inputHeroName').value.trim(),nick=$('#inputNick').value.trim(),num=$('#inputNumber').value.trim();if(!hero||!nick||!num)return dialog('主人公名・出席番号・ニックネームを入力してください。');state=defaultState();state.heroName=hero;state.nick=nick;state.number=num;state.classNo=$('#inputClass').value;state.char=$('.charCard.selected').dataset.char;state.playCount=1;saveLocal();showScreen('#gameScreen');setupMap();dialog('放課後。学校から、少しずつ「言葉」が消え始めた。\n先生「最近、言葉が少しずつ消えていると思わないか。」\n図書室の奥で、コトバの塔への入口が開く。');}
$('#btnStart').onclick=startNew;$('#btnContinue').onclick=()=>{if(!loadLocal())return dialog('保存データがありません。');state.playCount++;showScreen('#gameScreen');setupMap();dialog(`おかえり、${esc(state.heroName)}。最後のセーブ地点から再開します。`)};
$$('.charCard').forEach(b=>b.onclick=()=>{$$('.charCard').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
let muted=localStorage.getItem('kotoba_muted')!=='0';let audioCtx=null,bgmTimer=null;function beep(freq=440,dur=.08,type='square',vol=.04){if(muted)return;audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}function startBgm(){if(muted||bgmTimer)return;let notes=[220,277,330,392],i=0;bgmTimer=setInterval(()=>{beep(notes[i++%notes.length],.18,'triangle',.012)},900)}function stopBgm(){clearInterval(bgmTimer);bgmTimer=null}function syncSound(){$('#btnSound').textContent=muted?'🔇':'🔊';localStorage.setItem('kotoba_muted',muted?'1':'0');muted?stopBgm():startBgm()}$('#btnSound').onclick=()=>{muted=!muted;syncSound()};syncSound();
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ') {e.preventDefault();talkNearest()}});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('beforeunload',()=>saveLocal());
(async()=>{questions=await fetchQuestions();requestAnimationFrame(moveLoop);})();
})();
