function page(tab){if(tab==='bag'){$('pages').innerHTML=`<h3>旅を整える</h3><p>所持金 ${state.coins}文　草鞋 ${Math.floor(state.sandals)}%　握り飯 ${state.rice}個</p><div class="row"><span>握り飯を食べる<br><small>満腹度 +32 / 5分</small></span><button id="eat">食べる</button></div><div class="row"><span>腰を下ろして休む<br><small>体力 +30 / 満腹度 −5 / 15分</small></span><button id="restbtn">休憩</button></div><div class="row"><span>草鞋を履き替える（予備 ${state.spare}足）<br><small>耐久度を回復 / 5分</small></span><button id="change">交換</button></div><div class="row"><button id="savebtn">保存する</button><button id="loadbtn">読み込み</button><button id="export">記録を書き出す</button></div><div class="row"><label>記録を読み込む <input id="import" type="file" accept="application/json" style="max-width:180px"></label></div><p>会話・手帳を開いている間、時間は止まります。保存はこの端末・ブラウザ内。別端末へは記録を書き出してください。</p>`;$('eat').onclick=()=>{if(state.rice<1){toast('握り飯がありません');return}state.rice--;state.hunger=clamp(state.hunger+32,0,100);state.minute+=5;page(tab);toast('握り飯を食べた。少し、元気が戻る。')};$('restbtn').onclick=()=>{state.energy=clamp(state.energy+30,0,100);state.hunger=clamp(state.hunger-5,0,100);state.minute+=15;page(tab);toast('木陰でひと休み。風が頬をなでる。')};$('change').onclick=()=>{if(!state.spare){toast('予備の草鞋がありません');return}state.spare--;state.sandals=100;state.minute+=5;page(tab);toast('草鞋を履き替えた')};$('savebtn').onclick=()=>save();$('loadbtn').onclick=()=>{load();page(tab)};$('export').onclick=()=>{const data=JSON.stringify({version:1,p,s,state,trail});const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download='okuno-travel-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{try{restore(JSON.parse(await e.target.files[0].text()));page(tab);toast('旅の記録を読み込みました')}catch{toast('読み込めない記録です')}}}else if(tab==='notes'){$('pages').innerHTML='<h3>森で出会ったもの</h3>'+stops.map(o=>`<div class="row"><span>${state.flags[o.id]?'✓ '+o.name:'○ まだ見ぬ風景'}</span><small>創作</small></div>`).join('')+'<p>この試作の街道配置・会話・握り飯・動物・沢辺は創作です。芭蕉の史実を再現した行程ではありません。</p>'}else{$('pages').innerHTML=`<h3>第IV章・森林街道試作</h3><p>史実の旅を学ぶ入口として、旅の生活と探索の手触りを検討する試作です。高館・中尊寺・三句のシネマティック演出は未実装です。</p><p>光村図書・令和7年度版の教材名は公開資料で確認。学校の使用版・掲載本文全体は未確認のため、教科書準拠の照合は未完了です。</p><p><a href="data:text/plain;charset=utf-8;base64,IyDjgYrjgY/jga7jgbvjgZ3pgZMg4oCUIOesrElW56ug44CM5aSP6I2J44Gu5aSi44CN5qOu5p6X6KGX6YGT6Kmm5L2cIHYwLjEKCuWItuS9nOaXpe+8mjIwMjYtMTAtMjDjgILliJ3lm57jga7nvo7ooZPjg7vmk43kvZzoqabkvZzjgILnrKxJVueroOWujOaIkOeJiOOBp+OBr+OBguOCiuOBvuOBm+OCk+OAggoKIyMg6LW35YuV44O75pON5L2cCgrphY3luIPnlKggYG9rdW5vX2ZvcmVzdF9wcm90b3R5cGUuaHRtbGAg44Gv44CB55S75YOP44O7Q1NT44O7SmF2YVNjcmlwdOOCkuWGheWMheOBmeOCi+WNmOS9k0hUTUzjgafjgZnjgILjg5bjg6njgqbjgrbjgafplovjgYTjgabmk43kvZzjgafjgY3jgb7jgZnjgILjgr3jg7zjgrnniYjjga8gYGRpc3QvaW5kZXguaHRtbGAg44KS6ZaL44GN44G+44GZ44CC44ON44OD44OI5o6l57aa44O75aSW6YOo44Op44Kk44OW44Op44Oq44O75aSW6YOo44OV44Kp44Oz44OI44O7QVBJ44Gv5LiN6KaB44Gn44GZ44CC44OW44Op44Km44K244Gu5L+d5a2Y6KaP5YmH44Gr44KI44Gj44Gm44Ot44O844Kr44OrSFRNTOOBruS/neWtmOmgmOWfn+OBjOWkieOCj+OCi+WgtOWQiOOBr+OAgeaJi+W4s+OBruiomOmMsuabuOOBjeWHuuOBl+OCkuS9v+OBo+OBpuOBj+OBoOOBleOBhOOAggoKLSDnn6LljbAgLyBXQVNE77yaOOaWueWQkeenu+WLleOAguaWnOOCgeenu+WLleOBrumAn+W6puOCkuato+imj+WMluOAggotIFNoaWZ077ya5oq844GX44Gm44GE44KL6ZaT44OA44OD44K344Ol44CC44K544Oe44Ob44Gv5bem5LiL44Gu5Luu5oOz44Ki44OK44Ot44Kw44K544OG44Kj44OD44Kv44KS5YCS44GX44Gm56e75YuV44CC5YCS44GZ6YeP44Gn5q2p6KGM6YCf5bqm44GM5aSJ5YyW44GX44CB6Zui44GZ44Go5YGc5q2i44CC44CM6LWw44KL44CN44Gv5YiH5pu/44CCCi0gU3BhY2UgLyBFbnRlciAvIOiqv+OBueOCi++8mui/keOBj+OBruWFieOCkuiqv+OBueOCi+OAguS8muipseOBr+S4gOWbnuOBp+WFqOaWh+ihqOekuuOAgeOCguOBhuS4gOWbnuOBp+asoeOBuOOAggotIErvvJrmiYvluLPjgIJL77ya56uv5pyr5YaF5L+d5a2Y44CCRXNj77ya5omL5biz44KS6ZaJ44GY44KL44CCCi0g5omL5biz77ya6aOf5LqL44O75LyR5oap44O76I2J6Z6L5Lqk5o+b44O75L+d5a2Y44O76Kqt6L6844O7SlNPTuabuOOBjeWHuuOBl++8j+iqreOBv+i+vOOBv+OAggotIOWIneacn+mfs+mHj+OBr09GRuOAgumfs+OCkuWFpeOCjOOCi+OBqOi2s+mfs+OBqOS8muipseOBruefremfs+OBjOmztOOCiuOBvuOBmeOAggoKOOOBpOOBruimi+OBqeOBk+OCjeOCkuiqr
