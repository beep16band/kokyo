const battlePanel=document.createElement('section');battlePanel.id='ch1-battle';battlePanel.hidden=true;battlePanel.innerHTML='<div id="battle-name"></div><div id="battle-art"></div><div id="battle-question"></div><div id="battle-choices"></div><div id="battle-feedback" aria-live="polite"></div><div id="battle-actions"><button id="battle-potion">回復薬 小（HP+20）</button><button id="battle-next" hidden>次へ</button></div>';document.querySelector('#app').append(battlePanel);
const uiStyle=document.createElement('style');uiStyle.textContent='#app{position:relative}#field{object-fit:contain}#ch1-battle{position:absolute;inset:46px 0 0;z-index:6;background:#10182a;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;overflow:auto}#ch1-battle[hidden]{display:none}#battle-name{color:#fff0a9;font-size:17px}#battle-art{position:relative;width:100%;height:180px;flex-shrink:0;background-size:cover;background-position:center;image-rendering:pixelated}#battle-art img{position:absolute;object-fit:contain;image-rendering:pixelated}#battle-question,#battle-feedback{width:min(100%,800px);white-space:pre-line;line-height:1.5;padding:10px;border:2px solid #e0d4ad;background:#081329}#battle-choices{width:min(100%,800px);display:grid;grid-template-columns:1fr 1fr;gap:6px}#battle-choices button{text-align:left;min-height:46px}#battle-actions{display:flex;gap:12px}#battle-choices button.selected{background:#526fa1;border-color:#fff7b1;box-shadow:inset 0 0 0 2px #ffe7a1}#battle-feedback:empty{display:none}.attack{animation:attack .35s}.hurt{animation:hurt .4s}@keyframes attack{50%{transform:translateX(30px)}}@keyframes hurt{30%,70%{opacity:.2;transform:translateX(-7px)}}@media(max-width:600px){#ch1-battle{inset:42px 0 0;padding:8px;gap:5px}#battle-art{height:130px}#battle-choices{grid-template-columns:1fr}#battle-choices button{padding:8px;min-height:42px;font-size:13px}#battle-question,#battle-feedback{font-size:13px;padding:7px}#battle-name{font-size:14px}}';document.head.append(uiStyle);
const battleNames={first:'欠字獣',second:'欠字獣',coop:'文字の残滓',late:'文字の残滓',bakuro:'喰字獣バクロ'};
function startBattle(id,max){closeDialogueBox();keys={};battle={id,hp:max,max,q:0,answered:false,turn:0};battlePanel.hidden=false;const art=document.querySelector('#battle-art');art.style.backgroundImage='url(../assets/kotoba-tower/'+maps[p.scene].image+'.webp)';art.innerHTML='<img id="battle-hero" src="../assets/kotoba-tower/hero-v2-front.png" style="left:8%;bottom:8px;width:70px;height:105px">'+(story.renJoined?'<img id="battle-ren" src="../assets/kotoba-tower/ren-front.webp" style="left:20%;bottom:8px;width:66px;height:100px">':'')+'<img id="battle-enemy" src="../assets/kotoba-tower/bakuro-battle.webp" style="right:22%;bottom:12px;width:'+(id==='bakuro'?160:110)+'px;height:150px">';nextQuestion()}
function nextQuestion(){let ids=existingQuestions.map((_,i)=>i).filter(i=>!stats.seen.includes(i));if(!ids.length){ids=existingQuestions.map((_,i)=>i);if(stats.wrong.length)ids=[...new Set([...stats.wrong,...ids])]}const appropriate=ids.filter(i=>existingQuestions[i][4].level<=(battle.id==='bakuro'?2:1));if(appropriate.length)ids=appropriate;battle.selected=0;battle.q=ids[Math.floor(Math.random()*ids.length)];stats.seen.push(battle.q);battle.answered=false;const q=existingQuestions[battle.q];document.querySelector('#battle-name').textContent=battleNames[battle.id]+'　HP '+battle.hp+'/'+battle.max+'　あなた HP '+stats.hp+'/'+stats.max;document.querySelector('#battle-question').textContent=q[0];document.querySelector('#battle-feedback').textContent='';document.querySelector('#battle-next').hidden=true;const choices=document.querySelector('#battle-choices');choices.replaceChildren();q[1].forEach((text,i)=>{const b=document.createElement('button');b.textContent='ABCD'[i]+'　'+text;b.onclick=()=>answerBattle(i);choices.append(b)});markBattleChoice();updatePotion()}
function markBattleChoice(){document.querySelectorAll('#battle-choices button').forEach((b,i)=>b.classList.toggle('selected',i===(battle?.selected||0)))}

function updatePotion(){const b=document.querySelector('#battle-potion');b.textContent='回復薬 小 ×'+stats.potions+'（HP+20）';b.disabled=!stats.potions||stats.hp>=stats.max||!!battle?.answered}
function animate(id,kind){const el=document.querySelector(id);if(!el)return;el.classList.remove('attack','hurt');void el.offsetWidth;el.classList.add(kind)}
function answerBattle(i){if(!battle||battle.answered)return;battle.answered=true;battle.turn++;document.querySelectorAll('#battle-choices button').forEach(b=>b.disabled=true);stats.total++;const q=existingQuestions[battle.q],ok=i===q[2];let words;if(ok){stats.correct++;stats.streak++;battle.hp=Math.max(0,battle.hp-1);animate('#battle-hero','attack');animate('#battle-enemy','hurt');words='正解！　主人公の攻撃！\n'+q[3]+'\n敵に1ダメージ。';if(story.renJoined&&battle.turn%2===0){animate('#battle-ren','attack');words+='\nレン「まだだ！」　追撃！'}stats.exp+=8}else{stats.streak=0;stats.hp=Math.max(0,stats.hp-5);stats.exp=Math.max(0,stats.exp-2);if(!stats.wrong.includes(battle.q))stats.wrong.push(battle.q);animate('#battle-enemy','attack');animate('#battle-hero','hurt');words='不正解。正解は「'+q[1][q[2]]+'」。\n'+q[3]+'\n敵の攻撃！　HPが5減った。意味を確かめて、もう一度考えよう。'}document.querySelector('#battle-feedback').textContent=words;document.querySelector('#battle-name').textContent=battleNames[battle.id]+'　HP '+battle.hp+'/'+battle.max+'　あなた HP '+stats.hp+'/'+stats.max;document.querySelector('#battle-next').hidden=false;document.querySelector('#battle-enemy').style.filter=battle.id==='bakuro'&&battle.hp<=2?'brightness(1.35)':battle.id==='bakuro'&&battle.hp<=4?'contrast(1.25)':'none';updatePotion();save()}
function advanceBattle(){if(!battle||!battle.answered)return;if(!stats.hp){const failed=battle.id;endBattle();stats.hp=stats.max;stats.streak=0;say(['力尽きた……。直前の安全な場所まで下がった。','HPが回復した。もう一度挑戦できる。'],()=>{p.x=Math.max(110,p.x-100);safeSave()});return}if(battle.hp>0){nextQuestion();return}const id=battle.id;endBattle();stats.exp+=id==='bakuro'?30:6;const oldLevel=stats.lv;if(id==='second'&&stats.lv===1)stats.exp=Math.max(30,stats.exp);while(stats.exp>=30+Math.pow(stats.lv-1,2)*12&&stats.lv<99){stats.exp-=30+Math.pow(stats.lv-1,2)*12;stats.lv++;stats.max+=5;stats.hp=stats.max}const levelWords=stats.lv>oldLevel?['LEVEL UP!　Lv.'+oldLevel+' → Lv.'+stats.lv,'最大HP UP　'+stats.max+'　攻撃力 UP　HP全回復！']:[];if(id==='first'){story.firstBattle=true;say(['欠字獣の身体が崩れ、文字が一瞬だけ並んだ。','ありがとう','主人公「…………。」','主人公「今……。」','主人公「『ありがとう』って……。」','主人公が近づこうとすると、文字は消えた。','主人公「消えた……。」',...levelWords],safeSave)}else if(id==='second'){story.secondBattle=true;say(['魔物を倒した。経験値を得た。',...levelWords],safeSave)}else if(id==='coop'){story.coopBattle=true;say(['主人公「戦えるの？」','レン「たぶん。」','主人公「またそれか。」','レン「でも勝った。」','主人公「……まあな。」',...levelWords],safeSave)}else if(id==='late'){story.lateBattle=true;say(['魔物を倒した。二人で先へ進もう。',...levelWords],safeSave)}else{story.bakuroWon=true;say(['バクロの身体から、大量の文字が抜けていく。','ありがとう　ごめんなさい　約束　友達　名前','主人公「これ……。」','レン「文字が戻ってる。」','主人公「消えてた言葉……？」','文字は光のようになり、どこかへ消えていった。','主人公「待って！」','レン「消えた……。」','主人公「いや。」','主人公「本当に消えてたなら、戻ってくるはずない。」','レン「じゃあ……。」','主人公「どこかに残ってる？」','巨大な身体が縮み、怯えた小さな生き物が残った。','レン「こいつ……。」','主人公「何だ？」','レン「怖がってる。」','主人公「え？」','レン「こいつも。」','レン「忘れてたんじゃないか。」','主人公「魔物なのに？」','レン「…………。」','レン「最初から魔物だったのかな。」','小さなバクロは、石の陰へ逃げていった。','主人公「敵を倒したら、言葉が出てきた。」','レン「うん。」','主人公「しかも、あいつまで変わった。」','レン「…………。」','主人公「何が起きてるんだ。」','レン「分からない。」','主人公「だよな。」','レン「でも。」','主人公「ん？」','レン「先に行けば、何か分かるかもしれない。」','主人公「……うん。」',...levelWords],safeSave)}}
