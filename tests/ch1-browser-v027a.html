<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトバの塔・ブラウザ検査</title>
<style>body{font:16px system-ui;background:#111827;color:#eee;margin:20px}iframe{border:1px solid #777;display:block}section{margin:20px 0}#shots{display:flex;flex-wrap:wrap;gap:12px}.shot{width:300px}.shot img{width:300px;image-rendering:pixelated}#result{white-space:pre-wrap;padding:15px;border:2px solid #abc}.pass{color:#baffc6}.fail{color:#ffb0aa}</style>
<h1>コトバの塔・ブラウザ検査</h1><p>実際のCanvasと画像デコードを使い、教室から村までのイベントを検査します。操作用の検査機能は、この専用ページだけに含めています。</p>
<div id="result">検査中…</div><div id="shots"></div>
<section><h2>通常ブラウザ幅：1060px</h2><iframe title="通常幅" id="desktop" width="1060" height="720" src="ch1-fixture-v027a.html"></iframe></section>
<section><h2>スマートフォン幅：393px</h2><iframe title="スマホ幅" id="mobile" width="393" height="851" src="ch1-fixture-v027a.html"></iframe></section>
<script src="../scripts/ch1-check-flow.js"></script><script>
const result=document.querySelector('#result'),notes=[];
function assert(ok,message){if(!ok)throw Error(message)}
async function run(frame){if(!frame.contentWindow.__ch1Test)await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));const t=frame.contentWindow.__ch1Test,w=frame.contentWindow,d=frame.contentDocument;assert(!!t,'Test fixture available');await Promise.all(t.getImages().map(im=>im.complete?(assert(im.naturalWidth>0,'Image decode: '+im.src),Promise.resolve()):new Promise((resolve,reject)=>{im.addEventListener('load',resolve,{once:true});im.addEventListener('error',()=>reject(Error('Image loading failed: '+im.src)),{once:true})})));const outcome=checkChapter(t,assert,scene=>{t.draw(w.performance.now());const cv=d.querySelector('#field');const pixels=cv.getContext('2d').getImageData(0,0,960,640).data;const colors=new Set();for(let i=0;i<pixels.length;i+=400)colors.add(pixels[i]+','+pixels[i+1]+','+pixels[i+2]);assert(colors.size>30,'Colored map and sprite pixels: '+scene);if(frame.id==='mobile'){const card=document.createElement('div');card.className='shot';const caption=document.createElement('p');caption.textContent=scene;const image=document.createElement('img');image.alt=scene;image.src=cv.toDataURL();card.append(caption,image);document.querySelector('#shots').append(card)}});const box=d.querySelector('#app').getBoundingClientRect();assert(box.width<=w.innerWidth+2,'App fits viewport');assert(box.height<=w.innerHeight+2,'App height fits viewport');notes.push(frame.id+' PASS '+JSON.stringify(outcome)+' viewport '+w.innerWidth+'×'+w.innerHeight);}
(async()=>{try{for(const id of ['desktop','mobile'])await run(document.querySelector('#'+id));result.textContent=notes.join('\n');result.className='pass'}catch(e){result.textContent=notes.join('\n')+'\nFAIL '+e.message;result.className='fail';console.error(e)}})();
</script></html>
