 function shownClassNpcs(){return classNpcs.filter(n=>n.id==='aoi'?!story.aoiGone:(n.id==='yu'?!story.yuGone:!story.othersGone)).map(n=>n.id==='aoi'&&story.aoiAtDoor?{...n,x:128,y:386}:n)}
 function occlude(){for(const r of frontDesks){if(p.x>r[0]-26&&p.x<r[0]+r[2]+26&&p.y<r[1]+r[3]-6)g.drawImage(room,r[0]*.5,r[1]*.5,r[2]*.5,r[3]*.5,r[0],r[1],r[2],r[3])}}
 function draw(now=performance.now()){tickDialogue(now);const background=p.scene==='hall'?hall:room,hasBackground=background.complete&&background.naturalWidth;g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.clearRect(0,0,960,640);if(hasBackground)g.drawImage(background,0,0,background.naturalWidth,background.naturalHeight,0,0,960,640);else{g.fillStyle='#30251e';g.fillRect(0,0,960,640)}if(p.scene==='hall'){const layer=[...hallwayNpcs.map(n=>({y:n.y,draw:()=>drawStudent(n)})),{y:p.y,draw:()=>drawHero(now)}];layer.sort((a,b)=>a.y-b.y).forEach(item=>item.draw());if(story.anomaly){g.fillStyle='#11182a';g.globalAlpha=.08+Math.sin(now/130)*.018;g.fillRect(0,0,960,640);g.globalAlpha=1}}else{const layer=[...shownClassNpcs().map(n=>({y:n.y,draw:()=>drawStudent(n)})),{y:p.y,draw:()=>drawHero(now)}];layer.sort((a,b)=>a.y-b.y).forEach(item=>item.draw());if(hasBackground)occlude()}cv.setAttribute('aria-label',p.scene==='hall'?'校舎2階・廊下':'3年教室');hud.textContent='Lv 1　HP 30/30'+(story.notebook?'　KEY 1':'');requestAnimationFrame(draw)}
 function readMovementInput(){const running=!!keys.z,speed=running?5.2:2.65,dx=(keys.ArrowRight?speed:0)-(keys.ArrowLeft?speed:0),dy=(keys.ArrowDown?speed:0)-(keys.ArrowUp?speed:0);let direction=null;if(dx||dy)direction=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');return {dx,dy,direction,running}}
 function corridorY(y){return Math.max(210,Math.min(290,y))}
 function move(){p.moving=false;p.running=false;if(!started||dialogue.active)return;const input=readMovementInput();if(!input.direction)return;p.facingDirection=input.direction;const ox=p.x,oy=p.y;if(!blocked(p.x+input.dx,p.y))p.x+=input.dx;if(!blocked(p.x,p.y+input.dy))p.y+=input.dy;p.moving=p.x!==ox||p.y!==oy;p.running=p.moving&&input.running;if(p.scene==='class'&&story.phase==='explore'&&p.x<70&&classDoorZone(p.x,p.y)){changeScene('hall',850,corridorY(p.y),'2階の廊下に出た。')}else if(p.scene==='hall'&&p.x>866&&p.y>200&&p.y<300){changeScene('class',130,corridorY(p.y),'3年教室に戻った。')}else if(p.scene==='hall'&&story.phase==='hallNormal'&&p.x<610){beginAnomaly()}}
 function changeScene(scene,x,y,words){p.scene=scene;p.x=x;p.y=y;p.moving=false;p.running=false;if(scene==='hall'&&story.phase==='explore')story.phase='hallNormal';save();message(words)}
 function countInspect(id){story.inspects[id]=(story.inspects[id]||0)+1;return story.inspects[id]}
 function classInspect(){if(story.phase!=='explore'){message('今は、教室を出る気になれない。');return}if(Math.hypot(p.x-480,p.y-416)<92){const n=countInspect('aoiDesk');playDialogue(n===1?['アオイの机だ。','特に変わったところはない。']:['本当に何もない。','……何を調べてるんだ、俺は。']);save();return}if(p.y<245&&p.x>650){playDialogue(['ほうき。','ちりとり。','なぜか一本だけ壊れた傘。','学校の掃除用具入れには、だいたい何かいる。']);return}if(p.y<245&&p.x>550){playDialogue(['進路希望調査。','…………。','現実に戻される。']);return}if(p.y<245&&p.x>415){const n=countInspect('teacher');playDialogue(n===1?['プリントが山積みになっている。','……見なかったことにしよう。']:['まだ山積みだ。','当然である。']);save();return}if(p.y<245&&p.x>320){playDialogue(['黒板消しクリーナーだ。','吸い込みが弱い。','学校の黒板消しクリーナーは、だいたいこういうものだ。']);return}if(p.y<245&&p.x>150){playDialogue(['今日の日直の名前が残っている。','……消して帰れよ。']);return}message('放課後の教室は、少しだけ広く見える。')}
 function talkGlasses(){
  if(!story.anomaly){playDialogue(['眼鏡の生徒「今日の宿題、もう終わった？」','主人公「まだ。」','眼鏡の生徒「だよな。」']);return}
  story.glassesTalks+=1;
  if(story.glassesTalks>1){const later=story.glassesTalks%2===0?'まだ出てこない。':'何だったっけ……。';playDialogue([later]);save();return}
  playDialogue(['眼鏡の生徒「なあ。」','眼鏡の生徒「……あれ、何て言うんだっけ。」','主人公「何が？」','眼鏡の生徒「ほら。」','眼鏡の生徒「急いでやると、逆に失敗するっていう……。」','眼鏡の生徒「…………。」','眼鏡の生徒「出てこない。」','主人公「ことわざ？」','眼鏡の生徒「こと……？」','眼鏡の生徒「…………。」','主人公「おい。」'],save)
 }
 function talkGirls(){
  if(!story.anomaly){playDialogue(["女子生徒A「帰りに寄り道していかない？」","女子生徒B「だめ。今日は早く帰るって言ったでしょ。」"]);return}
  story.girlsTalks+=1;
  if(story.girlsTalks>1){playDialogue(["女子生徒A「絶対そっち。」","女子生徒B「絶対そっち。」"]);save();return}
  playDialogue(["女子生徒A「さっきからこの子、変なの。」","女子生徒B「そっちでしょ。」","女子生徒A「だから、あれ。」","女子生徒A「○○に○○っていう……。」","女子生徒B「……わたしも、出てこない。」","主人公「……何なんだよ。」"],save)
 }
 function inspect(){if(!started)return;if(dialogue.active){advanceDialogue();return}if(p.scene==='class'){classInspect();return}const npc=hallwayNpcs.find(n=>Math.hypot(p.x-n.x,p.y-n.y)<78);if(npc){if(npc.id==='glasses')talkGlasses();else if(npc.id==='girlRight'||npc.id==='girlLeft')talkGirls();else playDialogue([story.anomaly?'生徒「さっきまで、校庭から部活の声が聞こえてたのに。」':'生徒「今日は部活がにぎやかだな。」']);return}if(p.x<190){playDialogue(['古い階段は、校舎の地下へ続いている。']);return}message(story.anomaly?'静かすぎる廊下だ。':'冬の光が、廊下を長く照らしている。')}
 function startOpening(){playDialogue(['―― 放課後　3年○組 ――','ユウ「じゃ、先帰るわ。」','ユウ「また明日。」','主人公「おう。」','主人公「また明日。」'],()=>{story.yuGone=true;story.othersGone=true;story.phase='aoi';startAoi()})}
 function startAoi(){playDialogue(['主人公「帰らないの？」','アオイ「今帰る。」','アオイ「'+p.name+'は？」','主人公「もうちょっと残る。」',{text:'アオイ「……そっか。」',after:()=>{story.aoiAtDoor=true}},{text:'アオイ「ねえ。」'},{text:'主人公「ん？」'},{text:'アオイ「…………。」'},{text:'アオイ「やっぱ、いいや。」'},{text:'主人公「何だよ。」'},{text:'アオイ「別に。」'},{text:'アオイ「じゃあね。」'},{text:'主人公「……うん。」'}],()=>{story.aoiGone=true;playDialogue(['主人公「アオイ……。」'],startNotebook)})}
 function startNotebook(){playDialogue(['机の上に、国語ノートが置かれている。','《アオイの国語ノート》を手に入れた。','アオイから借りた国語のノート。\n返すのを忘れていた。','主人公「……明日返せばいいか。」'],()=>{story.notebook=true;story.phase='explore';save();message('教室を自由に調べよう。出口に近づくと廊下へ出られる。')})}
 function beginAnomaly(){story.anomaly=true;story.phase='anomaly';p.moving=false;p.running=false;save();playDialogue(['主人公「…………。」','さっきまで聞こえていた部活の声がしない。','主人公「……静かすぎないか？」'],()=>message('廊下の空気が、さっきまでと違う。'))}
 function waitForImage(image){const decoded=()=>{if(!image.naturalWidth)return Promise.resolve(false);return typeof image.decode==='function'?image.decode().then(()=>true,()=>true):Promise.resolve(true)};if(image.complete)return decoded();return new Promise(resolve=>{image.addEventListener('load',()=>decoded().then(resolve),{once:true});image.addEventListener('error',()=>resolve(false),{once:true})})}
 function beginGame(){p.x=494;p.y=560;p.scene='class';p.facingDirection='down';p.moving=false;p.running=false;story=freshStory();started=true;title.style.display='none';save();startOpening()}
 function begin(){if(starting)return;starting=true;p.name=document.querySelector('#name').value.trim()||'主人公';const button=document.querySelector('#start');button.disabled=true;button.textContent='読み込み中…';Promise.all([waitForImage(room),waitForImage(hall),waitForImage(hero),waitForImage(boy),waitForImage(glasses),waitForImage(girlRight),waitForImage(girlLeft)]).then(result=>{if(result.every(Boolean))beginGame();else{starting=false;button.disabled=false;button.textContent='冒険を始める';message('画像を読み込めませんでした。通信状態を確認して、もう一度試してください。')}})}
 document.querySelector('#start').onclick=begin;
 function controlKey(e){return ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)?e.key:['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)?e.code:e.key}
 addEventListener('keydown',e=>{const k=controlKey(e);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','z','Z'].includes(k))e.preventDefault();keys[k]=true;if(/^z$/i.test(k))keys.z=true;if(k===' ')inspect()});
 addEventListener('keyup',e=>{const k=controlKey(e);keys[k]=false;if(/^z$/i.test(k))keys.z=false});
 document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k===' ')inspect();else keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>keys[k]=false))});
 restore();setInterval(move,16);draw();
})();
</script>
