 function drawHero(now){if(!hero.complete||!hero.naturalWidth)return;const animation=DIRECTION_ANIMATIONS[p.facingDirection]||DIRECTION_ANIMATIONS.down,period=p.running?78:145,frame=p.moving?animation.frames[Math.floor(now/period)%animation.frames.length]:animation.frames[0],cell=362,depth=p.scene==='stairs'?Math.max(0,Math.min(1,(p.y-230)/350)):0,size=120*(1-depth*.22),footOffset=size*315/362;g.save();g.globalAlpha=.31;g.fillStyle='#172033';g.beginPath();g.ellipse(p.x,p.y+2,14*(size/120),5*(size/120),0,0,Math.PI*2);g.fill();g.filter='brightness(.91) saturate(.82) contrast(.93)';g.globalAlpha=.97;g.drawImage(hero,frame*cell,animation.row*cell,cell,cell,p.x-size/2,p.y-footOffset,size,size);g.restore()}
 function drawStudent(npc){if(!npc.image.complete||!npc.image.naturalWidth)return;const w=108,h=160;g.save();g.globalAlpha=.26;g.fillStyle='#172033';g.beginPath();g.ellipse(npc.x,npc.y+2,14,5,0,0,Math.PI*2);g.fill();g.globalAlpha=.97;g.drawImage(npc.image,npc.x-w/2,npc.y-h,w,h);g.restore()}
 function shownClassNpcs(){return classNpcs.filter(n=>n.id==='aoi'?!story.aoiGone:(n.id==='yu'?!story.yuGone:!story.othersGone)).map(n=>n.id==='aoi'&&story.aoiAtDoor?{...n,x:128,y:386}:n)}
 function occlude(){for(const r of frontDesks){if(p.x>r[0]-26&&p.x<r[0]+r[2]+26&&p.y<r[1]+r[3]-6)g.drawImage(room,r[0]*.5,r[1]*.5,r[2]*.5,r[3]*.5,r[0],r[1],r[2],r[3])}}
 function sceneBackground(){if(p.scene==='hall')return hall;if(p.scene==='stairs')return stairs;if(p.scene==='floor1')return floor1;if(p.scene==='library')return library;if(p.scene==='right')return story.stairsSeen?rightStairs:rightHall;return room}
 function draw(now=performance.now()){tickDialogue(now);const background=sceneBackground(),hasBackground=background.complete&&background.naturalWidth;g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.clearRect(0,0,960,640);if(hasBackground)g.drawImage(background,0,0,background.naturalWidth,background.naturalHeight,0,0,960,640);else{g.fillStyle='#30251e';g.fillRect(0,0,960,640)}if(readyToStart&&hasBackground){clearTimeout(startFallback);readyToStart=false;starting=false;started=true;title.style.display='none';startOpening()}if(p.scene==='hall'){const layer=[...hallwayNpcs.map(n=>({y:n.y,draw:()=>drawStudent(n)})),{y:p.y,draw:()=>drawHero(now)}];layer.sort((a,b)=>a.y-b.y).forEach(item=>item.draw());if(story.anomaly){g.fillStyle='#11182a';g.globalAlpha=.08+Math.sin(now/130)*.018;g.fillRect(0,0,960,640);g.globalAlpha=1}}else if(p.scene==='class'){const layer=[...shownClassNpcs().map(n=>({y:n.y,draw:()=>drawStudent(n)})),{y:258,draw:drawCleaner},{y:p.y,draw:()=>drawHero(now)}];layer.sort((a,b)=>a.y-b.y).forEach(item=>item.draw());if(hasBackground)occlude()}else{const layer=[];if((p.scene==='library'&&story.libraryIntro)||(p.scene==='right'&&story.stairsSeen))layer.push({y:486,draw:()=>drawStudent({x:p.scene==='library'?792:310,y:486,image:girlLeft})});layer.push({y:p.y,draw:()=>drawHero(now)});layer.sort((a,b)=>a.y-b.y).forEach(item=>item.draw())}cv.setAttribute('aria-label',p.scene==='class'?'3年教室':p.scene==='hall'?'校舎2階・廊下':p.scene==='stairs'?'校舎階段':p.scene==='library'?'図書室':'校舎1階・廊下');hud.textContent='Lv 1　HP 30/30'+(story.notebook?'　KEY 1':'');requestAnimationFrame(draw)}
 function readMovementInput(){const running=!!keys.z,speed=running?5.2:2.65,dx=(keys.ArrowRight?speed:0)-(keys.ArrowLeft?speed:0),dy=(keys.ArrowDown?speed:0)-(keys.ArrowUp?speed:0);let direction=null;if(dx||dy)direction=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');return {dx,dy,direction,running}}
 function corridorY(y){return Math.max(210,Math.min(290,y))}
 function move(){p.moving=false;p.running=false;if(!started||dialogue.active)return;const input=readMovementInput();if(!input.direction)return;p.facingDirection=input.direction;const ox=p.x,oy=p.y;if(!blocked(p.x+input.dx,p.y))p.x+=input.dx;if(!blocked(p.x,p.y+input.dy))p.y+=input.dy;p.moving=p.x!==ox||p.y!==oy;p.running=p.moving&&input.running;if(p.scene==='class'&&story.phase==='explore'&&p.x<70&&classDoorZone(p.x,p.y)){changeScene('hall',850,corridorY(p.y),'2階の廊下に出た。')}else if(p.scene==='hall'&&p.x>866&&p.y>200&&p.y<300){changeScene('class',130,corridorY(p.y),'3年教室に戻った。')}else if(p.scene==='hall'&&story.phase==='hallNormal'&&p.x<610){beginAnomaly()}else if(p.scene==='hall'&&story.phase==='anomaly'&&p.x<86&&p.y<390){enterStairs()}else if(p.scene==='stairs'&&p.y>570){changeScene('floor1',150,510,'1階に降りた。')}else if(p.scene==='stairs'&&p.y<235){changeScene('hall',110,330,'2階の廊下に戻った。')}else if(p.scene==='floor1'&&p.x<110&&p.y<420){changeScene('stairs',480,550,'階段へ戻った。')}else if(p.scene==='floor1'&&p.x>390&&p.x<620&&p.y<405){enterLibrary()}else if(p.scene==='floor1'&&p.x>875){if(story.libraryReady)changeScene('right',105,505,'右側の廊下へ進んだ。');else message('先に図書室の様子を見てみよう。')}else if(p.scene==='library'&&p.y>570){leaveLibrary()}else if(p.scene==='right'&&!story.stairsSeen&&p.x>575){revealStairs()}else if(p.scene==='right'&&p.x<82){changeScene('floor1',850,510,'1階中央の廊下に戻った。')}}
 function changeScene(scene,x,y,words){p.scene=scene;p.x=x;p.y=y;p.moving=false;p.running=false;if(scene==='hall'&&story.phase==='explore')story.phase='hallNormal';save();message(words)}
 function countInspect(id){story.inspects[id]=(story.inspects[id]||0)+1;return story.inspects[id]}
 function classInspect(){if(story.phase!=='explore')return;if(Math.hypot(p.x-480,p.y-416)<76){const n=countInspect('aoiDesk');playDialogue(n===1?['アオイの机だ。','特に変わったところはない。']:['本当に何もない。','……何を調べてるんだ、俺は。']);save();return}if(Math.hypot(p.x-588,p.y-270)<72){playDialogue(['黒板消しクリーナーだ。','吸い込みが弱い。','学校の黒板消しクリーナーは、だいたいこういうものだ。']);return}if(p.x>405&&p.x<545&&p.y>210&&p.y<330){const n=countInspect('teacher');playDialogue(n===1?['プリントが山積みになっている。','……見なかったことにしよう。']:['まだ山積みだ。','当然である。']);save();return}if(p.x>305&&p.x<655&&p.y<205){playDialogue(['今日の日直の名前が残っている。','……消して帰れよ。']);return}if(p.x>655&&p.x<790&&p.y<210){playDialogue(['進路希望調査。','…………。','現実に戻される。']);return}if(p.x>790&&p.y<225){playDialogue(['ほうき。','ちりとり。','なぜか一本だけ壊れた傘。','学校の掃除用具入れには、だいたい何かいる。']);return}}
 function talkGlasses(){
  if(!story.anomaly){playDialogue(['眼鏡の生徒「今日の宿題、もう終わった？」','主人公「まだ。」','眼鏡の生徒「だよな。」']);return}
  story.glassesTalks+=1;
  if(story.glassesTalks>1){const later=story.glassesTalks%2===0?'まだ出てこない。':'何だったっけ……。';playDialogue([later]);save();return}
  playDialogue(['眼鏡の生徒「なあ。」','眼鏡の生徒「……あれ、何て言うんだっけ。」','主人公「何が？」','眼鏡の生徒「ほら。」','眼鏡の生徒「急いでやると、逆に失敗するっていう……。」','眼鏡の生徒「…………。」','眼鏡の生徒「出てこない。」','主人公「ことわざ？」','眼鏡の生徒「こと……？」','眼鏡の生徒「…………。」','主人公「おい。」'],save)
 }
 function talkGirls(){
  if(!story.anomaly){playDialogue(["女子生徒A「帰りに寄り道していかない？」","女子生徒B「だめ。今日は早く帰るって言ったでしょ。」"]);return}
  story.girlsTalks+=1;
  if(story.girlsTalks>1){playDialogue(["女子生徒A「絶対そっち。」","女子生徒B「絶対そっち。」"]);save();return}
  playDialogue(["女子生徒A「さっきからこの子、変なの。」","女子生徒B「そっちでしょ。」","女子生徒A「だから、あれ。」","女子生徒A「○○に○○っていう……。」","女子生徒B「……わたしも、出てこない。」","主人公「……何なんだよ。」"],save)
 }
 function enterStairs(){story.phase='stairs';changeScene('stairs',480,240,'階段を下りる。');if(!story.stairsIntro){story.stairsIntro=true;playDialogue(['主人公「下に行けば、誰かいるか。」','主人公「…………。」','やっぱり静かだ。'],save)}}
 function floor1Inspect(){if(p.x>690&&p.y<420){const n=countInspect('toilet');playDialogue(n===1?['トイレだ。','別に行きたくない。']:n===2?['だから行かないって。']:['誰もいないはずなのに、水の音がする。','主人公「…………。」','主人公「行かない。」']);save();return}if(p.x>535&&p.x<685&&p.y<420){enterLibrary();return}if(p.x>410&&p.x<535&&p.y<420){const n=countInspect('schoolMap');playDialogue(n===1?['学校案内図だ。','【1F】　職員室　図書室　保健室','【2F】　3年教室　特別教室','主人公「地下は……。」','ない。']:['案内図に、地下の表記はない。']);save();return}if(p.x>270&&p.x<410&&p.y<420){const n=countInspect('staff');playDialogue(n===1?['職員室だ。','…………。','誰もいない。','主人公「先生もいないのか……。」']:['職員室に、人の気配はない。']);save();return}if(p.x<250&&p.y<420){const n=countInspect('window');playDialogue(n===1?['掲示物「提出物は期限を守ること！」','主人公「…………。」','主人公「見なかったことにしよう。」']:['消火器だ。','使う日が来ないことを願う。']);save();return}if(p.x>720){const n=countInspect('lost');playDialogue(n===1?['片方だけの手袋。','名前のない水筒。','短すぎる鉛筆。','主人公「持ち主のところへ帰れるのだろうか。」']:['高校説明会のお知らせ。','主人公「その前にここから帰らないとな。」']);save();return}message('1階の廊下も、いつもより静かだ。')}
 function libraryInspect(){if(Math.hypot(p.x-792,p.y-486)<110){const n=countInspect('libraryGirl');if(n===1)playDialogue(['女子生徒が、こちらを見ている。']);else if(n===2)playDialogue(['女子生徒「何で急に名前なんだよ、って顔してる。」','主人公「何で急に名前なんだよ。」','女子生徒「…………。」','女子生徒「分からない。」','主人公「え？」','女子生徒「なんとなく。」','女子生徒「言ってもらわなきゃいけない気がした。」','主人公「…………。」']);else playDialogue(['女子生徒「気をつけて。」']);save();return}if(p.x>650&&p.y<440){const n=countInspect('choir');const flyer=['『2026年度　合唱コンクール』','','3年1組「君とみた海」','3年2組「鱗」','3年3組「友 ～旅立ちの時～」','3年4組「花瓶の花」'];playDialogue(n===1?[...flyer,'……もうそんな時期か。']:n===2?[...flyer,'どのクラスも、毎日遅くまで練習していた。']:[...flyer,'廊下まで歌声が聞こえていた気がする。','主人公「そういえば。」','主人公「今は何も聞こえない。」']);save();return}if(p.x<330&&p.y<430){const n=countInspect('romance');playDialogue(n===1?['恋愛小説が並んでいる。']:n===2?['主人公には関係ない。']:['……たぶん。']);save();return}if(p.x>440&&p.x<620&&p.y<430){const n=countInspect('dictionary');playDialogue(n===1?['分厚い辞書だ。','武器にしたら強そうだ。']:['やめておこう。','女子生徒「やめて。」','主人公「まだ何もしてない。」']);save();return}if(p.x<280&&p.y>440){playDialogue(['『高校入試　国語』','主人公「今はそれどころじゃない。」']);return}message('棚の本のどこかに、空白が残っている。')}
 function rightInspect(){if(story.stairsSeen&&Math.hypot(p.x-310,p.y-486)<110){playDialogue(['女子生徒「無理しないで。」']);return}if(story.stairsSeen&&p.x>590&&p.y<440){playDialogue(['古い石の階段が、下へ続いている。','まだ、その先へ進むことはできない。']);return}message(story.stairsSeen?'学校の壁に、あり得ない階段がある。':'夕日の長い影が、廊下に伸びている。')}
 function inspect(){if(!started)return;if(dialogue.active){advanceDialogue();return}if(p.scene==='class'){classInspect();return}if(p.scene==='hall'){const npc=hallwayNpcs.find(n=>Math.hypot(p.x-n.x,p.y-n.y)<78);if(npc){if(npc.id==='glasses')talkGlasses();else if(npc.id==='girlRight'||npc.id==='girlLeft')talkGirls();else playDialogue([story.anomaly?'生徒「さっきまで、校庭から部活の声が聞こえてたのに。」':'生徒「今日は部活がにぎやかだな。」']);return}if(p.x<190){playDialogue(['左の階段へ下りれば、1階へ行けそうだ。']);return}message(story.anomaly?'静かすぎる廊下だ。':'冬の光が、廊下を長く照らしている。');return}if(p.scene==='stairs'){if(p.y<350&&Math.abs(p.x-480)<180){const n=countInspect('stairWindow');playDialogue(n===1?['グラウンドが見える。','…………。','誰もいない。','主人公「さっきまで部活してたよな……。」']:['窓の外に、人影はない。']);save();return}message('階段を下りる。');return}if(p.scene==='floor1'){floor1Inspect();return}if(p.scene==='library'){libraryInspect();return}rightInspect()}
 function enterLibrary(){if(p.scene!=='library'){changeScene('library',500,535,'図書室に入った。')}if(story.libraryIntro)return;story.libraryIntro=true;playDialogue(['主人公「いた。」','女子生徒「'+p.name+'？」','女子生徒「まだ学校にいたの？」','主人公「それ、こっちのセリフ。」','女子生徒「ちょっと来て。」','女子生徒が、一冊の本を見せてきた。','「猿も　から　ちる」','主人公「……印刷ミス？」','女子生徒「違う。」','別の本も、文字の一部が空白になっている。','主人公「辞書……。」','見出し語と説明の一部まで、不自然に欠けている。','女子生徒「さっきまではあった。」','主人公「本当に？」','女子生徒「うん。」','女子生徒「みんなが忘れてるだけじゃない。」','女子生徒「本まで忘れてる。」','女子生徒「'+p.name+'。」','主人公「何？」','女子生徒「自分の名前、言ってみて。」','主人公「'+p.name+'。」','女子生徒「……よかった。」','主人公「何が。」','女子生徒「まだ自分を忘れてない。」','主人公「…………。」'],()=>{story.libraryReady=true;save();message('図書室を自由に調べられる。')})}
 function leaveLibrary(){if(!story.libraryReady)return;playDialogue(['主人公「他にも何か変わってないか見てくる。」','女子生徒「気をつけて。」'],()=>changeScene('floor1',540,520,'図書室を出た。'))}
 function revealStairs(){story.stairsSeen=true;p.x=565;p.moving=false;p.running=false;save();playDialogue(['主人公「…………。」','主人公「何だ、これ。」','主人公「ちょっと来て。」','女子生徒「何？」','主人公「これ。」','女子生徒「何？」','主人公「階段。」','女子生徒「…………。」','女子生徒「何言ってるの？」','主人公「え？」','女子生徒「そこ、壁だけど。」','主人公「見えないの？」','女子生徒「……何もない。」','主人公「学校の案内図に地下はなかった。」','女子生徒「だったら行かない方がいい。」','主人公「…………。」','主人公「でも。」','主人公「みんな言葉がおかしくなってる。」','主人公「本の文字まで消えてる。」','主人公「ここだけ何も関係ないとは思えない。」','女子生徒「'+p.name+'。」','主人公「少しだけ見てくる。」','女子生徒「…………。」','女子生徒「無理しないで。」','主人公「うん。」'],()=>message('古い石の階段が、主人公にだけ見えている。'))}
 function startOpening(){playDialogue(['―― 放課後　3年○組 ――','ユウ「じゃ、先帰るわ。」','ユウ「また明日。」','主人公「おう。」','主人公「また明日。」'],()=>{story.yuGone=true;story.othersGone=true;story.phase='aoi';startAoi()})}
 function startAoi(){playDialogue(['主人公「帰らないの？」','アオイ「今帰る。」','アオイ「'+p.name+'は？」','主人公「もうちょっと残る。」',{text:'アオイ「……そっか。」',after:()=>{story.aoiAtDoor=true}},{text:'アオイ「ねえ。」'},{text:'主人公「ん？」'},{text:'アオイ「…………。」'},{text:'アオイ「やっぱ、いいや。」'},{text:'主人公「何だよ。」'},{text:'アオイ「別に。」'},{text:'アオイ「じゃあね。」'},{text:'主人公「……うん。」'}],()=>{story.aoiGone=true;playDialogue(['主人公「アオイ……。」'],startNotebook)})}
 function startNotebook(){playDialogue(['机の上に、国語ノートが置かれている。','《アオイの国語ノート》を手に入れた。','アオイから借りた国語のノート。\n返すのを忘れていた。','主人公「……明日返せばいいか。」'],()=>{story.notebook=true;story.phase='explore';save();message('教室を自由に調べよう。出口に近づくと廊下へ出られる。')})}
 function beginAnomaly(){story.anomaly=true;story.phase='anomaly';p.moving=false;p.running=false;save();playDialogue(['主人公「…………。」','さっきまで聞こえていた部活の声がしない。','主人公「……静かすぎないか？」'],()=>message('廊下の空気が、さっきまでと違う。'))}
 function waitForImage(image){const decoded=()=>{if(!image.naturalWidth)return Promise.resolve(false);return typeof image.decode==='function'?image.decode().then(()=>true,()=>true):Promise.resolve(true)};if(image.complete)return decoded();return new Promise(resolve=>{image.addEventListener('load',()=>decoded().then(resolve),{once:true});image.addEventListener('error',()=>resolve(false),{once:true})})}
 function beginGame(){p.x=494;p.y=560;p.scene='class';p.facingDirection='down';p.moving=false;p.running=false;story=freshStory();readyToStart=true;save()}
 function begin(){if(starting)return;starting=true;p.name=document.querySelector('#name').value.trim()||'主人公';const button=document.querySelector('#start');button.disabled=true;button.textContent='読み込み中…';beginGame();startFallback=setTimeout(()=>{if(!readyToStart)return;readyToStart=false;starting=false;button.disabled=false;button.textContent='冒険を始める';document.querySelector('.hint').textContent='背景を読み込めませんでした。通信状態を確認して、もう一度押してください。'},8000)}
 document.querySelector('#start').onclick=begin;
 function controlKey(e){return ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)?e.key:['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)?e.code:e.key}
 addEventListener('keydown',e=>{const k=controlKey(e);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar','Enter','z','Z'].includes(k))e.preventDefault();keys[k]=true;if(/^z$/i.test(k))keys.z=true;if(k===' '||k==='Spacebar'||k==='Enter')inspect()});
 addEventListener('keyup',e=>{const k=controlKey(e);keys[k]=false;if(/^z$/i.test(k))keys.z=false});
 document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k===' ')inspect();else keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>keys[k]=false))});
 cv.addEventListener('pointerup',e=>{if(dialogue.active){e.preventDefault();inspect()}});
 restore();setInterval(move,16);draw();
})();
