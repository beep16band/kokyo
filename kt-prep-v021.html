<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトバの塔 ― v0.21</title><style>
html,body{margin:0;height:100%;background:#060a13;color:#fff;font-family:"Yu Gothic",sans-serif}body{display:grid;place-items:center;overflow:hidden}#app{position:relative;width:min(100vw,1100px);height:min(100vh,720px);display:grid;grid-template-rows:45px 1fr 74px;background:#0c1834;border:4px solid #d9b960;box-shadow:0 0 0 4px #34466e}header{display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-bottom:2px solid #d9b960}header b{color:#fff0a4}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#183d31}#msg{margin:8px 12px;border:3px solid #f4ecd4;box-shadow:inset 0 0 0 2px #51617d;background:#07132b;padding:8px 12px;line-height:1.4;font-size:14px;overflow:auto}#title,#battle{position:absolute;inset:45px 0 74px;z-index:5;display:grid;place-items:center;background:#071127d9}.box{width:min(90%,650px);padding:22px;text-align:center;background:#12244d;border:4px solid #d9b960;box-shadow:0 0 0 4px #354b75}.box h1{color:#fff0a4;margin:0}.box p{line-height:1.7}button,input{font:inherit;padding:9px 14px}button{color:white;background:#315988;border:2px solid #f0d789;cursor:pointer}button:hover{background:#4e7ab5}#battle{display:none;align-content:center;gap:8px;padding:16px;background:radial-gradient(ellipse at 50% 25%,#3b416f,#081027 70%)}#bname{color:#fff0a4;font-weight:bold}#boss{width:210px;height:150px;object-fit:contain;filter:drop-shadow(0 9px 4px #000);image-rendering:pixelated;justify-self:center}#question{max-width:780px;width:100%;padding:12px;border:3px solid #f1e7c9;background:#0a1732;line-height:1.55;font-weight:bold}.choices{max-width:780px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{text-align:left;min-height:48px}@media(max-width:600px){#app{height:100vh;border-width:2px}.choices{grid-template-columns:1fr}#boss{height:100px}}

#app{min-width:0;min-height:0}canvas{min-width:0;min-height:0}header>*{min-width:0}header b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#hud{white-space:nowrap;font-size:12px}@media(max-width:600px){html,body{width:100%;height:100dvh}body{display:block}#app{width:100vw;height:100dvh;max-width:none;max-height:none;border:0;box-shadow:none;grid-template-rows:42px minmax(0,1fr) 104px}header{gap:8px;padding:0 8px;font-size:12px}header b{max-width:58vw}#hud{font-size:10px}#msg{margin:6px 7px;padding:7px 8px;font-size:12px}#title,#battle{inset:42px 0 104px}.box{width:calc(100% - 24px);padding:16px 12px}.box h1{font-size:22px}.box p{margin:9px 0;font-size:14px}#battle{padding:9px}#question{font-size:14px;padding:9px}.choices button{font-size:13px;min-height:42px}}
</style><style>@media(max-width:600px){#title{display:grid;place-items:start center;align-content:start;overflow-y:auto;padding:12px 0;box-sizing:border-box}#title .box{margin:auto 0}}</style><body><main id="app"><header><b>コトバの塔　― 第1章 言い回しの庭 ―</b><span id="hud"></span></header><canvas id="field" width="960" height="600"></canvas><div id="msg">矢印キーで移動。Z＋矢印でダッシュ。Spaceで調べる。</div><section id="title"><div class="box"><h1>コトバの塔<br>― 入試国語 最終試練 ―</h1><p>言葉を失った学校から、<br>「知っているつもり」の魔物を追って旅立とう。</p><input id="name" maxlength="12" placeholder="ニックネーム"><p><button id="start">冒険を始める</button></p><small>ブラウザに自動保存／外部通信なし</small></div></section><section id="battle"><div id="bname"></div><img id="boss" src="assets/kotoba-tower/kanyoku-slime-battle-v2.png"><div id="question"></div><div class="choices" id="choices"></div></section></main><script>
(()=>{const cv=document.querySelector('#field'),g=cv.getContext('2d'),msg=document.querySelector('#msg'),hud=document.querySelector('#hud'),T=new Image(),D=new Image(),H=new Image(),E=new Image();T.src='assets/kotoba-tower/tiles_terrain.png';D.src='assets/kotoba-tower/tiles_outdoor.png';H.src='assets/kotoba-tower/hero-v2-front.png';E.src='assets/kotoba-tower/kanyoku-slime-field-v2.png';const SAVE='kotobaTowerV021';const qs=[['「口が重い」の意味は？',['よく話す','なかなか話さない','食べるのが遅い','病気になる'],1,'話したいことがあっても、なかなか言わない様子。'],['「耳が痛い」の意味は？',['聞こえない','注意されてつらい','耳が病気','声が大きい'],1,'自分の欠点を指摘され、聞くのがつらいこと。'],['「手が離せない」の意味は？',['手をけがした','とても忙しい','手伝いがない','別れる'],1,'ほかのことができないほど忙しいこと。'],['「腰を据える」の意味は？',['座る','落ち着いて取り組む','休憩する','逃げる'],1,'じっくり落ち着いて取り組むこと。'],['「水に流す」の意味は？',['川へ捨てる','過去の争いをなかったことにする','秘密を話す','忘れ物を探す'],1,'過去の争いや失敗を責めず、なかったことにする意味。'],['文脈に合う慣用句を選びなさい。\n「何度注意しても、弟には（　）。」',['耳が痛い','手を焼く','頭が上がらない','目を通す'],1,'「手を焼く」は、扱いに困るという意味。'],['文脈に合う慣用句を選びなさい。\n「先生の助言は、今の私には（　）話だった。」',['耳が痛い','首を長くする','水に流す','顔が広い'],0,'欠点を指摘するような助言は「耳が痛い」。']];let p={scene:'class',x:15,y:15,hp:30,max:30,lv:1,exp:0,correct:0,total:0,streak:0,seen:[],boss:false,name:'',save:{scene:'class',x:15,y:15}},keys={},lock=0,b=null;const trees=[[7,6],[12,17],[20,5],[26,16],[31,7],[41,17],[47,5],[54,17],[61,6],[67,17]],rocks=[[29,5],[51,15]],foes=[{x:18,y:12,on:1},{x:31,y:12,on:1},{x:43,y:12,on:1},{x:55,y:12,on:1}];function save(){localStorage.setItem(SAVE,JSON.stringify(p))}function need(){return Math.floor(25+p.lv*p.lv*2.5)}function level(){while(p.exp>=need()&&p.lv<99){p.exp-=need();p.lv++;p.max+=4;p.hp=p.max;msg.textContent='レベルが上がった！　Lv '+p.lv+'　HPが全回復した。'}}function tx(sx,sy,x,y,w=1,h=1){g.drawImage(T,sx,sy,256,256,x*32,y*32,w*32,h*32)}function hero(){g.drawImage(H,0,0,H.width,H.height,p.x*32-14,p.y*32-46,56,84)}function tree(x,y,front){g.drawImage(D,0,0,256,front?158:256,x*32,y*32,96,front?60:115)}function room(){for(let y=0;y<19;y++)for(let x=0;x<30;x++)tx(p.scene==='under'?1792:0,0,x,y);for(let x=0;x<30;x++){tx(1536,0,x,0);tx(1536,0,x,18)}for(let y=0;y<19;y++){tx(1536,0,0,y);tx(1536,0,29,y)}if(p.scene==='class'){g.fillStyle='#174b42';g.fillRect(160,64,330,54);for(let y=7;y<16;y+=3)for(let x=4;x<17;x+=3){g.fillStyle='#754c35';g.fillRect(x*32,y*32,42,18)}}if(p.scene==='library'){for(let x=4;x<26;x+=6){g.fillStyle='#60402f';g.fillRect(x*32,85,94,250);for(let n=0;n<5;n++){g.fillStyle=['#b64b45','#d2a94d','#4a78a6','#5f976e','#8a5b9f'][n];g.fillRect(x*32+9,105+n*38,75,14)}}}if(p.scene==='under'){for(let x=4;x<27;x+=5){g.fillStyle='#dfa953';g.fillRect(x*32,75,9,375)}}hero()}function world(){let cam=Math.max(0,Math.min(42,p.x-15));g.save();g.translate(-cam*32,0);for(let y=0;y<19;y++)for(let x=0;x<72;x++)tx(0,0,x,y);for(let x=1;x<71;x++)tx(1280,0,x,12);for(let y=3;y<18;y++)tx(1280,0,5,y);for(let y=2;y<18;y++){tx(0,512,35,y);tx(0,512,36,y)}tx(1280,512,35,12,2,2);for(let x=62;x<72;x++)tx(1792,0,x,12);rocks.forEach(r=>g.drawImage(D,0,512,256,256,r[0]*32,r[1]*32,64,64));trees.forEach(t=>tree(t[0],t[1],0));g.drawImage(D,1280,512,256,256,10*32,14*32,64,64);g.fillStyle='#70e7ff';g.fillRect(14*32+12,7*32,9,59);g.fillStyle='#f1ffff';g.fillRect(14*32+15,7*32,3,59);g.drawImage(D,1280,768,256,256,66*32,8*32,96,96);foes.forEach(f=>f.on&&g.drawImage(E,0,0,E.width,E.height,f.x*32-10,f.y*32-26,48,62));hero();trees.forEach(t=>tree(t[0],t[1],1));g.restore()}function draw(){g.clearRect(0,0,960,600);p.scene==='world'?world():room();hud.textContent='Lv '+p.lv+'　HP '+p.hp+'/'+p.max+'　EXP '+p.exp;requestAnimationFrame(draw)}function near(a,b){return Math.hypot(p.x-a,p.y-b)<.8}function blocked(x,y){if(p.scene!=='world')return x<1||x>28||y<1||y>17; if(x<1||x>71||y<1||y>17)return 1;if(x>34&&x<37&&Math.abs(y-12)>1)return 1;for(const t of trees)if(x>t[0]+.55&&x<t[0]+2.45&&y>t[1]+1.65&&y<t[1]+3.45)return 1;for(const r of rocks)if(x>r[0]&&x<r[0]+1.8&&y>r[1]&&y<r[1]+1.7)return 1}function scene(s,x,y,t){p.scene=s;p.x=x;p.y=y;p.save={scene:s,x,y};save();msg.textContent=t}function talk(){if(p.scene==='class'&&p.y<3)scene('hall',15,15,'廊下の先から、言葉が消えたような静けさがする。図書室へ向かおう。');else if(p.scene==='hall'&&p.x<3)scene('library',15,15,'図書室。奥の本棚に、見慣れない古い本がある。');else if(p.scene==='library'&&p.y<3)scene('under',15,15,'本棚の奥に隠し通路が現れた。古い地下回廊へ降りる。');else if(p.scene==='under'&&p.y<3)scene('world',5,12,'学校裏庭に出た。道は町外れ、小川、言葉の森を経て神殿へ続いている。');else if(p.scene==='world'&&near(14,8)){p.save={scene:'world',x:14,y:8};p.hp=p.max;save();msg.textContent='蒼い灯が記録帳を照らした。HPが全回復し、ここをセーブ地点にした。'}else if(p.scene==='world'&&p.x>64&&p.y>7&&p.y<14){if(p.correct<4)msg.textContent='庭の神殿の門は閉ざされている。守護者の言葉を4つ取り戻そう。';else if(!p.boss)fight(1);else msg.textContent='ブルームは静かに花を咲かせている。意味の鍵が次の門を照らす。'}else if(p.scene==='world'&&near(10,15))msg.textContent='古井戸の底から声がする。「意味を確かめる者に、道は開く。」'}function move(){if(lock||document.querySelector('#title').style.display!=='none')return;let s=keys.z?.16:.09,dx=keys.ArrowRight?s:keys.ArrowLeft?-s:0,dy=keys.ArrowDown?s:keys.ArrowUp?-s:0;if(dx||dy){let X=p.x+dx,Y=p.y+dy;if(!blocked(X,Y)){p.x=X;p.y=Y}}if(p.scene==='hall'&&p.x>27&&p.y<4)scene('class',15,15,'3年教室に戻った。');if(p.scene==='hall'&&p.x>27&&p.y>12)scene('world',5,12,'校舎の外へ出た。');if(p.scene==='world')for(const f of foes)if(f.on&&near(f.x,f.y)){f.on=0;fight(0);break}}function fight(boss){lock=1;b={boss,hp:boss?15:4,max:boss?15:4};document.querySelector('#battle').style.display='grid';next()}function next(){let ids=qs.map((_,i)=>i).filter(i=>!p.seen.includes(i));if(!ids.length)ids=qs.map((_,i)=>i);let id=ids[Math.random()*ids.length|0],q=qs[id];p.seen.push(id);b.q=q;document.querySelector('#bname').textContent=(b.boss?'言い回しの守護者《ブルーム》':'慣用句スライム')+'　敵HP '+b.hp+'/'+b.max+'　連続正解 '+p.streak;document.querySelector('#question').textContent=q[0];let e=document.querySelector('#choices');e.innerHTML='';q[1].forEach((z,i)=>{let v=document.createElement('button');v.textContent='ABCD'[i]+'　'+z;v.onclick=()=>judge(i);e.append(v)})}function judge(i){let q=b.q,ok=i===q[2];document.querySelectorAll('#choices button').forEach(x=>x.disabled=1);p.total++;if(ok){p.correct++;p.streak++;let d=1+(p.streak/3|0);b.hp-=d;p.exp+=5+d*2;msg.textContent='正解！　'+q[3]+'　'+d+'ダメージ。'}else{p.streak=0;p.hp=Math.max(0,p.hp-5);msg.textContent='不正解。正解は「'+q[1][q[2]]+'」。'+q[3]+'　HPが5減った。'}level();setTimeout(()=>{if(!p.hp){p.hp=p.max;scene(p.save.scene,p.save.x,p.save.y,'力尽きた……。最後のセーブ地点に戻った。');end()}else if(b.hp<=0){if(b.boss){p.boss=1;p.exp+=40;level();msg.textContent='ブルーム「私は、言葉を守っていた。だが、人々が意味を考えなくなった。」\n意味の鍵を手に入れた。記録帳：『意味を知ることは、考えることの始まり。』'}else msg.textContent='魔物を倒した。経験値を得た。';save();end()}else next()},850)}function end(){document.querySelector('#battle').style.display='none';lock=0}document.querySelector('#start').onclick=()=>{p.name=document.querySelector('#name').value.trim()||'ことば勇者';document.querySelector('#title').style.display='none';msg.textContent='先生「一番怖いのは、知らないことではない。知っているつもりになることだ。」';save()};try{let o=JSON.parse(localStorage.getItem(SAVE));if(o){p={...p,...o};document.querySelector('#name').value=p.name||''}}catch(e){}addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','z','Z'].includes(e.key))e.preventDefault();keys[e.key]=1;if(/z/i.test(e.key))keys.z=1;if(e.key===' '&&!lock){lock=1;talk();setTimeout(()=>lock=0,180)}});addEventListener('keyup',e=>{keys[e.key]=0;if(/z/i.test(e.key))keys.z=0});setInterval(move,16);draw()})();</script></body></html>
